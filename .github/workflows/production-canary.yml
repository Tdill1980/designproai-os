name: Run current A.T.L.A.S. graph production canary

# Authors one current A.T.L.A.S. design and returns every artifact the graph
# actually produced. The canary bootstraps its own confirmed operator/customer
# identities in the isolated Supabase Auth project. It intentionally proves the
# protected owner-promotion path without a Stripe dependency; it never fakes a
# payment or marks a row paid.
#
# Calls 8 and 12 use their real configured providers. The canary is therefore
# bounded by the production workflow itself and must never be treated as a mock.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Protected action — runs a real production workflow on the droplet"
        required: true
        type: choice
        default: DO_NOT_RUN
        options:
          - DO_NOT_RUN
          - RUN_PRODUCTION_CANARY
      vehicle_type:
        required: true
        type: string
        default: truck
      vehicle_year:
        required: true
        type: string
        default: "2020"
      vehicle_make:
        required: true
        type: string
        default: Ford
      vehicle_model:
        required: true
        type: string
        default: F250 Crew Cab 6.5ft Box

permissions:
  contents: read

concurrency:
  group: designproai-production-canary
  cancel-in-progress: false

env:
  TARGET_HOST: 137.184.0.4
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng

jobs:
  canary:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RUN_PRODUCTION_CANARY'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Prove protected intent
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "${{ inputs.confirmation }}" = "RUN_PRODUCTION_CANARY"
          test -n "$SSH_PRIVATE_KEY"

      - name: Pin the droplet SSH identity
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_ssh"
          public_key="$RUNNER_TEMP/designproai_ssh.pub"
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          fail() { local code="$1"; shift; printf '::error title=SSH identity pin::%s\n' "$*" >&2; exit "$code"; }

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          ssh-keygen -y -f "$key_file" > "$public_key" 2>/dev/null || fail 31 "automation private key could not be parsed"
          observed=$(ssh-keygen -lf "$public_key" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')
          [[ $observed == "$EXPECTED_AUTOMATION_KEY_FINGERPRINT" ]] || fail 38 "automation key fingerprint does not match the protected pin"

          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts" || fail 33 "host-key scan failed"
          [[ -s $known_hosts ]] || fail 34 "host-key scan returned nothing"
          mapfile -t host_fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 2>/dev/null | awk '{print $2}' | sort -u)
          [[ ${#host_fingerprints[@]} -eq 1 ]] || fail 36 "ambiguous host key"
          [[ ${host_fingerprints[0]} == "$EXPECTED_HOST_FINGERPRINT" ]] || fail 37 "host fingerprint does not match the protected pin"

          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Run the current A.T.L.A.S. graph canary
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          CANARY_YEAR: ${{ inputs.vehicle_year }}
          CANARY_MAKE: ${{ inputs.vehicle_make }}
          CANARY_MODEL: ${{ inputs.vehicle_model }}
          CANARY_TYPE: ${{ inputs.vehicle_type }}
          CANARY_EMAIL: atlas-canary-customer@designproai.com
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          ssh_args=(-i "$KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                    -o "UserKnownHostsFile=$KNOWN_HOSTS" -o ServerAliveInterval=30 -o ServerAliveCountMax=20)
          payload=$(tar -cz scripts/production-canary.mjs | base64 -w0)

          set +e
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "PAYLOAD='$payload' \
             EXPECTED_SHA='$EXPECTED_RELEASE_SHA' \
             YEAR='$CANARY_YEAR' MAKE='$CANARY_MAKE' MODEL='$CANARY_MODEL' \
             VTYPE='$CANARY_TYPE' CEMAIL='$CANARY_EMAIL' bash -s" \
            > "$RUNNER_TEMP/canary.log" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          release=/opt/designproai-os/current
          test -d "$release" || { echo "no deployed release at $release"; exit 40; }
          test -f /opt/designproai-os/shared/runtime.env || { echo "runtime.env missing"; exit 41; }

          sha=$(basename "$(readlink -f "$release")")
          [[ $EXPECTED_SHA =~ ^[0-9a-f]{40}$ ]] || { echo "invalid expected workflow SHA"; exit 42; }
          [[ $sha == "$EXPECTED_SHA" ]] || {
            echo "refusing mixed release: workflow SHA $EXPECTED_SHA, deployed SHA $sha — dark deploy the exact workflow SHA first"
            exit 43
          }
          image="designproai-runtime:$sha"
          docker image inspect "$image" >/dev/null 2>&1 || { echo "runtime image $image is not present"; exit 44; }

          work=$(mktemp -d /tmp/designpro-canary.XXXXXX)
          out="$work/output"
          mkdir -p "$out" "$work/scripts"
          trap 'rm -rf "$work"' EXIT

          printf '%s' "$PAYLOAD" | base64 -d | tar -C "$work" -xz
          chmod -R 0777 "$work"

          set +e
          docker run --rm --network host \
            --env-file /opt/designproai-os/shared/runtime.env \
            -e DESIGNPRO_CANARY_EMAIL="$CEMAIL" \
            -v "$work/scripts/production-canary.mjs:/app/production-canary.mjs:ro" \
            -v "$work:/canary" \
            "$image" node /app/production-canary.mjs \
              --out /canary/output \
              --year "$YEAR" --make "$MAKE" --model "$MODEL" --type "$VTYPE" \
              --design "Precision Climate Solutions — A.T.L.A.S. graph canary"
          status=$?
          set -e

          echo "---CANARY-OUTPUT-TAR---"
          tar -C "$out" -cz . | base64 -w0
          exit $status
          REMOTE
          ssh_status=$?
          set -e

          mkdir -p canary-output
          if grep -q -- '---CANARY-OUTPUT-TAR---' "$RUNNER_TEMP/canary.log"; then
            sed -n '1,/---CANARY-OUTPUT-TAR---/p' "$RUNNER_TEMP/canary.log" | sed '$d' > canary-output/canary-run.log
            sed -n '/---CANARY-OUTPUT-TAR---/,$p' "$RUNNER_TEMP/canary.log" | tail -n +2 | tr -d '\n' | base64 -d | tar -C canary-output -xz
          else
            cp "$RUNNER_TEMP/canary.log" canary-output/canary-run.log
          fi
          cat canary-output/canary-run.log
          exit "$ssh_status"

      - name: Upload the production output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: designproai-production-canary-${{ github.run_id }}
          path: canary-output/**
          if-no-files-found: warn
          retention-days: 90

      - name: State the acceptance criterion
        if: always()
        shell: bash
        run: |
          cat <<'NOTE'
          PASS requires the real standalone chain to produce:
            - customer 2D proof + immutable flat layout
            - six Call 9 panel cuts
            - six Call 12 Topaz-enhanced panel masters
            - eighteen production output files
            - one production ZIP
            - one WrapBox manifest

          canary-evidence.json is authoritative. A red run still uploads it and
          names the exact stage/error. No runtime contract is weakened for this canary.
          NOTE
