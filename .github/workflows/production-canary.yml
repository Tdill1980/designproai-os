name: Run one production canary on the droplet

# Takes seven renders that already exist, drives them through Calls 8 to 12 on
# the deployed kernel, and brings the output files back as workflow artifacts.
#
# It generates nothing. Every input is a render produced previously, so a run
# costs no provider calls and can be repeated freely while diagnosing — which is
# the point: a canary you cannot afford to re-run is a canary nobody runs.
#
# The canary is staged into a temp directory at run time and removed afterwards,
# so the deployed kernel stays exactly the artifact that was acceptance-tested.
# It borrows the release's installed dependencies and the environment
# configure-env.sh wrote, so the run happens in production conditions.
#
# Call 12 upscales through Topaz, so a complete run is slow. The SSH connection
# carries keepalives for exactly that reason.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Protected action — runs a real production workflow on the droplet"
        required: true
        type: choice
        default: DO_NOT_RUN
        options:
          - DO_NOT_RUN
          - RUN_PRODUCTION_CANARY
      tenant_key:
        description: "Owner tenant key, e.g. user_<uuid> — derive it from the source job"
        required: true
        type: string
        default: user_61cc6c1c-554c-440c-8e07-a64469f1f4eb
      views_json:
        description: "The seven source slots mapped to public render URLs"
        required: true
        type: string
        default: >-
          {"side":"https://kfapjdyythzyvnpdeghu.supabase.co/storage/v1/object/public/wrap-files/renders/61cc6c1c-554c-440c-8e07-a64469f1f4eb/DesignPanelPro/ai-generated/1786467714118_commercial.jpg","passenger-side":"https://kfapjdyythzyvnpdeghu.supabase.co/storage/v1/object/public/wrap-files/renders/61cc6c1c-554c-440c-8e07-a64469f1f4eb/revisions/DesignPro_1786467794360.jpg","hood_detail":"https://kfapjdyythzyvnpdeghu.supabase.co/storage/v1/object/public/wrap-files/renders/61cc6c1c-554c-440c-8e07-a64469f1f4eb/DesignPanelPro/ai-generated/1786467784406_restyle.jpg","front":"https://kfapjdyythzyvnpdeghu.supabase.co/storage/v1/object/public/wrap-files/renders/61cc6c1c-554c-440c-8e07-a64469f1f4eb/DesignPanelPro/ai-generated/1786467784860_restyle.jpg","rear":"https://kfapjdyythzyvnpdeghu.supabase.co/storage/v1/object/public/wrap-files/renders/61cc6c1c-554c-440c-8e07-a64469f1f4eb/DesignPanelPro/ai-generated/1786467789643_restyle.jpg","close-up":"https://kfapjdyythzyvnpdeghu.supabase.co/storage/v1/object/public/wrap-files/renders/61cc6c1c-554c-440c-8e07-a64469f1f4eb/DesignPanelPro/ai-generated/1786467788075_restyle.jpg","roof":"https://kfapjdyythzyvnpdeghu.supabase.co/storage/v1/object/public/wrap-files/renders/61cc6c1c-554c-440c-8e07-a64469f1f4eb/DesignPanelPro/ai-generated/1786467785611_restyle.jpg"}
      vehicle_year:
        description: "Vehicle year"
        required: true
        type: string
        default: "2022"
      vehicle_make:
        description: "Vehicle make"
        required: true
        type: string
        default: Ford
      vehicle_model:
        description: "Vehicle model"
        required: true
        type: string
        default: Transit

permissions:
  contents: read

concurrency:
  group: designproai-production-canary
  cancel-in-progress: false

env:
  TARGET_HOST: 137.184.0.4
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng

jobs:
  canary:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RUN_PRODUCTION_CANARY'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Prove protected intent
        run: |
          set -Eeuo pipefail
          set +x
          test "${{ inputs.confirmation }}" = "RUN_PRODUCTION_CANARY"
          test -n "$SSH_PRIVATE_KEY"
          printf '%s' '${{ inputs.tenant_key }}' | grep -Eq '^user_[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          # Seven slots, exactly, before a byte moves.
          printf '%s' '${{ inputs.views_json }}' | jq -e '
            (keys | sort) == (["side","passenger-side","hood_detail","front","rear","close-up","roof"] | sort)
            and (to_entries | all(.value | test("^https://")))' >/dev/null

      - name: Pin the droplet SSH identity
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_ssh"
          public_key="$RUNNER_TEMP/designproai_ssh.pub"
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          fail() { printf '::error title=SSH identity pin::%s\n' "$*" >&2; exit "$1"; }

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          ssh-keygen -y -f "$key_file" > "$public_key" 2>/dev/null || fail 31 "automation private key could not be parsed"
          observed=$(ssh-keygen -lf "$public_key" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')
          [[ $observed == "$EXPECTED_AUTOMATION_KEY_FINGERPRINT" ]] || fail 38 "automation key fingerprint does not match the protected pin"

          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts" || fail 33 "host-key scan failed"
          [[ -s $known_hosts ]] || fail 34 "host-key scan returned nothing"
          mapfile -t host_fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 2>/dev/null | awk '{print $2}' | sort -u)
          [[ ${#host_fingerprints[@]} -eq 1 ]] || fail 36 "ambiguous host key"
          [[ ${host_fingerprints[0]} == "$EXPECTED_HOST_FINGERPRINT" ]] || fail 37 "host fingerprint does not match the protected pin"

          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Run the canary on the droplet
        id: run
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          CANARY_TENANT: ${{ inputs.tenant_key }}
          CANARY_VIEWS: ${{ inputs.views_json }}
          CANARY_YEAR: ${{ inputs.vehicle_year }}
          CANARY_MAKE: ${{ inputs.vehicle_make }}
          CANARY_MODEL: ${{ inputs.vehicle_model }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          ssh_args=(-i "$KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                    -o "UserKnownHostsFile=$KNOWN_HOSTS" -o ServerAliveInterval=30 -o ServerAliveCountMax=20)
          views_b64=$(printf '%s' "$CANARY_VIEWS" | base64 -w0)
          payload=$(tar -cz scripts/production-canary.mjs | base64 -w0)

          set +e
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "CANARY_TENANT='$CANARY_TENANT' VIEWS_B64='$views_b64' PAYLOAD='$payload' \
             YEAR='$CANARY_YEAR' MAKE='$CANARY_MAKE' MODEL='$CANARY_MODEL' bash -s" \
            > "$RUNNER_TEMP/canary.log" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          release=/opt/designproai-os/current
          test -d "$release" || { echo "no deployed release at $release"; exit 40; }
          test -f /opt/designproai-os/shared/runtime.env || { echo "runtime.env missing"; exit 41; }
          test -d "$release/runtime/node_modules/@supabase" || { echo "release dependencies missing"; exit 42; }

          work=$(mktemp -d /tmp/designpro-canary.XXXXXX)
          out="$work/output"
          mkdir -p "$out" "$work/runtime" "$work/scripts"
          trap 'rm -rf "$work"' EXIT

          printf '%s' "$PAYLOAD" | base64 -d | tar -C "$work" -xz
          ln -s "$release/runtime/node_modules" "$work/runtime/node_modules"
          printf '%s' "$VIEWS_B64" | base64 -d > "$work/views.json"

          set -a; . /opt/designproai-os/shared/runtime.env; set +a
          export DESIGNPRO_CANARY_TENANT="$CANARY_TENANT"

          cd "$work"
          node scripts/production-canary.mjs --views views.json --out "$out" \
            --year "$YEAR" --make "$MAKE" --model "$MODEL"
          status=$?

          echo "---CANARY-OUTPUT-TAR---"
          tar -C "$out" -cz . | base64 -w0
          exit $status
          REMOTE
          ssh_status=$?
          set -e

          mkdir -p canary-output
          if grep -q -- '---CANARY-OUTPUT-TAR---' "$RUNNER_TEMP/canary.log"; then
            sed -n '1,/---CANARY-OUTPUT-TAR---/p' "$RUNNER_TEMP/canary.log" | sed '$d' > canary-output/canary-run.log
            sed -n '/---CANARY-OUTPUT-TAR---/,$p' "$RUNNER_TEMP/canary.log" | tail -n +2 | tr -d '\n' | base64 -d | tar -C canary-output -xz
          else
            cp "$RUNNER_TEMP/canary.log" canary-output/canary-run.log
          fi
          cat canary-output/canary-run.log
          exit "$ssh_status"

      - name: Upload the production output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: designproai-production-canary-${{ github.run_id }}
          path: canary-output/**
          if-no-files-found: warn
          retention-days: 90

      - name: State the acceptance criterion
        if: always()
        run: |
          cat <<'NOTE'
          The only question this run answers: can DesignProAI produce files a shop
          can print?

          Download the artifact and open what is there. A pass looks like:

            the 2D flat proof, showing GENIE dimensions and square footage
            six panels cut from that proof at trim + 5" bleed
            18 production files, upscaled through Topaz
            a ZIP production pack, and a WrapBox artifact

          canary-evidence.json records every stage transition observed and where
          it stopped. If there are no output files, that file names the stage —
          which is the whole reason it is written on failure as well as success.
          NOTE
