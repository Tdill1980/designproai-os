name: Install DesignProAI Caddy site

# Step 7 of ops/README.md.
#
# Two things this had to work around, both discovered on 2026-08-10:
#
#   1. ops/*.sh is not in the deployed release. release-files.txt packages what
#      the containers need; the operator scripts were never in it. So the script
#      is shipped from the pinned checkout, exactly as ci-dark-deploy.sh does.
#   2. The Caddy package was never installed on the host. install-caddy.sh
#      configures Caddy, it does not install it, and refuses with exit 4 —
#      correctly, since silently apt-installing a web server onto production is
#      not its job. BOOTSTRAP_CADDY_PACKAGE_AND_SITE does that explicitly.
#
# Preconditions report the value they observed. A guard that cannot say why it
# refused costs a debugging cycle every time it fires.

on:
  workflow_dispatch:
    inputs:
      exact_sha:
        description: "Exact live release SHA (must equal /opt/designproai-os/current)"
        required: true
        type: string
      confirmation:
        description: "Protected Caddy action"
        required: true
        type: choice
        default: DO_NOT_INSTALL
        options:
          - DO_NOT_INSTALL
          - INSPECT_ONLY
          - INSTALL_DESIGNPRO_CADDY_ONLY
          - BOOTSTRAP_CADDY_PACKAGE_AND_SITE

permissions:
  contents: read

concurrency:
  group: designproai-caddy-install
  cancel-in-progress: false

env:
  TARGET_HOST: 137.184.0.4
  TARGET_HOSTNAME: designproai-prod-sfo3
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng

jobs:
  install-caddy:
    if: inputs.confirmation != 'DO_NOT_INSTALL'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
      EXACT_SHA: ${{ inputs.exact_sha }}
      MODE: ${{ inputs.confirmation }}
    steps:
      # Pinned to the requested SHA so the script that runs is the one belonging
      # to the live release. It cannot drift from the release it configures.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.exact_sha }}
          persist-credentials: false

      - name: Pin the exact new droplet SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          [[ $EXACT_SHA =~ ^[0-9a-f]{40}$ ]] || { echo "Exact lowercase 40-character SHA required; got '$EXACT_SHA'" >&2; exit 2; }
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          test -f ops/install-caddy.sh
          key_file="$RUNNER_TEMP/designproai_ssh"
          pub_file="$RUNNER_TEMP/designproai_ssh.pub"
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          ssh-keygen -y -f "$key_file" > "$pub_file"
          observed_key=$(ssh-keygen -lf "$pub_file" -E sha256 | awk 'NR==1 {print $2}')
          [[ $observed_key == "$EXPECTED_AUTOMATION_KEY_FINGERPRINT" ]] || {
            echo "automation key fingerprint mismatch: observed $observed_key" >&2; exit 31; }
          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts"
          [[ -s $known_hosts ]] || { echo "host-key scan returned nothing for $TARGET_HOST" >&2; exit 33; }
          mapfile -t observed < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          [[ ${#observed[@]} -eq 1 ]] || { echo "expected one host key; observed ${#observed[@]}" >&2; exit 36; }
          [[ ${observed[0]} == "$EXPECTED_HOST_FINGERPRINT" ]] || {
            echo "host fingerprint mismatch: observed ${observed[0]}" >&2; exit 37; }
          echo "key_file=$key_file" >> "$GITHUB_ENV"
          echo "known_hosts=$known_hosts" >> "$GITHUB_ENV"
          echo "script_sha256=$(sha256sum ops/install-caddy.sh | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Install the Caddy package, if that mode was requested
        if: inputs.confirmation == 'BOOTSTRAP_CADDY_PACKAGE_AND_SITE'
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts")
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" "EXPECTED_HOSTNAME='$TARGET_HOSTNAME' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          host=$(hostname)
          [[ $host == "$EXPECTED_HOSTNAME" ]] || { echo "hostname mismatch: on '$host'" >&2; exit 10; }

          # Never reinstall over a working install — that is what
          # INSTALL_DESIGNPRO_CADDY_ONLY is for.
          if command -v caddy >/dev/null 2>&1; then
            echo "caddy is already installed: $(caddy version 2>&1 | head -1)" >&2
            echo "use INSTALL_DESIGNPRO_CADDY_ONLY instead" >&2
            exit 20
          fi

          # Never contend with an existing listener. The DesignProAI compose
          # publishes only 127.0.0.1:3001, :3002 and :8787, so 80/443 are
          # expected free — assert it rather than assume it.
          busy=$(ss -tlnH '( sport = :80 or sport = :443 )' 2>/dev/null | awk '{print $4}' | paste -sd' ' -)
          if [[ -n ${busy:-} ]]; then
            echo "refusing: something already listens on 80/443: $busy" >&2
            exit 21
          fi

          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq debian-keyring debian-archive-keyring apt-transport-https curl gnupg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' \
            | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' \
            > /etc/apt/sources.list.d/caddy-stable.list
          apt-get update -qq
          apt-get install -y -qq caddy

          command -v caddy >/dev/null || { echo "caddy still not on PATH after install" >&2; exit 22; }
          echo "installed: $(caddy version 2>&1 | head -1)"
          REMOTE

      - name: Ship the pinned script, run it, then remove it
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts")
          remote_dir="/tmp/designproai-caddy-$EXACT_SHA-$GITHUB_RUN_ID"

          # Run-scoped, mode 0700, removed on exit whether or not the install
          # succeeded — the same shape ci-dark-deploy.sh uses for its controls.
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" "test ! -e '$remote_dir' && install -d -m 0700 '$remote_dir'"
          cleanup() {
            ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
              "if test -d '$remote_dir' && test ! -L '$remote_dir'; then find '$remote_dir' -depth -mindepth 1 -delete && rmdir '$remote_dir'; fi" || true
          }
          trap cleanup EXIT

          scp "${ssh_args[@]}" ops/install-caddy.sh "root@$TARGET_HOST:$remote_dir/install-caddy.sh"

          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "EXPECTED_HOSTNAME='$TARGET_HOSTNAME' EXACT_SHA='$EXACT_SHA' MODE='$MODE' REMOTE_DIR='$remote_dir' EXPECTED_SCRIPT_SHA256='$script_sha256' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          host=$(hostname)
          [[ $host == "$EXPECTED_HOSTNAME" ]] || { echo "hostname mismatch: on '$host', expected '$EXPECTED_HOSTNAME'" >&2; exit 10; }

          current=$(readlink -f /opt/designproai-os/current 2>/dev/null || echo "")
          echo "current release : ${current:-<none>}"
          [[ $current == "/opt/designproai-os/releases/$EXACT_SHA" ]] || {
            echo "refusing: requested SHA is not the live release" >&2; exit 11; }

          script="$REMOTE_DIR/install-caddy.sh"
          [[ -f $script && ! -L $script ]] || { echo "shipped script missing at $script" >&2; exit 12; }

          # The bytes that run are the bytes from the pinned checkout.
          observed=$(sha256sum "$script" | awk '{print $1}')
          [[ $observed == "$EXPECTED_SCRIPT_SHA256" ]] || {
            echo "shipped script digest mismatch: observed $observed" >&2; exit 13; }

          if [[ $MODE == INSPECT_ONLY ]]; then
            echo "INSPECT_ONLY — script shipped and verified, not installing."
            exit 0
          fi

          cd "$REMOTE_DIR"
          bash install-caddy.sh "$EXACT_SHA" INSTALL_DESIGNPRO_CADDY_ONLY
          REMOTE

      - name: Report what Caddy is now serving
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts")
          # Read-only. Certificate issuance is NOT retried here: Let's Encrypt
          # rate limits a domain after repeated failed challenges, so a failure
          # above should be read rather than re-run.
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" bash -s <<'REMOTE' || true
          set -uo pipefail
          echo "--- caddy package ---"
          command -v caddy >/dev/null 2>&1 && caddy version 2>&1 | head -1 || echo "(not installed)"
          echo "--- caddy unit ---"
          systemctl is-active caddy 2>&1 || true
          echo "--- configured site hostnames ---"
          grep -RIhoE '^[a-z0-9.-]+\.designproai\.com' /etc/caddy 2>/dev/null | sort -u || echo "(none found)"
          echo "--- local TLS answer on the expected origin ---"
          curl -sS -o /dev/null -w 'os.designproai.com -> %{http_code}\n' \
            --resolve os.designproai.com:443:127.0.0.1 https://os.designproai.com/ 2>&1 || true
          REMOTE
