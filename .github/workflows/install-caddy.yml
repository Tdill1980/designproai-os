name: Install DesignProAI Caddy site

# Step 7 of ops/README.md. The script lives in the immutable release, which
# deploy.sh chmods to 0444 — so `./install-caddy.sh` can never work and the
# interpreter must be invoked explicitly. Automating it removes the only
# runbook step that depended on remembering that.

on:
  workflow_dispatch:
    inputs:
      exact_sha:
        description: "Exact live release SHA (must equal /opt/designproai/current)"
        required: true
        type: string
      confirmation:
        description: "Protected Caddy install action"
        required: true
        type: choice
        default: DO_NOT_INSTALL
        options:
          - DO_NOT_INSTALL
          - INSTALL_DESIGNPRO_CADDY_ONLY

permissions:
  contents: read

concurrency:
  group: designproai-caddy-install
  cancel-in-progress: false

env:
  TARGET_HOST: 137.184.0.4
  TARGET_HOSTNAME: designproai-prod-sfo3
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng

jobs:
  install-caddy:
    if: inputs.confirmation == 'INSTALL_DESIGNPRO_CADDY_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
      EXACT_SHA: ${{ inputs.exact_sha }}
    steps:
      - name: Pin the exact new droplet SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          [[ $EXACT_SHA =~ ^[0-9a-f]{40}$ ]] || { echo "Exact lowercase 40-character SHA required" >&2; exit 2; }
          key_file="$RUNNER_TEMP/designproai_ssh"
          pub_file="$RUNNER_TEMP/designproai_ssh.pub"
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          ssh-keygen -y -f "$key_file" > "$pub_file"
          test "$(ssh-keygen -lf "$pub_file" -E sha256 | awk 'NR==1 {print $2}')" = "$EXPECTED_AUTOMATION_KEY_FINGERPRINT"
          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts"
          test -s "$known_hosts"
          mapfile -t observed < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          test "${#observed[@]}" -eq 1
          test "${observed[0]}" = "$EXPECTED_HOST_FINGERPRINT"
          echo "key_file=$key_file" >> "$GITHUB_ENV"
          echo "known_hosts=$known_hosts" >> "$GITHUB_ENV"

      - name: Install the Caddy site for the live release
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts")
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "EXPECTED_HOSTNAME='$TARGET_HOSTNAME' EXACT_SHA='$EXACT_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          test "$(hostname)" = "$EXPECTED_HOSTNAME"

          # Never configure Caddy for a release that is not the live one.
          current=$(readlink -f /opt/designproai/current)
          test "$current" = "/opt/designproai/releases/$EXACT_SHA"

          ops="$current/ops"
          test -f "$ops/install-caddy.sh"
          test ! -L "$ops/install-caddy.sh"

          # The release tree is mode 0444 by construction (deploy.sh), so the
          # interpreter is invoked explicitly rather than relying on +x.
          cd "$ops"
          bash install-caddy.sh "$EXACT_SHA" INSTALL_DESIGNPRO_CADDY_ONLY
          REMOTE

      - name: Report what Caddy is now serving
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts")
          # Read-only. Certificate issuance is NOT retried here: Let's Encrypt
          # rate limits a domain after repeated failed challenges, so a failure
          # above should be read rather than re-run.
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" bash -s <<'REMOTE' || true
          set -uo pipefail
          echo "--- caddy unit ---"
          systemctl is-active caddy 2>&1 || true
          echo "--- configured site hostnames ---"
          grep -RIhoE '^[a-z0-9.-]+\.designproai\.com' /etc/caddy 2>/dev/null | sort -u || echo "(none found)"
          echo "--- local TLS answer on the expected origin ---"
          curl -sS -o /dev/null -w 'os.designproai.com -> %{http_code}\n' \
            --resolve os.designproai.com:443:127.0.0.1 https://os.designproai.com/ 2>&1 || true
          REMOTE
