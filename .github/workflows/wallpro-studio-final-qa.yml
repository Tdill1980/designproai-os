name: Verify final WallPro studio and approved images
on:
  push:
    branches: [wallpro-single-stage-20260923]
    paths: ['.github/workflows/wallpro-studio-final-qa.yml']
permissions:
  contents: write
concurrency:
  group: wallpro-single-stage-review
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/wallpro-single-stage-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: wallpro-single-stage-20260923
      - name: Remove this temporary review-only workflow before testing the final tree
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = wallpro-single-stage-20260923
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/wallpro-studio-final-qa.yml
          git commit -m 'Keep final WallPro UI release free of temporary review workflows'
          git push origin HEAD:wallpro-single-stage-20260923
          git rev-parse HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm ci --prefix app
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Verify the shared walkthrough, gym images, existing hero, case studies and step placement
        run: npm test --prefix app -- src/lib/__tests__/wallpro-magic-studio.test.ts src/lib/__tests__/wallpro-masthead.test.ts src/lib/__tests__/wallpro-hero-proof.test.ts src/lib/__tests__/wallpro-case-studies.test.ts src/lib/__tests__/wallpro-step-board.test.ts
      - name: Browser-check both themes and all five steps at five widths
        run: |
          if ! test -x /usr/bin/google-chrome; then node app/node_modules/puppeteer/lib/cjs/puppeteer/node/cli.js browsers install chrome; fi
          node scripts/verify-wallpro-demo.mjs
      - name: Build the app without deploying
        run: npm run build --prefix app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wallpro-studio-final-visual-check
          path: /tmp/wallpro-demo-qa
          if-no-files-found: warn
