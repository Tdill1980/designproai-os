name: Export one DesignPro run's proof and panels for inspection

# READ-ONLY. Downloads a completed run's Call 8 2D Production Proof, its six
# Call 9 panels, and the six canonical surfaces those panels came from, so the
# ARTWORK can be looked at rather than inferred from hashes.
#
# WHY IT EXISTS. wrap-files is private (correctly -- the runtime refuses to
# manufacture into a public bucket), so the artifacts cannot be opened from a
# URL. The service key that can read them already lives on the droplet in
# shared/runtime.env. This runs the export INSIDE the deployed runtime image,
# exactly as the production canary runs its script, and returns the files as a
# workflow artifact. Nothing is re-exposed: bucket visibility is never touched.
#
# Every downloaded file is re-hashed and checked against the content_hash
# recorded in designpro_artifacts, so the images shown are provably the same
# bytes the manufacturing chain wrote.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Read-only export from the production droplet"
        required: true
        type: choice
        default: DO_NOT_RUN
        options:
          - DO_NOT_RUN
          - RUN_READ_ONLY_EXPORT
      run_id:
        description: "designpro_workflow_runs.id to export"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: designproai-artifact-export
  cancel-in-progress: false

env:
  TARGET_HOST: 137.184.0.4
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RUN_READ_ONLY_EXPORT'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Fail closed if the production environment withheld the SSH secret
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if [[ -z ${SSH_PRIVATE_KEY:-} ]]; then
            printf '::error title=Environment secret withheld::DESIGNPROAI_SSH_PRIVATE_KEY is empty for ref %s.\n' "$GITHUB_REF" >&2
            exit 39
          fi
          [[ $RUN_ID =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]

      - name: Pin the droplet SSH identity
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_ssh"
          public_key="$RUNNER_TEMP/designproai_ssh.pub"
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          fail() { local code="$1"; shift; printf '::error title=SSH identity pin::%s\n' "$*" >&2; exit "$code"; }

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          ssh-keygen -y -f "$key_file" > "$public_key" 2>/dev/null || fail 31 "automation private key could not be parsed"
          observed=$(ssh-keygen -lf "$public_key" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')
          [[ $observed == "$EXPECTED_AUTOMATION_KEY_FINGERPRINT" ]] || fail 38 "automation key fingerprint does not match the protected pin"

          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts" || fail 33 "host-key scan failed"
          [[ -s $known_hosts ]] || fail 34 "host-key scan returned nothing"
          mapfile -t host_fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 2>/dev/null | awk '{print $2}' | sort -u)
          [[ ${#host_fingerprints[@]} -eq 1 ]] || fail 36 "ambiguous host key"
          [[ ${host_fingerprints[0]} == "$EXPECTED_HOST_FINGERPRINT" ]] || fail 37 "host fingerprint does not match the protected pin"

          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Export the run's artifacts from the private bucket
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          ssh_args=(-i "$KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                    -o "UserKnownHostsFile=$KNOWN_HOSTS" -o ServerAliveInterval=30 -o ServerAliveCountMax=20)
          payload=$(tar -cz scripts/export-designpro-artifacts.mjs | base64 -w0)

          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "PAYLOAD='$payload' RUN_ID='$RUN_ID' bash -s" \
            > "$RUNNER_TEMP/export.b64" 2>"$RUNNER_TEMP/export.log" <<'REMOTE'
          set -Eeuo pipefail
          release=/opt/designproai-os/current
          test -d "$release" || { echo "no deployed release" >&2; exit 40; }
          test -f /opt/designproai-os/shared/runtime.env || { echo "runtime.env missing" >&2; exit 41; }
          sha=$(basename "$(readlink -f "$release")")
          image="designproai-runtime:$sha"
          docker image inspect "$image" >/dev/null 2>&1 || { echo "runtime image $image absent" >&2; exit 42; }

          work=$(mktemp -d /tmp/designpro-export.XXXXXX)
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/scripts" "$work/out"
          printf '%s' "$PAYLOAD" | base64 -d | tar -C "$work" -xz
          chmod -R 0777 "$work"

          docker run --rm --network host \
            --env-file /opt/designproai-os/shared/runtime.env \
            -v "$work/scripts/export-designpro-artifacts.mjs:/app/export.mjs:ro" \
            -v "$work/out:/out" \
            "$image" node /app/export.mjs --run "$RUN_ID" --out /out >&2

          tar -C "$work/out" -cz . | base64 -w0
          REMOTE

          mkdir -p "$RUNNER_TEMP/artifacts"
          base64 -d < "$RUNNER_TEMP/export.b64" | tar -C "$RUNNER_TEMP/artifacts" -xz
          echo "---- export log ----"
          cat "$RUNNER_TEMP/export.log"
          echo "---- files ----"
          ls -l "$RUNNER_TEMP/artifacts"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: designpro-run-artifacts-${{ inputs.run_id }}
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: error
          retention-days: 30
