name: RecreatePro rebuild acceptance
on:
  push:
    branches: [codex/recreatepro-standalone-20260924]
    paths: [.github/workflows/recreatepro-import.yml]
permissions:
  contents: write
concurrency:
  group: recreatepro-bounded-source-import
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.ref == 'refs/heads/codex/recreatepro-standalone-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Verify bounded patch and commit source on this feature branch only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, re, subprocess
          encoded = ''.join(pathlib.Path(f'.github/recreatepro-import/patch.{i}.b64').read_text().strip() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 105295
          assert hashlib.sha256(patch).hexdigest() == '926acb80f7b9858f7d6572cf921f718e9ee15ad3457873b9b39d87e2e7e6400c'
          allowed = set('''app/src/App.tsx
          app/src/components/dashboard/ToolWordmark.tsx
          app/src/components/recreatepro/ProductionFlowEntry.tsx
          app/src/hooks/useToolAccess.ts
          app/src/lib/dashboard-nav.ts
          app/src/lib/os-brand.ts
          app/src/lib/quote-design-tools.ts
          app/src/lib/recreatepro-draft.ts
          app/src/lib/recreatepro-files.ts
          app/src/lib/recreatepro-handoff.ts
          app/src/lib/recreatepro-intake.test.ts
          app/src/lib/recreatepro-intake.ts
          app/src/pages/DesignPanelProPremium.tsx
          app/src/pages/RecreatePro.tsx
          app/src/pages/recreatepro.css
          docs/recreatepro/REBUILD-2026-09-24.md
          runtime/atlas-panel-proof-contract.cjs
          scripts/verify-recreatepro-types.mjs
          scripts/verify-recreatepro-ui.mjs
          supabase/functions/_shared/atlas-panel-proof-prompt.ts
          supabase/functions/_shared/designiq-assembly.ts
          supabase/functions/design-panel-ai-generate/index.ts
          tests/designpro-customer-path-seam.test.mjs
          tests/os-brand-naming.test.mjs
          tests/recreatepro-reference-guidance.test.mjs'''.splitlines())
          allowed = {p.strip() for p in allowed}
          paths = re.findall(r'^diff --git a/(.*?) b/(.*?)$', patch.decode(), re.M)
          assert len(paths) == len(allowed) and {b for a,b in paths} == allowed
          assert all(a == b for a,b in paths)
          pathlib.Path('/tmp/recreatepro.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/recreatepro.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/recreatepro.patch'],check=True)
          # Correct the browser fixture: consent is deliberately NOT persisted.
          p = pathlib.Path('scripts/verify-recreatepro-ui.mjs')
          s = p.read_text()
          needle = "  await page.getByRole('button',{name:'Sign in & keep my design'}).click();"
          assert s.count(needle) == 1
          s = s.replace(needle, "  await page.getByRole('checkbox',{name:/own this artwork/}).check();\n" + needle)
          needle = 'configFile:false,root,plugins:'
          assert s.count(needle) == 1
          s = s.replace(needle, "configFile:false,root,esbuild:{jsx:'automatic'},plugins:")
          p.write_text(s)
          PY
          git rm .github/recreatepro-import/patch.*.b64 .github/workflows/recreatepro-review.yml .github/workflows/recreatepro-import.yml
          git add scripts/verify-recreatepro-ui.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(recreatepro): dedicated reference-to-production app with canonical VehiclePro workflow'
          git push origin HEAD:refs/heads/codex/recreatepro-standalone-20260924
          mkdir -p recreatepro-review-evidence
          git rev-parse HEAD | tee recreatepro-review-evidence/source-sha.txt
          git show --stat --oneline HEAD | tee recreatepro-review-evidence/commit.txt
      - name: Install exact locked app dependencies
        run: npm ci --prefix app --no-audit --no-fund
      - name: Designer, route, and brand regression checks
        id: contracts
        run: |
          set -o pipefail
          node --test tests/recreatepro-reference-guidance.test.mjs tests/designiq-shared-assembly.test.mjs tests/os-brand-naming.test.mjs tests/designpro-customer-path-seam.test.mjs | tee recreatepro-review-evidence/contracts.txt
      - name: RecreatePro intake tests
        if: ${{ !cancelled() }}
        id: intake
        run: |
          set -o pipefail
          npm run test --prefix app -- src/lib/recreatepro-intake.test.ts | tee recreatepro-review-evidence/intake.txt
      - name: Semantic TypeScript check of new app
        if: ${{ !cancelled() }}
        id: types
        run: |
          set -o pipefail
          node scripts/verify-recreatepro-types.mjs | tee recreatepro-review-evidence/types.txt
      - name: Full production app build
        if: ${{ !cancelled() }}
        id: build
        run: |
          set -o pipefail
          npm run build --prefix app | tee recreatepro-review-evidence/build.txt
      - name: Install Chromium
        if: ${{ !cancelled() }}
        run: node app/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Actual RecreatePro React UI on desktop and mobile with fixture API
        if: ${{ !cancelled() }}
        id: browser
        run: |
          set -o pipefail
          node scripts/verify-recreatepro-ui.mjs 2>&1 | tee recreatepro-review-evidence/browser.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recreatepro-build-and-browser-evidence
          path: recreatepro-review-evidence/
          retention-days: 14
      - name: Require every acceptance check
        if: ${{ !cancelled() }}
        env:
          CONTRACTS: ${{ steps.contracts.outcome }}
          INTAKE: ${{ steps.intake.outcome }}
          TYPES: ${{ steps.types.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          for result in "$CONTRACTS" "$INTAKE" "$TYPES" "$BUILD" "$BROWSER"; do test "$result" = success || exit 1; done
