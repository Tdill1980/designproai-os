# READ-ONLY credential-fingerprint diagnosis for the open 401 finding
# (docs/DNS_WORKER_MIGRATION_2026-08-11.md). This branch variant of the
# bootstrap workflow makes the ONE MOVE the migration record calls for:
# diff /opt/designproai/config/designpro.env (file AND the env inside the
# running worker containers) against the Supabase function env, via the same
# pinned SSH identity and Management API token the bootstrap already holds.
#
# It prints ONLY SHA-256 fingerprints, value lengths, and format classes
# (jwt-like / sb-secret / opaque) — never a credential. It rotates nothing,
# writes nothing, restarts nothing. The real bootstrap lives on main;
# dispatch this file from its branch with confirmation=DIAGNOSE.

name: Bootstrap RestylePro worker access

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DIAGNOSE to run the read-only credential fingerprint audit"
        required: true
        default: ""

concurrency:
  group: designproai-bootstrap-restylepro
  cancel-in-progress: false

permissions:
  contents: read

env:
  TARGET_HOST: 137.184.0.4
  TARGET_HOSTNAME: designproai-prod-sfo3
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng
  SUPABASE_PROJECT_REF: kfapjdyythzyvnpdeghu

jobs:
  diagnose:
    if: inputs.confirmation == 'DIAGNOSE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DESIGNPRO_SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Pin the droplet SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          observed_key="$(ssh-keygen -lf "$key_file" -E sha256 | awk '{print $2}')"
          [[ $observed_key == "$EXPECTED_AUTOMATION_KEY_FINGERPRINT" ]] || {
            echo "automation key fingerprint mismatch: $observed_key" >&2; exit 31; }
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts"
          [[ -s $known_hosts ]] || { echo "host-key scan returned nothing for $TARGET_HOST" >&2; exit 33; }
          mapfile -t observed < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          [[ ${#observed[@]} -eq 1 && ${observed[0]} == "$EXPECTED_HOST_FINGERPRINT" ]] || {
            echo "host fingerprint mismatch: ${observed[*]}" >&2; exit 34; }
          echo "key_file=$key_file" >> "$GITHUB_ENV"
          echo "known_hosts=$known_hosts" >> "$GITHUB_ENV"

      - name: Fingerprint the function-side credentials (Management API)
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          classify() {
            local v="$1"
            case "$v" in
              eyJ*) echo "jwt-like" ;;
              sb_secret_*) echo "sb-secret" ;;
              sbp_*) echo "sbp-token" ;;
              *) echo "opaque" ;;
            esac
          }
          fp() { printf %s "$1" | sha256sum | cut -c1-16; }
          auth=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")

          echo "== project api-keys (what the platform injects as SUPABASE_SERVICE_ROLE_KEY comes from here) =="
          keys_json="$(curl -fsS "${auth[@]}" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys")"
          count=$(jq 'length' <<<"$keys_json")
          echo "api-key entries: $count"
          for i in $(seq 0 $((count - 1))); do
            name=$(jq -r ".[$i].name" <<<"$keys_json")
            val=$(jq -r ".[$i].api_key // empty" <<<"$keys_json")
            [[ -n $val ]] && echo "::add-mask::$val"
            echo "  name=$name class=$(classify "$val") len=${#val} sha256_16=$(fp "$val")"
          done

          echo ""
          echo "== function secrets (the env the edge functions actually see) =="
          secrets_json="$(curl -fsS "${auth[@]}" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/secrets")"
          for n in WORKER_SECRET WORKER_URL; do
            val=$(jq -r --arg n "$n" '.[] | select(.name == $n) | .value // empty' <<<"$secrets_json")
            if [[ -z $val ]]; then
              echo "  $n: NOT PRESENT in function secrets"
              continue
            fi
            if [[ $n == WORKER_URL ]]; then
              echo "  $n=$val"
            else
              echo "::add-mask::$val"
              echo "  $n class=$(classify "$val") len=${#val} sha256_16=$(fp "$val")"
            fi
          done
          echo ""
          echo "all function secret NAMES (values not shown):"
          jq -r '.[].name' <<<"$secrets_json" | sort | sed 's/^/  /'

      - name: Fingerprint the droplet env (file + running containers)
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          ssh_args=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts")
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "EXPECTED_HOSTNAME='$TARGET_HOSTNAME' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          [[ "$(hostname)" == "$EXPECTED_HOSTNAME" ]] || { echo "hostname mismatch: on '$(hostname)'" >&2; exit 10; }
          classify() {
            local v="$1"
            case "$v" in
              eyJ*) echo "jwt-like" ;;
              sb_secret_*) echo "sb-secret" ;;
              *) echo "opaque" ;;
            esac
          }
          fp() { printf %s "$1" | sha256sum | cut -c1-16; }
          CONFIG=/opt/designproai/config/designpro.env
          echo "== droplet env file: $CONFIG =="
          if [[ ! -f $CONFIG ]]; then echo "MISSING"; else
            echo "  mtime: $(stat -c %y "$CONFIG")"
            for n in SUPABASE_SERVICE_ROLE_KEY WORKER_SECRET; do
              val="$(grep -m1 "^${n}=" "$CONFIG" | cut -d= -f2- || true)"
              if [[ -z $val ]]; then echo "  $n: NOT PRESENT"; else
                echo "  $n class=$(classify "$val") len=${#val} sha256_16=$(fp "$val")"
              fi
            done
            grep -m1 '^SUPABASE_URL=' "$CONFIG" | sed 's/^/  /' || true
            grep -m1 '^DESIGNPRO_WORKER_HOST=' "$CONFIG" | sed 's/^/  /' || true
          fi
          echo ""
          echo "== running containers =="
          docker ps --format '{{.Names}} {{.Image}} up:{{.RunningFor}}'
          echo ""
          for c in $(docker ps --format '{{.Names}}' | grep -E 'worker|poller' || true); do
            echo "== container $c env fingerprints =="
            for n in SUPABASE_SERVICE_ROLE_KEY WORKER_SECRET DESIGNPRO_WORKER_ID; do
              val="$(docker exec "$c" sh -c "printf %s \"\$$n\"" 2>/dev/null || true)"
              if [[ -z $val ]]; then echo "  $n: EMPTY/UNSET"; continue; fi
              if [[ $n == DESIGNPRO_WORKER_ID ]]; then echo "  $n=$val"; else
                echo "  $n class=$(classify "$val") len=${#val} sha256_16=$(fp "$val")"
              fi
            done
          done
          echo ""
          echo "read-only diagnosis complete — nothing was modified"
          REMOTE
