# READ-ONLY credential-fingerprint diagnosis for the open 401 finding
# (docs/DNS_WORKER_MIGRATION_2026-08-11.md). This branch variant of the
# bootstrap workflow makes the ONE MOVE the migration record calls for:
# diff /opt/designproai/config/designpro.env (file AND the env inside the
# running worker containers) against the Supabase function env, via the same
# pinned SSH identity and Management API token the bootstrap already holds.
#
# It prints ONLY SHA-256 fingerprints, value lengths, and format classes
# (jwt-like / sb-secret / opaque) — never a credential. It rotates nothing,
# writes nothing, restarts nothing. The real bootstrap lives on main;
# dispatch this file from its branch with confirmation=DIAGNOSE.

name: Bootstrap RestylePro worker access

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "DIAGNOSE = read-only fingerprint audit. FIX-WORKER-SECRET = rotate WORKER_SECRET (function secret + droplet env + replica recreate)."
        required: true
        default: ""

concurrency:
  group: designproai-bootstrap-restylepro
  cancel-in-progress: false

permissions:
  contents: read

env:
  TARGET_HOST: 137.184.0.4
  TARGET_HOSTNAME: designproai-prod-sfo3
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng
  SUPABASE_PROJECT_REF: kfapjdyythzyvnpdeghu

jobs:
  # Rotation is the ONLY executable fix for the diagnosed 401: run #5 proved
  # the droplet holds sha256(WORKER_SECRET) instead of the secret (the
  # bootstrap read GET /secrets, which returns digests), and the function-env
  # SUPABASE_SERVICE_ROLE_KEY matches NO current api-key, so the droplet
  # fleet fails BOTH auth paths of generate-2d-proof/panel-artboard-generator.
  # The real WORKER_SECRET is not readable anywhere; minting a fresh one and
  # writing it to BOTH sides in one pass is the one-credential fix. Railway
  # keeps working through its bearer (the old JWT the function env still
  # holds); its x-worker-secret path — if it ever used it — needs a dashboard
  # update, which this job cannot reach and says so in its log.
  fix-worker-secret:
    if: inputs.confirmation == 'FIX-WORKER-SECRET'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DESIGNPRO_SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Pin the droplet SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          observed_key="$(ssh-keygen -lf "$key_file" -E sha256 | awk '{print $2}')"
          [[ $observed_key == "$EXPECTED_AUTOMATION_KEY_FINGERPRINT" ]] || {
            echo "automation key fingerprint mismatch: $observed_key" >&2; exit 31; }
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts"
          [[ -s $known_hosts ]] || { echo "host-key scan returned nothing for $TARGET_HOST" >&2; exit 33; }
          mapfile -t observed < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          [[ ${#observed[@]} -eq 1 && ${observed[0]} == "$EXPECTED_HOST_FINGERPRINT" ]] || {
            echo "host fingerprint mismatch: ${observed[*]}" >&2; exit 34; }
          echo "key_file=$key_file" >> "$GITHUB_ENV"
          echo "known_hosts=$known_hosts" >> "$GITHUB_ENV"

      - name: Rotate WORKER_SECRET on both sides, never printing it
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          new_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$new_secret"
          new_digest="$(printf %s "$new_secret" | sha256sum | awk '{print $1}')"
          echo "new WORKER_SECRET sha256 (the digest /secrets will show): $new_digest"

          # 1) Function side first: the functions accept the new value the
          #    moment the secret propagates.
          body=$(jq -cn --arg v "$new_secret" '[{name:"WORKER_SECRET", value:$v}]')
          code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/secrets" \
            -d "$body")
          [[ $code == 200 || $code == 201 ]] || {
            echo "::error::setting WORKER_SECRET returned HTTP $code: $(cat /tmp/out)"; exit 41; }
          echo "function secret WORKER_SECRET updated (HTTP $code)"

          # Confirm the API now reports exactly our digest.
          observed=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/secrets" \
            | jq -r '.[] | select(.name == "WORKER_SECRET") | .value')
          [[ $observed == "$new_digest" ]] || {
            echo "::error::function-side digest is $observed, expected $new_digest"; exit 42; }
          echo "function-side digest verified"

          # 2) Droplet side: swap the env line, recreate the replicas with the
          #    exact compose invocation deploy.sh uses, wait for health.
          #    The secret travels in a root-only temp file, NOT on bash -s
          #    stdin: run #6 proved the heredoc script IS stdin there, so a
          #    piped secret gets swallowed and `read` eats a script line
          #    instead — which skipped the length guard and wrote that line
          #    into the env file. This pass also repairs that damage: the awk
          #    below replaces the whole WORKER_SECRET line whatever it holds.
          ssh_args=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts")
          printf '%s\n' "$new_secret" | ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "umask 077 && cat > /root/.designpro_ws_new && chmod 600 /root/.designpro_ws_new"
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "EXPECTED_HOSTNAME='$TARGET_HOSTNAME' EXPECTED_DIGEST='$new_digest' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          [[ "$(hostname)" == "$EXPECTED_HOSTNAME" ]] || { echo "hostname mismatch: on '$(hostname)'" >&2; exit 10; }
          umask 077
          NEW_SECRET="$(head -n1 /root/.designpro_ws_new)"
          rm -f /root/.designpro_ws_new
          [[ ${#NEW_SECRET} -eq 64 ]] || { echo "secret file did not hold a 64-char secret" >&2; exit 11; }
          observed_digest="$(printf %s "$NEW_SECRET" | sha256sum | awk '{print $1}')"
          [[ $observed_digest == "$EXPECTED_DIGEST" ]] || { echo "received secret digest $observed_digest != expected $EXPECTED_DIGEST" >&2; exit 15; }
          ROOT=/opt/designproai
          CONFIG="$ROOT/config/designpro.env"
          RELEASE="$(readlink -f "$ROOT/current")"
          [[ -n $RELEASE && -d $RELEASE ]] || { echo "no current release symlink" >&2; exit 12; }
          SHA="$(basename "$RELEASE")"
          grep -q '^WORKER_SECRET=' "$CONFIG" || { echo "WORKER_SECRET line missing from $CONFIG" >&2; exit 13; }
          tmp="$(mktemp "$ROOT/config/.designpro.env.XXXXXX")"
          awk -v s="$NEW_SECRET" 'BEGIN{FS=OFS="="} /^WORKER_SECRET=/{print "WORKER_SECRET" OFS s; next} {print}' \
            "$CONFIG" > "$tmp"
          chmod 600 "$tmp"
          mv "$tmp" "$CONFIG"
          file_digest="$(grep -m1 '^WORKER_SECRET=' "$CONFIG" | cut -d= -f2- | tr -d '\n' | sha256sum | awk '{print $1}')"
          echo "droplet env updated; WORKER_SECRET sha256: $file_digest"
          [[ $file_digest == "$EXPECTED_DIGEST" ]] || { echo "env file digest does not match the minted secret; aborting before compose" >&2; exit 16; }
          export GIT_SHA="$SHA"
          export DESIGNPRO_ENV_FILE="$CONFIG"
          docker compose --project-name designproai --env-file "$CONFIG" \
            --file "$RELEASE/ops/designpro/docker-compose.yml" up --detach worker-a worker-b
          for _ in $(seq 1 60); do
            a="$(docker inspect --format '{{.State.Health.Status}}' designproai-worker-a-1 2>/dev/null || echo missing)"
            b="$(docker inspect --format '{{.State.Health.Status}}' designproai-worker-b-1 2>/dev/null || echo missing)"
            [[ $a == healthy && $b == healthy ]] && { echo "both replicas healthy"; break; }
            sleep 5
          done
          [[ $a == healthy && $b == healthy ]] || { echo "replicas not healthy after recreate: a=$a b=$b" >&2; exit 14; }
          for c in designproai-worker-a-1 designproai-worker-b-1; do
            d="$(docker exec "$c" sh -c 'printf %s "$WORKER_SECRET"' | sha256sum | awk '{print $1}')"
            echo "container $c WORKER_SECRET sha256: $d"
          done
          curl -fsS --max-time 10 https://worker.designproai.com/health | head -c 400 || echo "public health probe failed"
          echo ""
          echo "NOTE: Railway still holds the PREVIOUS WORKER_SECRET. Its bearer auth is what the"
          echo "functions accept today, so it keeps working; if Railway function calls ever 401"
          echo "after this rotation, update WORKER_SECRET in the Railway dashboard to match."
          REMOTE

  # Railway's broken-credential claimants poll the same 5s interval as the
  # fixed droplet replicas and keep winning the claim race, burning each
  # resumed proof.build attempt with an instant 401. This job removes the
  # race: resume the run and fire the droplet's own /workflow/entice/drain in
  # the same second, ON the droplet, so a digitalocean replica claims first.
  prove-droplet:
    if: inputs.confirmation == 'PROVE-DROPLET'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
      RUN_ID: f07eb5ee-a5e2-4516-b983-982c91cde12b
      ACTOR_ID: 61cc6c1c-554c-440c-8e07-a64469f1f4eb
    steps:
      - name: Pin the droplet SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          observed_key="$(ssh-keygen -lf "$key_file" -E sha256 | awk '{print $2}')"
          [[ $observed_key == "$EXPECTED_AUTOMATION_KEY_FINGERPRINT" ]] || {
            echo "automation key fingerprint mismatch: $observed_key" >&2; exit 31; }
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts"
          [[ -s $known_hosts ]] || { echo "host-key scan returned nothing for $TARGET_HOST" >&2; exit 33; }
          mapfile -t observed < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          [[ ${#observed[@]} -eq 1 && ${observed[0]} == "$EXPECTED_HOST_FINGERPRINT" ]] || {
            echo "host fingerprint mismatch: ${observed[*]}" >&2; exit 34; }
          echo "key_file=$key_file" >> "$GITHUB_ENV"
          echo "known_hosts=$known_hosts" >> "$GITHUB_ENV"

      - name: Resume the run and drain the droplet claimant in the same second
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          ssh_args=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts")
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "EXPECTED_HOSTNAME='$TARGET_HOSTNAME' RUN_ID='$RUN_ID' ACTOR_ID='$ACTOR_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          [[ "$(hostname)" == "$EXPECTED_HOSTNAME" ]] || { echo "hostname mismatch: on '$(hostname)'" >&2; exit 10; }
          umask 077
          CONFIG=/opt/designproai/config/designpro.env
          SERVICE_KEY="$(grep -m1 '^SUPABASE_SERVICE_ROLE_KEY=' "$CONFIG" | cut -d= -f2-)"
          WORKER_SECRET="$(grep -m1 '^WORKER_SECRET=' "$CONFIG" | cut -d= -f2-)"
          SUPABASE_URL="$(grep -m1 '^SUPABASE_URL=' "$CONFIG" | cut -d= -f2-)"
          [[ -n $SERVICE_KEY && -n $WORKER_SECRET && -n $SUPABASE_URL ]] || { echo "env incomplete" >&2; exit 11; }
          echo "resuming run $RUN_ID via PostgREST (droplet service key)…"
          resume=$(curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/resume_designpro_entice_pack" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"p_run_id\":\"$RUN_ID\",\"p_actor\":\"$ACTOR_ID\",\"p_retry_failed\":true}")
          echo "resume result: $resume"
          echo "$resume" | grep -q 'resumedStages' || { echo "resume did not succeed" >&2; exit 12; }
          echo "draining droplet entice claimant on loopback 3101…"
          curl -sS -X POST -H "Authorization: Bearer $WORKER_SECRET" \
            "http://127.0.0.1:3101/workflow/entice/drain"
          echo ""
          for i in $(seq 1 6); do
            sleep 10
            state=$(curl -sS "$SUPABASE_URL/rest/v1/workflow_stage_runs?run_id=eq.$RUN_ID&stage_key=eq.proof.build&select=status,attempt,lease_owner,error_code,error_message" \
              -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY")
            echo "t+$((i*10))s proof.build: $state"
          done
          echo ""
          echo "== worker log lines from the last 3 minutes =="
          for c in designproai-worker-a-1 designproai-worker-b-1; do
            echo "-- $c --"
            docker logs --since 3m "$c" 2>&1 | grep -iE 'proof|claim|401|Authentication|entice|stage' | tail -n 25 || true
          done
          REMOTE

  diagnose:
    if: inputs.confirmation == 'DIAGNOSE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DESIGNPRO_SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Pin the droplet SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          observed_key="$(ssh-keygen -lf "$key_file" -E sha256 | awk '{print $2}')"
          [[ $observed_key == "$EXPECTED_AUTOMATION_KEY_FINGERPRINT" ]] || {
            echo "automation key fingerprint mismatch: $observed_key" >&2; exit 31; }
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts"
          [[ -s $known_hosts ]] || { echo "host-key scan returned nothing for $TARGET_HOST" >&2; exit 33; }
          mapfile -t observed < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          [[ ${#observed[@]} -eq 1 && ${observed[0]} == "$EXPECTED_HOST_FINGERPRINT" ]] || {
            echo "host fingerprint mismatch: ${observed[*]}" >&2; exit 34; }
          echo "key_file=$key_file" >> "$GITHUB_ENV"
          echo "known_hosts=$known_hosts" >> "$GITHUB_ENV"

      - name: Fingerprint the function-side credentials (Management API)
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          classify() {
            local v="$1"
            case "$v" in
              eyJ*) echo "jwt-like" ;;
              sb_secret_*) echo "sb-secret" ;;
              sbp_*) echo "sbp-token" ;;
              *) echo "opaque" ;;
            esac
          }
          fp() { printf %s "$1" | sha256sum | cut -c1-16; }
          auth=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")

          fpfull() { printf %s "$1" | sha256sum | awk '{print $1}'; }

          # KEY DISCOVERY (proved by run #4 of this workflow): GET /v1/projects/
          # {ref}/secrets returns the SHA-256 DIGEST of each value, not the value
          # (the returned WORKER_URL "value" equals sha256 of the URL string).
          # So digests are directly printable, and comparing sha256(api_key)
          # against a /secrets digest identifies exactly which key the function
          # runtime injects under each SUPABASE_* name.
          echo "== project api-keys: full sha256 of each REAL value (digest only, never the value) =="
          keys_json="$(curl -fsS "${auth[@]}" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys")"
          count=$(jq 'length' <<<"$keys_json")
          declare -A KEYFP
          for i in $(seq 0 $((count - 1))); do
            name=$(jq -r ".[$i].name" <<<"$keys_json")
            ktype=$(jq -r ".[$i].type // \"?\"" <<<"$keys_json")
            val=$(jq -r ".[$i].api_key // empty" <<<"$keys_json")
            [[ -n $val ]] && echo "::add-mask::$val"
            d=$(fpfull "$val")
            KEYFP["$name/$ktype/$i"]="$d"
            echo "  name=$name type=$ktype class=$(classify "$val") len=${#val} sha256=$d"
          done

          echo ""
          echo "== /secrets digests (what the function env holds, as sha256) =="
          secrets_json="$(curl -fsS "${auth[@]}" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/secrets")"
          for n in SUPABASE_SERVICE_ROLE_KEY SUPABASE_ANON_KEY WORKER_SECRET WORKER_URL; do
            dg=$(jq -r --arg n "$n" '.[] | select(.name == $n) | .value // empty' <<<"$secrets_json")
            echo "  $n digest=$dg"
          done

          echo ""
          echo "== verdict: which real key does the function env SUPABASE_SERVICE_ROLE_KEY correspond to? =="
          srk_digest=$(jq -r '.[] | select(.name == "SUPABASE_SERVICE_ROLE_KEY") | .value // empty' <<<"$secrets_json")
          matched=""
          for k in "${!KEYFP[@]}"; do
            if [[ "${KEYFP[$k]}" == "$srk_digest" ]]; then
              matched="$k"
              echo "  MATCH: function-env SUPABASE_SERVICE_ROLE_KEY == api-key [$k]"
            fi
          done
          [[ -z $matched ]] && echo "  NO api-key matches the function-env SUPABASE_SERVICE_ROLE_KEY digest"

      - name: Fingerprint the droplet env (file + running containers)
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          ssh_args=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts")
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "EXPECTED_HOSTNAME='$TARGET_HOSTNAME' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          [[ "$(hostname)" == "$EXPECTED_HOSTNAME" ]] || { echo "hostname mismatch: on '$(hostname)'" >&2; exit 10; }
          classify() {
            local v="$1"
            case "$v" in
              eyJ*) echo "jwt-like" ;;
              sb_secret_*) echo "sb-secret" ;;
              *) echo "opaque" ;;
            esac
          }
          fp() { printf %s "$1" | sha256sum | cut -c1-16; }
          CONFIG=/opt/designproai/config/designpro.env
          echo "== droplet env file: $CONFIG =="
          if [[ ! -f $CONFIG ]]; then echo "MISSING"; else
            echo "  mtime: $(stat -c %y "$CONFIG")"
            for n in SUPABASE_SERVICE_ROLE_KEY WORKER_SECRET; do
              val="$(grep -m1 "^${n}=" "$CONFIG" | cut -d= -f2- || true)"
              if [[ -z $val ]]; then echo "  $n: NOT PRESENT"; else
                echo "  $n class=$(classify "$val") len=${#val} sha256_16=$(fp "$val")"
              fi
            done
            grep -m1 '^SUPABASE_URL=' "$CONFIG" | sed 's/^/  /' || true
            grep -m1 '^DESIGNPRO_WORKER_HOST=' "$CONFIG" | sed 's/^/  /' || true
          fi
          echo ""
          echo "== running containers =="
          docker ps --format '{{.Names}} {{.Image}} up:{{.RunningFor}}'
          echo ""
          for c in $(docker ps --format '{{.Names}}' | grep -E 'worker|poller' || true); do
            echo "== container $c env fingerprints =="
            for n in SUPABASE_SERVICE_ROLE_KEY WORKER_SECRET DESIGNPRO_WORKER_ID; do
              val="$(docker exec "$c" sh -c "printf %s \"\$$n\"" 2>/dev/null || true)"
              if [[ -z $val ]]; then echo "  $n: EMPTY/UNSET"; continue; fi
              if [[ $n == DESIGNPRO_WORKER_ID ]]; then echo "  $n=$val"; else
                echo "  $n class=$(classify "$val") len=${#val} sha256_16=$(fp "$val")"
              fi
            done
          done
          echo ""
          echo "== last 20 min of worker logs: entice claim / proof / auth lines =="
          for c in $(docker ps --format '{{.Names}}' | grep -E 'worker' || true); do
            echo "-- $c --"
            docker logs --since 20m "$c" 2>&1 \
              | grep -iE 'proof|claim|401|Authentication|entice|f07eb5ee|stage' \
              | tail -n 40 || echo "  (no matching lines)"
          done
          echo ""
          echo "read-only diagnosis complete — nothing was modified"
          REMOTE
