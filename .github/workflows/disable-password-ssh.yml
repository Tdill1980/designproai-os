# Turn droplet password SSH login back OFF.
#
# Password authentication was enabled by hand on 2026-08-10 while the
# DigitalOcean web console was refusing keyboard/paste input and key-only
# login was the only other way in. The deploy and bootstrap workflows now
# hold working pinned-key access, so password login is pure attack surface —
# the droplet sits on a public IP taking password guesses.
#
# The owner cannot reliably run the fix from the DO web console (the same
# input bugs that forced password auth on in the first place), so this job
# does it server-side over the pinned automation key:
#
#   1. writes an sshd drop-in forcing PasswordAuthentication no
#   2. strips any hand-added "PasswordAuthentication yes" from sshd_config
#      and every sshd_config.d fragment, so no later file re-enables it
#   3. validates the config (sshd -t) BEFORE restarting — an invalid config
#      is never applied, so key access cannot be lost
#   4. restarts sshd and proves from the outside that the server no longer
#      offers password auth at all

name: Disable droplet password SSH

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type HARDEN to disable password SSH on the production droplet"
        required: true
        default: ""

concurrency:
  group: designproai-ssh-hardening
  cancel-in-progress: false

permissions:
  contents: read

env:
  TARGET_HOST: 137.184.0.4
  TARGET_HOSTNAME: designproai-prod-sfo3
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng

jobs:
  harden:
    if: inputs.confirmation == 'HARDEN'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
    steps:
      - name: Pin the droplet SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          observed_key="$(ssh-keygen -lf "$key_file" -E sha256 | awk '{print $2}')"
          [[ $observed_key == "$EXPECTED_AUTOMATION_KEY_FINGERPRINT" ]] || {
            echo "automation key fingerprint mismatch: $observed_key" >&2; exit 31; }
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts"
          [[ -s $known_hosts ]] || { echo "host-key scan returned nothing for $TARGET_HOST" >&2; exit 33; }
          mapfile -t observed < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          [[ ${#observed[@]} -eq 1 && ${observed[0]} == "$EXPECTED_HOST_FINGERPRINT" ]] || {
            echo "host fingerprint mismatch: ${observed[*]}" >&2; exit 34; }
          echo "key_file=$key_file" >> "$GITHUB_ENV"
          echo "known_hosts=$known_hosts" >> "$GITHUB_ENV"

      - name: Disable password authentication on the droplet
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          ssh_args=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts")
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "EXPECTED_HOSTNAME='$TARGET_HOSTNAME' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          [[ "$(hostname)" == "$EXPECTED_HOSTNAME" ]] || { echo "hostname mismatch: on '$(hostname)'" >&2; exit 10; }
          umask 022
          install -d -m 755 /etc/ssh/sshd_config.d
          # The drop-in wins over sshd_config on Ubuntu (Include is at the top
          # of the file), but a hand edit could have re-ordered things, so the
          # yes-lines are stripped everywhere too.
          printf '%s\n' \
            "# Managed by designproai-os disable-password-ssh workflow." \
            "# Access is by authorized key only; see the bootstrap workflow to rotate keys." \
            "PasswordAuthentication no" \
            "KbdInteractiveAuthentication no" \
            "ChallengeResponseAuthentication no" \
            > /etc/ssh/sshd_config.d/99-designproai-no-passwords.conf
          sed -i -E 's/^[[:space:]]*(PasswordAuthentication|KbdInteractiveAuthentication|ChallengeResponseAuthentication)[[:space:]]+yes[[:space:]]*$/# \1 yes -- disabled by designproai-os disable-password-ssh workflow/' \
            /etc/ssh/sshd_config
          for f in /etc/ssh/sshd_config.d/*.conf; do
            [[ "$f" == */99-designproai-no-passwords.conf ]] && continue
            sed -i -E 's/^[[:space:]]*(PasswordAuthentication|KbdInteractiveAuthentication|ChallengeResponseAuthentication)[[:space:]]+yes[[:space:]]*$/# \1 yes -- disabled by designproai-os disable-password-ssh workflow/' "$f"
          done
          # Never restart into a broken config -- that is how key access dies.
          sshd -t
          effective="$(sshd -T | awk '$1=="passwordauthentication"{print $2}')"
          [[ "$effective" == "no" ]] || { echo "config still resolves passwordauthentication=$effective" >&2; exit 11; }
          systemctl restart ssh || systemctl restart sshd
          echo "sshd restarted; passwordauthentication=$effective"
          REMOTE

      - name: Prove password auth is gone from the outside
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          # Key path must still work.
          ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts" \
            "root@$TARGET_HOST" "echo key-login-ok: \$(hostname)"
          # Password path must not even be offered. With pubkey disabled
          # client-side, the server's refusal names the methods it accepts;
          # "password" appearing there means the hardening did not take.
          out="$(ssh -o PubkeyAuthentication=no -o PreferredAuthentications=password \
            -o NumberOfPasswordPrompts=0 -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts" \
            "root@$TARGET_HOST" true 2>&1 || true)"
          echo "$out"
          if grep -qi 'permission denied' <<<"$out" && ! grep -qi 'password' <<<"${out#*denied}"; then
            echo "PASS: server no longer offers password authentication"
          else
            echo "FAIL: server still appears to offer password authentication" >&2
            exit 12
          fi
