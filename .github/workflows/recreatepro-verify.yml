name: RecreatePro final acceptance
on:
  push:
    branches: [codex/recreatepro-standalone-20260924]
    paths: [.github/workflows/recreatepro-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Remove temporary runner and pin exact reviewed source
        run: |
          test "$GITHUB_REF" = refs/heads/codex/recreatepro-standalone-20260924
          git rm .github/workflows/recreatepro-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(recreatepro): remove temporary verification workflow'
          git push origin HEAD:refs/heads/codex/recreatepro-standalone-20260924
          mkdir -p recreatepro-review-evidence
          git rev-parse HEAD | tee recreatepro-review-evidence/source-sha.txt
      - run: npm ci --prefix app --no-audit --no-fund
      - name: Contracts, intake, types and full app build
        run: |
          set -o pipefail
          node --test tests/recreatepro-reference-guidance.test.mjs tests/designiq-shared-assembly.test.mjs tests/os-brand-naming.test.mjs tests/designpro-customer-path-seam.test.mjs | tee recreatepro-review-evidence/contracts.txt
          npm run test --prefix app -- src/lib/recreatepro-intake.test.ts | tee recreatepro-review-evidence/intake.txt
          node scripts/verify-recreatepro-types.mjs | tee recreatepro-review-evidence/types.txt
          npm run build --prefix app | tee recreatepro-review-evidence/build.txt
      - run: node app/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Desktop and mobile UI acceptance with fixture API
        run: |
          set -o pipefail
          node scripts/verify-recreatepro-ui.mjs 2>&1 | tee recreatepro-review-evidence/browser.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recreatepro-final-browser-and-build
          path: recreatepro-review-evidence/
          retention-days: 14
