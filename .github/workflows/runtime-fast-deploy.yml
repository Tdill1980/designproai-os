name: Fast deploy DesignProAI runtime

on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "supabase/functions/_shared/gemini-image-history.mjs"
      - "supabase/functions/_shared/gemini-image-interactions.mjs"
      - "supabase/functions/_shared/gemini-provider-cache.mjs"
      - "ops/Dockerfile.runtime"
      - "ops/runtime-healthcheck.js"
      - ".github/workflows/runtime-fast-deploy.yml"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Deploy the exact current main runtime after scoped checks"
        required: true
        type: choice
        default: DO_NOT_DEPLOY
        options: [DO_NOT_DEPLOY, DEPLOY_RUNTIME]
      exact_sha:
        description: "Exact current main SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: designproai-runtime-fast-deploy
  cancel-in-progress: true

env:
  TARGET_HOST: 137.184.0.4
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng
  EXACT_SHA: ${{ github.event_name == 'push' && github.sha || inputs.exact_sha }}

jobs:
  runtime-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXACT_SHA }}
          persist-credentials: false
      - name: Require exact current main
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXACT_SHA"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "${{ inputs.confirmation }}" = DEPLOY_RUNTIME
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci --prefix runtime
      - name: Runtime syntax gate
        run: |
          set -Eeuo pipefail
          npm run check --prefix runtime

  deploy-runtime:
    needs: runtime-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXACT_SHA }}
          persist-credentials: false
      - name: Require exact current main again
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXACT_SHA"
      - name: Pin SSH identities
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$SSH_PRIVATE_KEY"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/key"
          test "$(ssh-keygen -y -f "$RUNNER_TEMP/key" | ssh-keygen -lf - -E sha256 | awk '{print $2}')" = "$EXPECTED_AUTOMATION_KEY_FINGERPRINT"
          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" > "$RUNNER_TEMP/known_hosts"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/known_hosts" -E sha256 | awk '{print $2}')" = "$EXPECTED_HOST_FINGERPRINT"
      - name: Package only runtime build context
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-hotfix/supabase/functions/_shared" "$RUNNER_TEMP/runtime-hotfix/ops"
          cp -a runtime "$RUNNER_TEMP/runtime-hotfix/"
          cp supabase/functions/_shared/gemini-image-history.mjs "$RUNNER_TEMP/runtime-hotfix/supabase/functions/_shared/"
          cp supabase/functions/_shared/gemini-image-interactions.mjs "$RUNNER_TEMP/runtime-hotfix/supabase/functions/_shared/"
          cp supabase/functions/_shared/gemini-provider-cache.mjs "$RUNNER_TEMP/runtime-hotfix/supabase/functions/_shared/"
          cp ops/Dockerfile.runtime ops/runtime-healthcheck.js "$RUNNER_TEMP/runtime-hotfix/ops/"
          tar -C "$RUNNER_TEMP/runtime-hotfix" -czf "$RUNNER_TEMP/runtime-$EXACT_SHA.tgz" .
      - name: Build exact runtime image and rolling-restart only the two runtimes
        run: |
          set -Eeuo pipefail
          SSH=(ssh -i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o StrictHostKeyChecking=yes root@"$TARGET_HOST")
          SCP=(scp -i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o StrictHostKeyChecking=yes)
          "${SCP[@]}" "$RUNNER_TEMP/runtime-$EXACT_SHA.tgz" root@"$TARGET_HOST":/tmp/
          "${SSH[@]}" bash -s -- "$EXACT_SHA" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1"
          work="/tmp/designpro-runtime-$sha"
          rm -rf "$work"; mkdir -p "$work"
          tar -xzf "/tmp/runtime-$sha.tgz" -C "$work"
          docker build --label "com.designpro.sha=$sha" --label "org.opencontainers.image.revision=$sha"             -f "$work/ops/Dockerfile.runtime" -t "designproai-runtime:$sha" "$work"
          current="$(readlink -f /opt/designproai-os/current)"
          current_sha="${current##*/}"
          cd /opt/designproai-os/current
          cat > "/tmp/runtime-hotfix-$sha.override.yml" <<EOF
          services:
            runtime-1:
              image: designproai-runtime:$sha
              environment:
                GIT_SHA: "$sha"
            runtime-2:
              image: designproai-runtime:$sha
              environment:
                GIT_SHA: "$sha"
          EOF
          DESIGNPRO_SHA="$current_sha" docker compose --env-file deploy/release.env -f ops/compose.yaml -f "/tmp/runtime-hotfix-$sha.override.yml" up -d --no-deps runtime-1
          for i in $(seq 1 24); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(DESIGNPRO_SHA="$current_sha" docker compose --env-file deploy/release.env -f ops/compose.yaml -f "/tmp/runtime-hotfix-$sha.override.yml" ps -q runtime-1)")" = healthy ] && break
            sleep 5
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' "$(DESIGNPRO_SHA="$current_sha" docker compose --env-file deploy/release.env -f ops/compose.yaml -f "/tmp/runtime-hotfix-$sha.override.yml" ps -q runtime-1)")" = healthy
          DESIGNPRO_SHA="$current_sha" docker compose --env-file deploy/release.env -f ops/compose.yaml -f "/tmp/runtime-hotfix-$sha.override.yml" up -d --no-deps runtime-2
          for i in $(seq 1 24); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(DESIGNPRO_SHA="$current_sha" docker compose --env-file deploy/release.env -f ops/compose.yaml -f "/tmp/runtime-hotfix-$sha.override.yml" ps -q runtime-2)")" = healthy ] && break
            sleep 5
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' "$(DESIGNPRO_SHA="$current_sha" docker compose --env-file deploy/release.env -f ops/compose.yaml -f "/tmp/runtime-hotfix-$sha.override.yml" ps -q runtime-2)")" = healthy
          test "$(docker inspect -f '{{index .Config.Labels "com.designpro.sha"}}' designproai-runtime:$sha)" = "$sha"
          printf '%s\n' "$sha" > /opt/designproai-os/shared/runtime-hotfix-sha
          rm -rf "$work" "/tmp/runtime-$sha.tgz"
          echo "RUNTIME_FAST_DEPLOY_OK:$sha"
          REMOTE
