name: Deploy the DesignPro worker to the droplet

# Builds and runs the proven worker (worker/, ported from the predecessor)
# on the droplet at loopback :3005, then points the migrated edge functions
# at it: DESIGNPRO_WORKER_URL + WORKER_SECRET become Supabase function
# secrets. Caddy exposes /designpro-worker/* to the functions; the worker's
# own Bearer auth rejects everything unauthenticated.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Protected action — deploys the DesignPro worker on the droplet and updates function secrets"
        required: true
        type: choice
        default: DO_NOT_DEPLOY
        options:
          - DO_NOT_DEPLOY
          - DEPLOY_DESIGNPRO_WORKER

permissions:
  contents: read

concurrency:
  group: designproai-worker-deploy
  cancel-in-progress: false

env:
  TARGET_HOST: 137.184.0.4
  TARGET_HOSTNAME: designproai-prod-sfo3
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng
  PROJECT_REF: wozyamlnygaddievzuwn
  WORKER_PUBLIC_URL: https://os.designproai.com/designpro-worker

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DEPLOY_DESIGNPRO_WORKER'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Pin the exact droplet SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_ssh"
          pub_file="$RUNNER_TEMP/designproai_ssh.pub"
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          ssh-keygen -y -f "$key_file" > "$pub_file"
          test "$(ssh-keygen -lf "$pub_file" -E sha256 | awk 'NR==1 {print $2}')" = "$EXPECTED_AUTOMATION_KEY_FINGERPRINT"
          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts"
          test "$(ssh-keygen -lf "$known_hosts" -E sha256 | awk 'NR==1 {print $2}')" = "$EXPECTED_HOST_FINGERPRINT"
          echo "key_file=$key_file" >> "$GITHUB_ENV"
          echo "known_hosts=$known_hosts" >> "$GITHUB_ENV"

      - name: Build and run the worker on the droplet
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts" -o ServerAliveInterval=30 -o ServerAliveCountMax=20)
          # The tarball is too large for an argument/env assignment (ssh:
          # Argument list too long, run 32081902567) — stream it over stdin.
          tar -cz worker | ssh "${ssh_args[@]}" "root@$TARGET_HOST" 'cat > /tmp/designpro-worker.tgz'
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "EXPECTED_HOSTNAME='$TARGET_HOSTNAME' GIT_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          test "$(hostname)" = "$EXPECTED_HOSTNAME"
          test -f /opt/designproai-os/shared/runtime.env
          stage=$(mktemp -d /tmp/designpro-worker.XXXXXX)
          trap 'rm -rf "$stage" /tmp/designpro-worker.tgz' EXIT
          tar -C "$stage" -xzf /tmp/designpro-worker.tgz
          docker build -t "designpro-worker:$GIT_SHA" -f "$stage/worker/Dockerfile" "$stage"
          docker rm -f designpro-worker 2>/dev/null || true
          docker run -d --name designpro-worker --restart unless-stopped \
            -p 127.0.0.1:3005:3001 \
            --env-file /opt/designproai-os/shared/runtime.env \
            -e GIT_SHA="$GIT_SHA" \
            -e DESIGNPRO_WORKER_ID="designpro-worker-1" \
            "designpro-worker:$GIT_SHA"
          for i in $(seq 1 30); do
            if curl -fsS -m 5 http://127.0.0.1:3005/health >/dev/null 2>&1; then
              echo "worker healthy"
              curl -fsS -m 5 http://127.0.0.1:3005/health | head -c 400; echo
              exit 0
            fi
            sleep 2
          done
          echo "worker failed to become healthy; last logs:" >&2
          docker logs --tail 60 designpro-worker >&2 || true
          exit 1
          REMOTE

      - name: Reload Caddy with the designpro-worker route
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts" -o ServerAliveInterval=30 -o ServerAliveCountMax=20)
          fragment=$(base64 -w0 ops/Caddyfile.fragment)
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" "EXPECTED_HOSTNAME='$TARGET_HOSTNAME' FRAGMENT='$fragment' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          test "$(hostname)" = "$EXPECTED_HOSTNAME"
          site=/etc/caddy/sites/designproai-os.caddy
          test -f "$site"
          cp -a "$site" "$site.before-worker"
          printf '%s' "$FRAGMENT" | base64 -d > "$site"
          if caddy validate --config /etc/caddy/Caddyfile >/dev/null 2>&1; then
            systemctl reload caddy
            echo "caddy reloaded"
          else
            cp -a "$site.before-worker" "$site"
            echo "caddy validation failed; restored previous site" >&2
            exit 1
          fi
          REMOTE

      - name: Point the edge functions at the worker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DESIGNPRO_SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is required}"
          ssh_args=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts")
          worker_secret=$(ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "grep '^WORKER_SECRET=' /opt/designproai-os/shared/runtime.env | head -1 | cut -d= -f2-")
          test -n "$worker_secret"
          echo "::add-mask::$worker_secret"
          npx --yes supabase@2.111.0 secrets set --project-ref "$PROJECT_REF" \
            "DESIGNPRO_WORKER_URL=$WORKER_PUBLIC_URL" \
            "WORKER_SECRET=$worker_secret"
          echo "function secrets set"

      - name: Verify the worker through the public route
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -m 10 "$WORKER_PUBLIC_URL/health" || true)
            if [[ "$code" == "200" ]]; then echo "public worker route healthy"; exit 0; fi
            sleep 3
          done
          echo "public route returned $code" >&2
          exit 1
