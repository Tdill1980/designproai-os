name: Expose canonical Call 1 stale test paths

on:
  push:
    branches:
      - claude/atlas-generation-pipeline-awtekz

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/atlas-generation-pipeline-awtekz
          fetch-depth: 0
      - name: Apply candidate in working tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/one-canonical-call1-apply-v2.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(src) if l.strip()=='- name: Pin authority and rewire Call 1')
          ri=next(i for i in range(start,len(src)) if src[i].strip()=='run: |')
          out=[]
          for line in src[ri+1:]:
            if line.startswith('          '): out.append(line[10:])
            elif line.strip()=='': out.append('')
            else: break
          Path('/tmp/apply.sh').write_text('\n'.join(out)+'\n')
          PY
          bash /tmp/apply.sh
          python3 ops/apply-call1-v5.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix runtime
      - name: Run full suite and print failing source locations
        shell: bash
        run: |
          set +e
          node --test --test-reporter=spec > /tmp/full.log 2>&1
          rc=$?
          cat /tmp/full.log
          echo '===== FAILURE CONTEXT ====='
          grep -n -B8 -A30 -E 'not ok|AssertionError|ERR_ASSERTION|buildAtlasArtboardDesignIQDirection|A premium commercial vehicle wrap must look|Call 1 prompt merges|source identity and creative stack|flat-first runtime creates' /tmp/full.log || true
          echo "suite_rc=$rc"
          exit 0
