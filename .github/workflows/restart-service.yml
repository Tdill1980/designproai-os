name: Restart the installed DesignProAI stack

# Reloads the environment a RUNNING release is holding, and nothing else.
#
# WHY THIS EXISTS. configure-droplet-env.yml writes shared/runtime.env and
# shared/gateway.env, but a container reads its env_file once, at start. So a
# secrets change reaches disk and stops there: the running gateway keeps the
# values it booted with until the service restarts. The only path that
# restarted it was ops/deploy.sh, which ci-dark-deploy.sh reaches only for a
# SHA that is not already current -- and re-deploying the CURRENT SHA
# short-circuits at ci-dark-deploy.sh's "ALREADY_COMPLETE" guard without
# restarting anything.
#
# That left one honest way to load new secrets and one dishonest one. The
# dishonest one is committing a no-op change to mint a SHA the immutable-release
# guard has not seen, which defeats a guard that exists for good reason and puts
# a meaningless commit in the history of a production repo. This workflow is the
# honest one. Reloading configuration is an operation, not a release, and it
# deserves its own control rather than a disguised deployment.
#
# It restarts. It does not deploy: no artifact is built or transferred, the
# current symlink is not moved, no image is built or pulled, and Caddy, DNS and
# every public port are untouched. The release that comes back up is the exact
# release that was running.
#
# Cost of the restart, stated plainly: the three containers cycle, so in-flight
# requests are dropped and a stage running at that moment is interrupted. The
# runtime's spool is restart-safe by design, so work resumes rather than being
# lost -- but this is not a zero-impact action, and it is manual on purpose.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Protected action — restarts the running DesignProAI containers"
        required: true
        type: choice
        default: DO_NOT_RESTART
        options:
          - DO_NOT_RESTART
          - INSPECT_SERVICE_ONLY
          - RESTART_DESIGNPROAI_STACK

permissions:
  contents: read

concurrency:
  group: designproai-service-restart
  cancel-in-progress: false

env:
  TARGET_HOST: 137.184.0.4
  TARGET_HOSTNAME: designproai-prod-sfo3
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng
  RESTART_MODE: ${{ inputs.confirmation }}

jobs:
  restart:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.confirmation == 'INSPECT_SERVICE_ONLY' ||
       inputs.confirmation == 'RESTART_DESIGNPROAI_STACK')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Prove protected intent against the pinned host
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$GITHUB_REF" = refs/heads/main
          test "$TARGET_HOST" = "137.184.0.4"
          test "$TARGET_HOSTNAME" = "designproai-prod-sfo3"
          test -n "$SSH_PRIVATE_KEY"
          grep -q -- 'BEGIN OPENSSH PRIVATE KEY' <<<"$SSH_PRIVATE_KEY"

      - name: Pin the droplet SSH identity
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_ssh"
          public_key="$RUNNER_TEMP/designproai_ssh.pub"
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          fail() { printf '::error title=SSH identity pin::%s\n' "$*" >&2; exit "$1"; }

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          ssh-keygen -y -f "$key_file" > "$public_key" 2>/dev/null || fail 31 "automation private key could not be parsed"
          observed=$(ssh-keygen -lf "$public_key" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')
          printf 'Observed automation public-key fingerprint: %s\n' "$observed"
          [[ $observed == "$EXPECTED_AUTOMATION_KEY_FINGERPRINT" ]] || fail 38 "automation public-key fingerprint does not match the protected client pin"

          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts" || fail 33 "unauthenticated ed25519 host-key scan failed"
          [[ -s $known_hosts ]] || fail 34 "unauthenticated ed25519 host-key scan returned no keys"
          mapfile -t host_fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 2>/dev/null | awk '{print $2}' | sort -u)
          printf 'Observed public SSH host fingerprint(s):\n'
          printf '  %s\n' "${host_fingerprints[@]}"
          [[ ${#host_fingerprints[@]} -eq 1 ]] || fail 36 "expected exactly one unique ed25519 host fingerprint"
          [[ ${host_fingerprints[0]} == "$EXPECTED_HOST_FINGERPRINT" ]] || fail 37 "observed ed25519 host fingerprint does not match the protected pin"

          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      # Read before write. The unit is printed and its ownership of the stack is
      # asserted BEFORE anything is restarted, because "restart the service" is
      # only the right instruction if this unit is the thing that runs the
      # containers. A oneshot that merely stages files would come back "active"
      # from a restart while the gateway kept its old environment -- a green run
      # proving nothing, which is the failure mode this whole exercise exists to
      # avoid.
      - name: Show the unit and prove it owns the running stack
        id: unit
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS" -o ServerAliveInterval=30 -o ServerAliveCountMax=20)
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" "EXPECTED_HOSTNAME='$TARGET_HOSTNAME' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          test "$(hostname)" = "$EXPECTED_HOSTNAME"
          test ! -e /opt/restylepro

          echo "== systemctl cat designproai-os.service =="
          systemctl cat designproai-os.service

          echo
          echo "== ownership assertion =="
          # The unit must drive docker compose against the release tree. If it
          # does not, restarting it is the wrong lever and this stops here
          # rather than reporting a restart it did not perform.
          unit=$(systemctl cat designproai-os.service)
          grep -Fq 'docker' <<<"$unit" || { echo "Unit does not invoke docker; refusing to treat it as the stack owner" >&2; exit 40; }
          grep -Fq '/opt/designproai-os' <<<"$unit" || { echo "Unit does not reference the DesignProAI release tree; refusing" >&2; exit 41; }
          echo "unit invokes docker against /opt/designproai-os: OK"

          echo
          echo "== current release (unchanged by this workflow) =="
          readlink -f /opt/designproai-os/current || echo "(none)"
          echo "== containers before =="
          docker ps -a --filter label=com.docker.compose.project=designproai-os \
            --format '{{.Label "com.docker.compose.service"}}  {{.State}}  {{.Status}}' || true

          # The fault this restart is meant to clear, recorded before the fix so
          # the after-state means something. The webhook route answers before
          # the session gate, so it reports configuration honestly without a
          # cookie; the checkout route sits behind authenticate() and would
          # answer 401 regardless of Stripe config.
          echo "== checkout configuration BEFORE =="
          curl -s -o /dev/null -w 'healthz: %{http_code}\n' http://127.0.0.1:8787/healthz || true
          curl -s -X POST http://127.0.0.1:8787/api/webhooks/stripe || true
          echo
          REMOTE

      - name: Restart the stack
        if: env.RESTART_MODE == 'RESTART_DESIGNPROAI_STACK'
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS" -o ServerAliveInterval=30 -o ServerAliveCountMax=20)
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          # Already root over this channel, so no sudo: the package is not
          # guaranteed present on a minimal droplet and would fail for the wrong
          # reason.
          systemctl restart designproai-os.service
          systemctl status designproai-os.service --no-pager
          REMOTE

      - name: Verify the stack came back and loaded the new environment
        if: env.RESTART_MODE == 'RESTART_DESIGNPROAI_STACK'
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS" -o ServerAliveInterval=30 -o ServerAliveCountMax=20)
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          # Health checks have a start_period; a container is not expected to be
          # healthy the instant it is up. Wait for the state rather than racing
          # it and reporting a failure that is only earliness.
          echo "== waiting for three healthy containers =="
          healthy=0
          for _ in $(seq 1 40); do
            healthy=$(docker ps --filter label=com.docker.compose.project=designproai-os \
              --filter health=healthy --format '{{.ID}}' | wc -l | tr -d ' ')
            [[ $healthy -eq 3 ]] && break
            sleep 3
          done

          docker ps -a --filter label=com.docker.compose.project=designproai-os \
            --format '{{.Label "com.docker.compose.service"}}  {{.State}}  {{.Status}}'
          test "$healthy" -eq 3 || { echo "Expected 3 healthy DesignProAI containers, found $healthy" >&2; exit 42; }

          echo
          echo "== gateway environment (lengths only; no value is read or printed) =="
          gateway=$(docker ps -q \
            --filter label=com.docker.compose.project=designproai-os \
            --filter label=com.docker.compose.service=gateway)
          test -n "$gateway" || { echo "gateway container not found" >&2; exit 43; }
          docker exec "$gateway" sh -c '
            status=0
            for name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET; do
              eval value=\$$name
              if [ -n "$value" ]; then
                echo "$name: present (${#value} chars)"
              else
                echo "$name: EMPTY"
                status=1
              fi
            done
            exit $status
          ' || { echo "A Stripe credential is missing from the running gateway" >&2; exit 44; }

          echo
          echo "== health =="
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/healthz)
          echo "healthz: $code"
          test "$code" = "200" || { echo "gateway health is not 200" >&2; exit 45; }

          echo
          echo "== checkout configuration AFTER =="
          # Unsigned on purpose. With the webhook secret loaded this must fail
          # on the SIGNATURE (400 stripe_signature_invalid), which is proof the
          # request travelled past the configuration gate. 503
          # checkout_not_configured means the restart did not pick up the
          # environment. Nothing is granted either way: an unsigned delivery
          # confirms no purchase.
          body=$(curl -s -X POST http://127.0.0.1:8787/api/webhooks/stripe)
          echo "$body"
          case "$body" in
            *checkout_not_configured*)
              echo "Still unconfigured: the running gateway did not load the Stripe environment" >&2
              exit 46 ;;
            *stripe_signature_invalid*)
              echo "Checkout is configured: the webhook route now rejects on signature, not on configuration." ;;
            *)
              echo "Unexpected webhook response; not asserting configuration from it" >&2
              exit 47 ;;
          esac

          echo
          echo "== release (must be unchanged) =="
          readlink -f /opt/designproai-os/current || echo "(none)"
          REMOTE

      - name: State what this did and did not do
        if: always()
        run: |
          cat <<'NOTE'
          This run restarted a service. It did not deploy.

          No artifact was built or transferred, no image was built or pulled,
          the current release symlink was not moved, and Caddy, DNS and every
          public port are exactly as they were. The release running now is the
          same release that was running before.

          What changed is that the containers re-read
          /opt/designproai-os/shared/*.env at start, so configuration written
          since they last started is now in effect.
          NOTE
