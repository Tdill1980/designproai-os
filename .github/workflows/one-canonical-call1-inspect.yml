name: Inspect canonical Call 1 stale locks

on:
  push:
    branches:
      - claude/atlas-generation-pipeline-awtekz

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/atlas-generation-pipeline-awtekz
          fetch-depth: 0
      - name: Locate and print stale source-test locks
        shell: bash
        run: |
          set -euo pipefail
          needles=(
            'flat-first runtime creates the A.T.L.A.S. authoring request'
            'A.T.L.A.S. authoring inherits the reference DesignIQ source identity and creative stack'
            'Call 1 prompt merges full DesignIQ creative direction with A.T.L.A.S. topology'
          )
          for needle in "${needles[@]}"; do
            echo "===== NEEDLE: $needle ====="
            matches=$(grep -RIlF --exclude-dir=.git -- "$needle" . || true)
            if [[ -z "$matches" ]]; then
              echo MISSING
              continue
            fi
            while IFS= read -r f; do
              echo "===== FILE: $f ====="
              line=$(grep -nF -- "$needle" "$f" | head -1 | cut -d: -f1)
              start=$(( line > 45 ? line - 45 : 1 ))
              end=$(( line + 95 ))
              sed -n "${start},${end}p" "$f" | nl -ba -v "$start"
            done <<< "$matches"
          done
