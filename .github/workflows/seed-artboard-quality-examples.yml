name: Seed the Call-1 gold-standard artboard examples

# Copies owner-approved, QC-passed A.T.L.A.S. masters into the prefix Call 1
# reads its quality references from:
#
#     wrap-files/designpanel-artboard-examples/
#
# WHY THIS IS A WORKFLOW AND NOT A SCRIPT SOMEONE RUNS LOCALLY. `wrap-files` is
# private and the copy needs the service role key, which lives in the droplet's
# `shared/runtime.env` and nowhere else — not in the repository, not in a
# developer's checkout, and not in an agent's container. This runs ON the
# droplet so the key never moves.
#
# WHY IT MATTERS. `loadAtlasQualityArtboards` reads that prefix on every Call 1
# and treats an empty prefix as non-fatal, so an unseeded folder is silent:
# `qualityArtboardsApplied: 0` and a persona describing professionalism with no
# exemplar of it anywhere in the request. Live bbdd0db0 (2026-09-21) is what
# that produces — "six cropped photographs of a desert garden, no composition,
# no colour system, no integration of the brand".
#
# WHAT IT COPIES. Masters named by GENERATION ID, resolved through
# `designpro_flat_atlas_revisions` rather than typed as storage paths: the row
# is what proves a master was accepted and QC-passed, and a hand-typed path
# proves nothing. Every copy is verified by sha256 against the row's
# `master_content_hash` before it is written, and the object is skipped if it
# is already present with the right bytes.
#
# RULE 0.24: these are STRUCTURAL/quality references. The Call-1 prompt frames
# them as "PRODUCTION-QUALITY REFERENCE ONLY" and forbids their artwork,
# palette, wording, logo, brand, industry and panel geometry from reaching the
# output. Seed only masters the owner has approved as the quality bar.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Protected action — writes teaching inputs every Call 1 will see"
        required: true
        type: choice
        default: DO_NOT_RUN
        options:
          - DO_NOT_RUN
          - SEED_ARTBOARD_EXAMPLES
      generation_ids:
        description: "Comma-separated generation ids whose accepted masters become the examples"
        required: true
        type: string
        default: "5d727ea9-eb71-466b-8a04-dca2d8d411e7,84a3eadf-bc81-4096-8dd0-a63509e84fb7"
      replace_existing:
        description: "Remove every object already under the prefix first"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: designproai-seed-artboard-examples
  cancel-in-progress: false

env:
  TARGET_HOST: 137.184.0.4
  TARGET_HOSTNAME: designproai-prod-sfo3
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng

jobs:
  seed:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'SEED_ARTBOARD_EXAMPLES'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
      GENERATION_IDS: ${{ inputs.generation_ids }}
      REPLACE_EXISTING: ${{ inputs.replace_existing }}
    steps:
      - name: Pin the exact droplet SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_ssh"
          pub_file="$RUNNER_TEMP/designproai_ssh.pub"
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          ssh-keygen -y -f "$key_file" > "$pub_file"
          test "$(ssh-keygen -lf "$pub_file" -E sha256 | awk 'NR==1 {print $2}')" = "$EXPECTED_AUTOMATION_KEY_FINGERPRINT"
          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts"
          test "$(ssh-keygen -lf "$known_hosts" -E sha256 | awk 'NR==1 {print $2}')" = "$EXPECTED_HOST_FINGERPRINT"
          echo "key_file=$key_file" >> "$GITHUB_ENV"
          echo "known_hosts=$known_hosts" >> "$GITHUB_ENV"

      - name: Copy the accepted masters into the quality prefix
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts" -o ServerAliveInterval=30 -o ServerAliveCountMax=20)
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "EXPECTED_HOSTNAME='$TARGET_HOSTNAME' GENERATION_IDS='$GENERATION_IDS' REPLACE_EXISTING='$REPLACE_EXISTING' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          test "$(hostname)" = "$EXPECTED_HOSTNAME"
          command -v jq >/dev/null || { apt-get update -qq && apt-get install -y -qq jq; }
          trap 'rm -f /tmp/artboard-seed-*' EXIT

          SB_URL=$(grep '^SUPABASE_URL=' /opt/designproai-os/shared/runtime.env | head -1 | cut -d= -f2-)
          SB_KEY=$(grep -E '^(SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SERVICE_KEY)=' /opt/designproai-os/shared/runtime.env | head -1 | cut -d= -f2-)
          test -n "$SB_URL" && test -n "$SB_KEY"
          echo "project: $(echo "$SB_URL" | sed 's|https://||;s|/.*||')"

          BUCKET=wrap-files
          PREFIX=designpanel-artboard-examples
          api() { curl -fsS -H "apikey: $SB_KEY" -H "authorization: Bearer $SB_KEY" "$@"; }

          if [ "$REPLACE_EXISTING" = "true" ]; then
            echo "--- clearing $PREFIX ---"
            existing=$(api -X POST "$SB_URL/storage/v1/object/list/$BUCKET" \
              -H 'content-type: application/json' \
              -d "$(jq -nc --arg p "$PREFIX" '{prefix:$p,limit:100}')" \
              | jq -r '.[].name')
            for name in $existing; do
              api -X DELETE "$SB_URL/storage/v1/object/$BUCKET/$PREFIX/$name" >/dev/null && echo "deleted $name"
            done
          fi

          seeded=0
          IFS=',' read -ra IDS <<< "$GENERATION_IDS"
          for raw in "${IDS[@]}"; do
            gid=$(echo "$raw" | tr -d '[:space:]')
            [ -n "$gid" ] || continue
            echo "--- $gid ---"

            # THE ROW IS THE PROOF, NOT A TYPED PATH. Only an accepted master
            # with `masterQcPassed` may become a quality reference; anything
            # else would teach the model a sheet the gates refused.
            row=$(api -G "$SB_URL/rest/v1/designpro_flat_atlas_revisions" \
              --data-urlencode "generation_id=eq.$gid" \
              --data-urlencode "master_storage_path=not.is.null" \
              --data-urlencode "select=master_storage_path,master_content_hash,metadata,created_at" \
              --data-urlencode "order=created_at.desc" \
              --data-urlencode "limit=1")
            test "$(echo "$row" | jq 'length')" = "1" || { echo "no accepted master for $gid — skipped"; continue; }
            path=$(echo "$row" | jq -r '.[0].master_storage_path')
            want=$(echo "$row" | jq -r '.[0].master_content_hash')
            qc=$(echo "$row" | jq -r '.[0].metadata.masterQcPassed // "null"')
            if [ "$qc" != "true" ]; then
              echo "masterQcPassed=$qc for $gid — refusing to seed a master the gates did not pass"
              continue
            fi

            out="/tmp/artboard-seed-$gid.png"
            api -o "$out" "$SB_URL/storage/v1/object/$BUCKET/$path"
            got=$(sha256sum "$out" | cut -d' ' -f1)
            test "$got" = "$want" || { echo "hash mismatch for $gid ($got != $want) — refused"; exit 3; }
            bytes=$(stat -c%s "$out")
            echo "verified $want ($bytes bytes)"

            # Content-addressed, so re-running is a no-op rather than a second
            # copy of the same sheet under a new name.
            dest="$PREFIX/${want}.png"
            if api -I "$SB_URL/storage/v1/object/$BUCKET/$dest" >/dev/null 2>&1; then
              echo "already seeded: $dest"
              seeded=$((seeded+1))
              continue
            fi
            api -X POST "$SB_URL/storage/v1/object/$BUCKET/$dest" \
              -H 'content-type: image/png' --data-binary "@$out" >/dev/null
            echo "seeded $dest"
            seeded=$((seeded+1))
          done

          echo "--- $PREFIX now holds ---"
          api -X POST "$SB_URL/storage/v1/object/list/$BUCKET" \
            -H 'content-type: application/json' \
            -d "$(jq -nc --arg p "$PREFIX" '{prefix:$p,limit:100}')" \
            | jq -r '.[] | "\(.name)  \(.metadata.size) bytes"'

          # Call 1 attaches at most two. Seeding fewer is legal; seeding none
          # means the run did nothing, which must not read as success.
          test "$seeded" -ge 1 || { echo "nothing was seeded"; exit 4; }

          # ── THE THREE-ZONE EXAMPLE, BUILT FROM REAL ARTWORK ──────────────
          #
          # Owner, 2026-09-21: "Why is it so generic and flat on design?? Why
          # are you not using designpanelaigenerate???"
          #
          # The runtime can DRAW the three zones, and that teaches the format
          # correctly while teaching the quality bar wrongly -- the artwork
          # inside is hand-written SVG. A real generation is the right filling,
          # and the machinery to make one already exists: the FIRST seeded
          # master goes through `assemblePanelProofMaster({documentOnly})`,
          # which is the same derivation a customer's own proof uses.
          #
          # Built here rather than at request time because it is the same sheet
          # for every customer: one build, stored, read thereafter.
          first=$(echo "$GENERATION_IDS" | cut -d, -f1 | tr -d '[:space:]')
          echo "--- three-zone example from $first ---"
          cat > /tmp/artboard-seed-example.cjs <<'NODE'
          const { createClient } = require("/opt/designproai-os/current/runtime/node_modules/@supabase/supabase-js");
          const proof = require("/opt/designproai-os/current/runtime/atlas-panel-proof-topology.cjs");
          const atlas = require("/opt/designproai-os/current/runtime/flat-first-atlas.cjs");
          const { createHash } = require("node:crypto");
          const sha = (b) => createHash("sha256").update(b).digest("hex");
          (async () => {
            const svc = createClient(process.env.SB_URL, process.env.SB_KEY);
            const { data: rows } = await svc.from("designpro_flat_atlas_revisions")
              .select("master_storage_path,master_content_hash,manifest,request_input")
              .eq("generation_id", process.env.GEN_ID).not("master_storage_path", "is", null)
              .order("created_at", { ascending: false }).limit(1);
            if (!rows?.length) throw new Error("no revision row");
            const row = rows[0];
            const { data } = await svc.storage.from("wrap-files").download(row.master_storage_path);
            const master = Buffer.from(await data.arrayBuffer());
            if (sha(master) !== row.master_content_hash) throw new Error("master identity mismatch");
            const manifest = row.manifest;
            const panels = await atlas.cutCallOnePanels(master, manifest, row.master_content_hash);
            const built = await proof.assemblePanelProofMaster({
              sheet: { bytes: master, storagePath: row.master_storage_path,
                contentHash: row.master_content_hash, byteSize: master.length },
              zone2Panels: panels, documentOnly: true, cleanBaseZone2: false,
              panelRows: proof.panelRowsFromManifest(manifest),
              input: row.request_input || {}, manifest, logger: () => {},
              store: { putImmutableBytes: async (o) => {
                await svc.storage.from("wrap-files").upload(o.storagePath, o.bytes,
                  { contentType: o.contentType, upsert: true });
                return { storagePath: o.storagePath, contentHash: sha(o.bytes) };
              } },
              downloadAsset: async (id) => {
                const { data } = await svc.storage.from("wrap-files").download(id.storagePath);
                return Buffer.from(await data.arrayBuffer());
              },
            });
            const path = built.provenance.proofStoragePath;
            const { data: doc } = await svc.storage.from("wrap-files").download(path);
            const bytes = Buffer.from(await doc.arrayBuffer());
            await svc.storage.from("wrap-files")
              .upload("atlas-examples/three-zone-example.png", bytes,
                { contentType: "image/png", upsert: true });
            console.log(`EXAMPLE_OK ${bytes.length} bytes from ${path}`);
          })().catch((e) => { console.error(`EXAMPLE_FAILED ${e.message}`); process.exit(0); });
          NODE
          # Non-fatal on purpose: the quality artboards are the point of this
          # run, and the drawn example is a working fallback. A failure here
          # must not lose a successful seed.
          SB_URL="$SB_URL" SB_KEY="$SB_KEY" GEN_ID="$first" \
            node /tmp/artboard-seed-example.cjs || true

          echo "SEEDED_OK $seeded"
          REMOTE
