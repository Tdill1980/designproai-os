name: Seed the Call-1 artboard quality examples

# Populates `wrap-files/designpanel-artboard-examples/` -- the prefix BOTH
# Call-1 consumers read themselves as a quality bar:
#
#   design-panel-ai-generate  loadAtlasQualityArtboards()   cap 2 MiB per file
#   production-panel-proof    ARTBOARD_QUALITY_PREFIX       cap 8 MiB per file
#
# The prefix has been empty since it was wired, so Call 1 has been designing
# with no reference at all.
#
# OVERSIZED SOURCES ARE RE-ENCODED; SOURCES THAT FIT ARE COPIED UNTOUCHED.
# Both loaders SKIP an oversized file silently by design (fail soft: a quality
# reference must never cost a customer their generation), and a flat A.T.L.A.S.
# master is 17-27 MiB -- so a straight copy of one would list an object, report
# success and change nothing. Those are downscaled under the stricter 2 MiB cap.
# The owner's pinned format sheet is 1,870,997 bytes and ALREADY fits, so it is
# copied byte for byte: re-encoding it would degrade the finish and type that
# are the reason it is the standard.
#
# Either way the script then RE-READS the prefix the way the loaders read it --
# list ten, take the first two, check each is inside the cap -- to prove the
# model will actually be shown what landed.
#
# WHY IT RUNS ON THE DROPLET. wrap-files is private and there is no service-role
# secret in GitHub; the key already lives in /opt/designproai-os/shared/runtime.env.
# This runs inside the deployed runtime image exactly as the read-only exporter
# does, so no credential is ever fetched to a runner or to a laptop.
#
# It writes ONLY under that prefix. No master, revision row, bucket visibility,
# DAG node, orchestrator or edge function is touched.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "PREVIEW_ONLY encodes and shows you the files without writing. SEED_THE_BUCKET writes them."
        required: true
        type: choice
        default: DO_NOT_RUN
        options:
          - DO_NOT_RUN
          - PREVIEW_ONLY
          - SEED_THE_BUCKET
      sources:
        description: "Up to 2, comma separated, in the order shown to the model. Each is a master content-hash prefix OR an atlas-examples/ image path."
        required: false
        default: "atlas-examples/panel-proof-zones-filled.png,1564c66d"
        type: string

permissions:
  contents: read

concurrency:
  group: designproai-artboard-quality-seed
  cancel-in-progress: false

env:
  TARGET_HOST: 137.184.0.4
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng

jobs:
  seed:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation != 'DO_NOT_RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
      SOURCES: ${{ inputs.sources }}
      # Only the explicit seeding choice passes --write. PREVIEW_ONLY encodes,
      # verifies and hands back the images without touching the bucket.
      SEED_WRITE: ${{ inputs.confirmation == 'SEED_THE_BUCKET' && '--write' || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Fail closed if the production environment withheld the SSH secret
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if [[ -z ${SSH_PRIVATE_KEY:-} ]]; then
            printf '::error title=Environment secret withheld::DESIGNPROAI_SSH_PRIVATE_KEY is empty for ref %s.\n' "$GITHUB_REF" >&2
            exit 39
          fi
          # Two selector shapes only -- a hex content-hash prefix, or a path
          # inside the pinned teaching prefix -- and at most two of them. These
          # are the only selectors that reach an object in a private bucket, so
          # they are constrained here as well as in the script; neither alone is
          # the gate.
          one='([0-9a-f]{8,64}|atlas-examples/[A-Za-z0-9._-]+\.(png|jpe?g|webp)|local:[A-Za-z0-9._-]+\.(png|jpe?g|webp))'
          [[ $SOURCES =~ ^${one}(,${one})?$ ]] || {
            printf '::error title=Bad source selector::sources must be one or two entries, each a hex content-hash prefix (8-64 chars), an atlas-examples/ image path, or local:<filename>.\n' >&2
            exit 43
          }

      - name: Pin the droplet SSH identity
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_ssh"
          public_key="$RUNNER_TEMP/designproai_ssh.pub"
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          fail() { local code="$1"; shift; printf '::error title=SSH identity pin::%s\n' "$*" >&2; exit "$code"; }

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          ssh-keygen -y -f "$key_file" > "$public_key" 2>/dev/null || fail 31 "automation private key could not be parsed"
          observed=$(ssh-keygen -lf "$public_key" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')
          [[ $observed == "$EXPECTED_AUTOMATION_KEY_FINGERPRINT" ]] || fail 38 "automation key fingerprint does not match the protected pin"

          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts" || fail 33 "host-key scan failed"
          [[ -s $known_hosts ]] || fail 34 "host-key scan returned nothing"
          mapfile -t host_fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 2>/dev/null | awk '{print $2}' | sort -u)
          [[ ${#host_fingerprints[@]} -eq 1 ]] || fail 36 "ambiguous host key"
          [[ ${host_fingerprints[0]} == "$EXPECTED_HOST_FINGERPRINT" ]] || fail 37 "host fingerprint does not match the protected pin"

          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Encode the masters and seed the quality prefix
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          ssh_args=(-i "$KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                    -o "UserKnownHostsFile=$KNOWN_HOSTS" -o ServerAliveInterval=30 -o ServerAliveCountMax=20)
          # ONLY the assets this run actually names ride along.
          #
          # THE PAYLOAD IS AN SSH COMMAND-LINE ARGUMENT, so its size is bounded
          # by ARG_MAX, not by patience. Shipping the whole runtime/atlas-examples
          # directory is ~10 MB, ~13.5 MB base64'd, and the exec fails with 126
          # before the remote script runs a single line -- which reads as a
          # droplet problem rather than an argument-length one. One named
          # example is ~200 KB encoded.
          payload_paths=(scripts/seed-artboard-quality-examples.mjs)
          while IFS= read -r wanted; do
            [[ -n $wanted ]] || continue
            [[ -f "runtime/atlas-examples/$wanted" ]] || {
              printf '::error title=Local example missing::runtime/atlas-examples/%s is not in the checkout.\n' "$wanted" >&2
              exit 47
            }
            payload_paths+=("runtime/atlas-examples/$wanted")
          done < <(tr ',' '\n' <<<"$SOURCES" | sed -n 's/^local://p')
          payload=$(tar -cz "${payload_paths[@]}" | base64 -w0)
          printf 'payload: %s bytes encoded, %s file(s)\n' "${#payload}" "${#payload_paths[@]}"

          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "PAYLOAD='$payload' SOURCES='$SOURCES' SEED_WRITE='$SEED_WRITE' bash -s" \
            > "$RUNNER_TEMP/seed.b64" 2>"$RUNNER_TEMP/seed.log" <<'REMOTE'
          set -Eeuo pipefail
          release=/opt/designproai-os/current
          test -d "$release" || { echo "no deployed release" >&2; exit 40; }
          test -f /opt/designproai-os/shared/runtime.env || { echo "runtime.env missing" >&2; exit 41; }
          sha=$(basename "$(readlink -f "$release")")
          image="designproai-runtime:$sha"
          docker image inspect "$image" >/dev/null 2>&1 || { echo "runtime image $image absent" >&2; exit 42; }

          work=$(mktemp -d /tmp/designpro-seed.XXXXXX)
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/scripts" "$work/out"
          printf '%s' "$PAYLOAD" | base64 -d | tar -C "$work" -xz
          chmod -R 0777 "$work"

          docker run --rm --network host \
            --env-file /opt/designproai-os/shared/runtime.env \
            -v "$work/scripts/seed-artboard-quality-examples.mjs:/app/seed.mjs:ro" \
            -v "$work/runtime/atlas-examples:/examples:ro" \
            -v "$work/out:/out" \
            "$image" node /app/seed.mjs --sources "$SOURCES" --out /out $SEED_WRITE >&2

          tar -C "$work/out" -cz . | base64 -w0
          REMOTE

          mkdir -p "$RUNNER_TEMP/examples"
          base64 -d < "$RUNNER_TEMP/seed.b64" | tar -C "$RUNNER_TEMP/examples" -xz
          echo "---- seed log ----"
          cat "$RUNNER_TEMP/seed.log"
          echo "---- files ----"
          ls -l "$RUNNER_TEMP/examples"

      # The encoded examples come back on EVERY run, seeding or not, because the
      # only honest acceptance test for a quality reference is the owner's eye
      # on the pixels that will be shown to the model.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: artboard-quality-examples-${{ github.run_id }}
          path: ${{ runner.temp }}/examples
          if-no-files-found: error
          retention-days: 30
