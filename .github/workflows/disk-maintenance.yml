name: Reclaim droplet disk for the next deploy

# The dark deploy refuses to run below 120 GiB free on /opt (ops/install.sh).
# Every deploy attempt leaves behind an immutable release directory, a
# runtime+gateway image pair (~730 MB), and a /var/backups/designpro-cutover
# snapshot — so repeated deploys eventually starve the host and block the next
# release. This maintenance job removes only DesignProAI-owned leftovers:
# release directories and designproai-* images not referenced by the live
# current/public/restore pointers, and all but the newest three cutover
# backups. It never touches the shared spool, env files, Caddy, or any
# non-DesignPro path.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Protected action — deletes old DesignProAI releases/images/backups on the droplet"
        required: true
        type: choice
        default: DO_NOT_RUN
        options:
          - DO_NOT_RUN
          - RECLAIM_DESIGNPROAI_DISK

permissions:
  contents: read

concurrency:
  group: designproai-disk-maintenance
  cancel-in-progress: false

env:
  TARGET_HOST: 137.184.0.4
  TARGET_HOSTNAME: designproai-prod-sfo3
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng

jobs:
  reclaim:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RECLAIM_DESIGNPROAI_DISK'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
    steps:
      - name: Pin the exact new droplet SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_ssh"
          pub_file="$RUNNER_TEMP/designproai_ssh.pub"
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          ssh-keygen -y -f "$key_file" > "$pub_file"
          test "$(ssh-keygen -lf "$pub_file" -E sha256 | awk 'NR==1 {print $2}')" = "$EXPECTED_AUTOMATION_KEY_FINGERPRINT"
          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts"
          test "$(ssh-keygen -lf "$known_hosts" -E sha256 | awk 'NR==1 {print $2}')" = "$EXPECTED_HOST_FINGERPRINT"
          echo "key_file=$key_file" >> "$GITHUB_ENV"
          echo "known_hosts=$known_hosts" >> "$GITHUB_ENV"

      - name: Remove only unreferenced DesignProAI releases, images, and old cutover backups
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts" -o ServerAliveInterval=30 -o ServerAliveCountMax=20)
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" "EXPECTED_HOSTNAME='$TARGET_HOSTNAME' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          test "$(hostname)" = "$EXPECTED_HOSTNAME"
          root=/opt/designproai-os
          test -d "$root" && test ! -L "$root"

          echo "--- free space before ---"
          df -h /opt /var

          # Every release SHA a live or restore pointer still references stays.
          keep=""
          for link in current public current.restore public.restore; do
            target=$(readlink -f "$root/$link" 2>/dev/null || true)
            case "$target" in
              "$root/releases/"*) keep="$keep $(basename "$target")" ;;
            esac
          done
          # Never delete the SHA any running container was started from.
          for tag in $(docker ps --format '{{.Image}}' | sed -n 's/^designproai-[a-z]*:\([0-9a-f]\{40\}\)$/\1/p' | sort -u); do
            keep="$keep $tag"
          done
          test -n "$keep" || { echo "refusing to run with no referenced release" >&2; exit 20; }
          echo "keeping release SHAs:$keep"

          shopt -s nullglob
          for dir in "$root"/releases/*; do
            test -d "$dir" || continue
            test ! -L "$dir" || continue
            sha=$(basename "$dir")
            [[ $sha =~ ^[0-9a-f]{40}$ ]] || continue
            case " $keep " in *" $sha "*) continue ;; esac
            echo "removing release $sha"
            chmod -R u+w "$dir"
            rm -rf "$dir"
          done

          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E '^designproai-(runtime|gateway):[0-9a-f]{40}$' \
            | while read -r image; do
                tag=${image##*:}
                case " $keep " in *" $tag "*) continue ;; esac
                echo "removing image $image"
                docker rmi "$image" >/dev/null || true
              done
          backups=/var/backups/designpro-cutover
          if test -d "$backups" && test ! -L "$backups"; then
            # Only timestamp-named DesignProAI cutover snapshots participate in
            # this retention rule. Caddy snapshots share the parent directory
            # but are a separate backup family and must not crowd out the three
            # deploy rollback snapshots this workflow promises to preserve.
            {
              for path in "$backups"/*; do
                test -d "$path" || continue
                test ! -L "$path" || continue
                stamp=$(basename "$path")
                [[ $stamp =~ ^[0-9]{8}T[0-9]{6}Z$ ]] || continue
                printf '%s\n' "$stamp"
              done
            } | sort | head -n -3 | while read -r stamp; do
              test -n "$stamp" || continue
              [[ $stamp =~ ^[0-9]{8}T[0-9]{6}Z$ ]] || exit 22
              test -d "$backups/$stamp" || continue
              test ! -L "$backups/$stamp" || continue
              echo "removing backup $stamp"
              rm -rf "$backups/${stamp:?}"
            done
          fi

          echo "--- free space after ---"
          df -h /opt /var
          avail=$(df -B1 --output=avail /opt | awk 'NR == 2 {print $1}')
          floor=$((120 * 1024 * 1024 * 1024))
          if [[ $avail -ge $floor ]]; then
            echo "OK: /opt has $((avail / 1024 / 1024 / 1024)) GiB free — above the 120 GiB deploy floor"
          else
            echo "WARNING: /opt still below the 120 GiB deploy floor ($((avail / 1024 / 1024 / 1024)) GiB free)"
            du -x -d1 -h /opt /var/backups /var/lib/docker 2>/dev/null | sort -rh | head -20
            exit 21
          fi
          REMOTE
