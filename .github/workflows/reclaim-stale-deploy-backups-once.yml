name: Reclaim stale DesignProAI deploy backups once

on:
  push:
    branches:
      - codex/reclaim-stale-deploy-backups-d289

permissions:
  contents: read

jobs:
  reclaim:
    if: github.repository == 'Tdill1980/designproai-os'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
      TARGET_HOST: 137.184.0.4
      EXPECTED_PARENT: d289eeb92bf9ca2fbd08db466d474af5d3a6947e
      EXPECTED_LIVE_RELEASE: 3383a1105292391b64808bb52719437b5e828f25
      EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
      EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Prove one-time cleanup identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-list --count HEAD^..HEAD)" = "1"
      - name: Delete only enumerated stale backups
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_ssh"
          public_key="$RUNNER_TEMP/designproai_ssh.pub"
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          ssh-keygen -y -f "$key_file" > "$public_key"
          observed=$(ssh-keygen -lf "$public_key" -E sha256 | awk 'NR == 1 {print $2}')
          test "$observed" = "$EXPECTED_AUTOMATION_KEY_FINGERPRINT"
          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts"
          mapfile -t host_fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          test "${#host_fingerprints[@]}" -eq 1
          test "${host_fingerprints[0]}" = "$EXPECTED_HOST_FINGERPRINT"
          ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$known_hosts" "root@$TARGET_HOST" \
            "EXPECTED_LIVE_RELEASE='$EXPECTED_LIVE_RELEASE' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          parent=/var/backups/designpro-cutover
          test "$(readlink -f /opt/designproai-os/current | xargs basename)" = "$EXPECTED_LIVE_RELEASE"
          test "$(readlink -f "$parent")" = "$parent"

          names=(
            20260831T042654Z 20260831T080648Z 20260831T113413Z
            20260831T114544Z 20260831T133052Z 20260831T180327Z
            20260831T191703Z 20260831T195851Z 20260831T203501Z
            20260831T213311Z 20260831T225837Z 20260901T013526Z
            20260901T015952Z 20260901T031337Z 20260901T042903Z
            20260901T131414Z 20260901T160633Z 20260901T164921Z
            20260901T172427Z 20260901T181230Z 20260901T191354Z
            20260901T202833Z 20260901T220321Z 20260901T230754Z
            20260902T185904Z 20260902T210410Z 20260904T182234Z
          )

          targets=()
          for name in "${names[@]}"; do
            target="$parent/$name"
            test -d "$target"
            test ! -L "$target"
            resolved=$(readlink -f "$target")
            test "$(dirname "$resolved")" = "$parent"
            test "$(basename "$resolved")" = "$name"
            targets+=("$resolved")
          done

          echo "before:"
          df -h /opt
          du -sch "${targets[@]}"

          for target in "${targets[@]}"; do
            find "$target" -depth -mindepth 1 -delete
            rmdir "$target"
          done

          echo "after:"
          df -h /opt
          du -sh "$parent"
          test "$(find "$parent" -maxdepth 1 -mindepth 1 -type d -name '20260906T*' | wc -l)" -ge 1
          test "$(readlink -f /opt/designproai-os/current | xargs basename)" = "$EXPECTED_LIVE_RELEASE"
          REMOTE
