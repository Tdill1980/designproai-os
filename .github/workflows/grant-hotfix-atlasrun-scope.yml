name: Grant hotfix atlasRun scope

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: grant/hotfix-atlasrun-scope
          fetch-depth: 0
      - name: Patch claim-scoped atlasRun and source locks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('runtime/generation-worker.cjs')
          s = p.read_text()
          anchor = '      let releaseAllGates = null;\n'
          if '      let atlasRun = null;\n' not in s:
              if s.count(anchor) != 1:
                  raise SystemExit(f'expected one releaseAllGates anchor, found {s.count(anchor)}')
              s = s.replace(anchor, anchor + '      let atlasRun = null;\n', 1)
          old = '        const atlasRun = generateOrReuseFlatAtlas({\n'
          new = '        atlasRun = generateOrReuseFlatAtlas({\n'
          if old in s:
              if s.count(old) != 1:
                  raise SystemExit(f'expected one block-scoped atlasRun declaration, found {s.count(old)}')
              s = s.replace(old, new, 1)
          if s.count(new) != 1 or s.count('flatAtlas = await atlasRun;') != 1:
              raise SystemExit('atlasRun claim-scope shape is not exact')
          p.write_text(s)

          lock = Path('tests/atlas-sole-design-authority.test.mjs')
          x = lock.read_text()
          old_lock = r'assert.match(worker, /const atlasRun = generateOrReuseFlatAtlas\(\{/);'
          new_lock = 'assert.match(worker, /let atlasRun = null;/);\n  assert.match(worker, /atlasRun = generateOrReuseFlatAtlas\\(\\{/);\n  assert.doesNotMatch(worker, /const atlasRun = generateOrReuseFlatAtlas\\(\\{/);'
          if old_lock in x:
              x = x.replace(old_lock, new_lock, 1)
          if 'assert.match(worker, /let atlasRun = null;/);' not in x:
              raise SystemExit('failed to update existing atlas sole-authority lock')
          lock.write_text(x)

          t = Path('tests/atlasrun-claim-scope.test.mjs')
          t.write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const source = readFileSync(new URL("../runtime/generation-worker.cjs", import.meta.url), "utf8");

          test("atlasRun is claim-scoped across flat-first authoring and proof join", () => {
            const hoist = source.indexOf("let atlasRun = null;");
            const flatBlock = source.indexOf("if (isFlatFirst) {");
            const assignment = source.indexOf("atlasRun = generateOrReuseFlatAtlas({");
            const join = source.indexOf("flatAtlas = await atlasRun;");
            assert.ok(hoist > 0);
            assert.ok(flatBlock > hoist);
            assert.ok(assignment > flatBlock);
            assert.ok(join > assignment);
            assert.equal(source.includes("const atlasRun = generateOrReuseFlatAtlas({"), false);
          });
          ''')
          PY
      - name: Run dependency-free source regression locks
        run: node --test tests/atlasrun-claim-scope.test.mjs tests/atlas-sole-design-authority.test.mjs
      - name: Commit hotfix to PR branch
        shell: bash
        run: |
          git config user.name "Grant DesignProAI"
          git config user.email "noreply@openai.com"
          git add runtime/generation-worker.cjs tests/atlasrun-claim-scope.test.mjs tests/atlas-sole-design-authority.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix live atlasRun claim-scope crash"
          git push origin HEAD:grant/hotfix-atlasrun-scope
