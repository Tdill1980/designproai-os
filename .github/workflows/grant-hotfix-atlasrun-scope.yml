name: Grant hotfix atlasRun scope

on:
  push:
    branches:
      - grant/hotfix-atlasrun-scope

permissions:
  contents: write

jobs:
  hotfix:
    if: ${{ !contains(github.event.head_commit.message, '[grant-atlasrun-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: grant/hotfix-atlasrun-scope
          fetch-depth: 0
      - name: Patch claim-scoped atlasRun and add regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('runtime/generation-worker.cjs')
          s = p.read_text()
          anchor = '      let releaseAllGates = null;\n'
          if s.count(anchor) != 1:
              raise SystemExit(f'expected one releaseAllGates anchor, found {s.count(anchor)}')
          if '      let atlasRun = null;\n' not in s:
              s = s.replace(anchor, anchor + '      let atlasRun = null;\n', 1)
          old = '        const atlasRun = generateOrReuseFlatAtlas({\n'
          new = '        atlasRun = generateOrReuseFlatAtlas({\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected one block-scoped atlasRun declaration, found {s.count(old)}')
          s = s.replace(old, new, 1)
          if s.count('flatAtlas = await atlasRun;') != 1:
              raise SystemExit('expected one downstream atlasRun join')
          p.write_text(s)

          t = Path('tests/atlasrun-claim-scope.test.mjs')
          t.write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const source = readFileSync(new URL("../runtime/generation-worker.cjs", import.meta.url), "utf8");

          test("atlasRun is claim-scoped across flat-first authoring and proof join", () => {
            const hoist = source.indexOf("let atlasRun = null;");
            const flatBlock = source.indexOf("if (isFlatFirst) {");
            const assignment = source.indexOf("atlasRun = generateOrReuseFlatAtlas({");
            const join = source.indexOf("flatAtlas = await atlasRun;");
            assert.ok(hoist > 0, "atlasRun must be hoisted at claim scope");
            assert.ok(flatBlock > hoist, "flat-first block must follow the claim-scope binding");
            assert.ok(assignment > flatBlock, "flat-first authoring must assign the claim-scope promise");
            assert.ok(join > assignment, "proof-stage completion must join the same promise");
            assert.equal(source.includes("const atlasRun = generateOrReuseFlatAtlas({"), false,
              "atlasRun must never be redeclared inside the flat-first block");
          });
          ''')
          PY
      - name: Run regression and targeted graph tests
        run: |
          node --test tests/atlasrun-claim-scope.test.mjs tests/atlas-streaming-fanout.test.mjs tests/atlas-proof-regeneration-budget.test.mjs tests/atlas-sole-design-authority.test.mjs
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "Grant DesignProAI"
          git config user.email "noreply@openai.com"
          git add runtime/generation-worker.cjs tests/atlasrun-claim-scope.test.mjs
          git diff --cached --check
          git commit -m "Fix live atlasRun claim-scope crash [grant-atlasrun-fixed]"
          git push origin HEAD:grant/hotfix-atlasrun-scope
