name: Run the DesignPro production output leg

# Drives the proven worker's print-file build for one frozen DesignPro job:
# /process-panel per side (native mode — the shop-validated "Build Print
# Files" path: exact frozen pixels, deterministic Sharp lanczos3 to the
# 150-PPI print floor, no AI reconstruction) followed by /package-pack (ZIP).
# Runs ON the droplet against the fleet's loopback port so the fleet's own
# WORKER_SECRET authorizes the calls without ever leaving the machine.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Protected action — builds print files on the production worker"
        required: true
        type: choice
        default: DO_NOT_RUN
        options:
          - DO_NOT_RUN
          - RUN_DESIGNPRO_OUTPUT
      payload:
        description: "Job payload JSON: {jobId,userId,orderNumber,panels:[{panelKey,panelLabel,widthInches,heightInches,inputPath,sourceUrl?,sha256?}]}"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: designproai-output-run
  cancel-in-progress: false

env:
  TARGET_HOST: 137.184.0.4
  TARGET_HOSTNAME: designproai-prod-sfo3
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RUN_DESIGNPRO_OUTPUT'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
      PAYLOAD: ${{ inputs.payload }}
    steps:
      - name: Pin the exact droplet SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_ssh"
          pub_file="$RUNNER_TEMP/designproai_ssh.pub"
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          ssh-keygen -y -f "$key_file" > "$pub_file"
          test "$(ssh-keygen -lf "$pub_file" -E sha256 | awk 'NR==1 {print $2}')" = "$EXPECTED_AUTOMATION_KEY_FINGERPRINT"
          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts"
          test "$(ssh-keygen -lf "$known_hosts" -E sha256 | awk 'NR==1 {print $2}')" = "$EXPECTED_HOST_FINGERPRINT"
          echo "key_file=$key_file" >> "$GITHUB_ENV"
          echo "known_hosts=$known_hosts" >> "$GITHUB_ENV"

      - name: Build print files and package the order on the worker
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts" -o ServerAliveInterval=30 -o ServerAliveCountMax=40)
          printf '%s' "$PAYLOAD" | ssh "${ssh_args[@]}" "root@$TARGET_HOST" 'cat > /tmp/designpro-output-payload.json'
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "EXPECTED_HOSTNAME='$TARGET_HOSTNAME' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          test "$(hostname)" = "$EXPECTED_HOSTNAME"
          trap 'rm -f /tmp/designpro-output-payload.json /tmp/designpro-panel-*.json' EXIT
          command -v jq >/dev/null || { apt-get update -qq && apt-get install -y -qq jq; }
          # The legacy fleet on 3101/3102 runs with the PREDECESSOR project's
          # Supabase env (proven 2026-08-18: Call 8's masters landed in the
          # predecessor's storage). The ported designpro-worker on loopback
          # 3005 runs with the STANDALONE runtime.env, so the print files land
          # on the DesignProAI project. Target that one; its secret and the
          # standalone service key both come from runtime.env.
          WS=$(grep '^WORKER_SECRET=' /opt/designproai-os/shared/runtime.env | head -1 | cut -d= -f2-)
          SB_URL=$(grep '^SUPABASE_URL=' /opt/designproai-os/shared/runtime.env | head -1 | cut -d= -f2-)
          SB_KEY=$(grep -E '^(SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SERVICE_KEY)=' /opt/designproai-os/shared/runtime.env | head -1 | cut -d= -f2-)
          test -n "$WS" && test -n "$SB_URL" && test -n "$SB_KEY"
          echo "standalone Supabase host: $(echo "$SB_URL" | sed 's|https://||;s|/.*||')"
          PORT=3005
          curl -fsS -m 10 "http://127.0.0.1:$PORT/health" >/dev/null

          # ── Stage the frozen Call-8 masters into the standalone project ──
          # A panel whose payload carries sourceUrl is fetched from there,
          # byte-verified against its Call-8 sha256 receipt, and uploaded to
          # the standalone wrap-files bucket at inputPath — a pure copy of the
          # frozen bytes, never a transformation.
          count=$(jq '.panels | length' /tmp/designpro-output-payload.json)
          for i in $(seq 0 $((count - 1))); do
            src=$(jq -r --argjson i "$i" '.panels[$i].sourceUrl // empty' /tmp/designpro-output-payload.json)
            [ -n "$src" ] || continue
            dst=$(jq -r --argjson i "$i" '.panels[$i].inputPath' /tmp/designpro-output-payload.json)
            want=$(jq -r --argjson i "$i" '.panels[$i].sha256 // empty' /tmp/designpro-output-payload.json)
            tmp=/tmp/designpro-stage-master.png
            curl -fsS -m 120 -o "$tmp" "$src"
            got=$(sha256sum "$tmp" | awk '{print $1}')
            if [ -n "$want" ] && [ "$got" != "$want" ]; then
              echo "sha mismatch for $dst: want $want got $got" >&2; exit 1
            fi
            code=$(curl -sS -m 120 -o /tmp/designpro-stage-up.json -w '%{http_code}' \
              -X POST "$SB_URL/storage/v1/object/wrap-files/$dst" \
              -H "Authorization: Bearer $SB_KEY" -H "Content-Type: image/png" -H "x-upsert: true" \
              --data-binary @"$tmp")
            rm -f "$tmp"
            case "$code" in 200|201) echo "staged $dst ($got)";; *) echo "stage upload $dst failed HTTP $code"; cat /tmp/designpro-stage-up.json; exit 1;; esac
          done

          jobId=$(jq -r .jobId /tmp/designpro-output-payload.json)
          userId=$(jq -r .userId /tmp/designpro-output-payload.json)
          orderNumber=$(jq -r .orderNumber /tmp/designpro-output-payload.json)
          test -n "$jobId" && test -n "$userId" && test -n "$orderNumber"
          echo "Job $jobId order $orderNumber — $count panels"

          # An empty panel list is a package-only rerun: the sides already
          # carry their print_worker stamps, only the ZIP leg re-fires.
          fail=0
          for i in $(seq 0 $((count - 1))); do
            [ "$count" -gt 0 ] || break
            body=$(jq -c --argjson i "$i" '{
              jobId, userId, orderNumber,
              panelKey: .panels[$i].panelKey,
              panelLabel: .panels[$i].panelLabel,
              widthInches: .panels[$i].widthInches,
              heightInches: .panels[$i].heightInches,
              inputPath: .panels[$i].inputPath,
              native: true, addBleed: false,
              outputTiff: true, outputEps: true
            }' /tmp/designpro-output-payload.json)
            key=$(jq -r --argjson i "$i" '.panels[$i].panelKey' /tmp/designpro-output-payload.json)
            echo "── /process-panel $key ──"
            code=$(curl -sS -m 1500 -o "/tmp/designpro-panel-$key.json" -w '%{http_code}' \
              -X POST "http://127.0.0.1:$PORT/process-panel" \
              -H "Authorization: Bearer $WS" -H "Content-Type: application/json" \
              --data-binary "$body")
            echo "HTTP $code"
            jq -c 'del(.artifactEvidence)' "/tmp/designpro-panel-$key.json" 2>/dev/null | head -c 1200; echo
            if [ "$code" != "200" ]; then fail=1; fi
          done
          test "$fail" = 0

          echo "── /package-pack ──"
          code=$(curl -sS -m 900 -o /tmp/designpro-pack.json -w '%{http_code}' \
            -X POST "http://127.0.0.1:$PORT/package-pack" \
            -H "Authorization: Bearer $WS" -H "Content-Type: application/json" \
            --data-binary "$(jq -c '{jobId, userId, orderNumber, force: true}' /tmp/designpro-output-payload.json)")
          echo "HTTP $code"
          cat /tmp/designpro-pack.json | head -c 3000; echo
          echo "── worker log tail ──"
          docker logs --tail 60 designpro-worker 2>&1 | tail -60 || true
          test "$code" = "200"
          REMOTE
