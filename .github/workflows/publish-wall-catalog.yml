name: Publish the WallPro catalog

# Fills `wallpro_designs` -- the WrapReady wall library the customer-facing
# "choose from library" path reads -- without a browser.
#
# WHY THIS EXISTS (owner, Trish 2026-09-23: "You do it"). The catalog had ZERO
# rows on production, so the library path opened onto an empty grid, and the
# only way to populate it was a human clicking Run and then Publish on
# /admin/wallpro-batch. Every pixel step on that page is <canvas>, so nothing
# about it could run anywhere else.
#
# WHAT IT IS NOT: a second producer. The designs come from the SAME
# `generate-wall-design` edge function the customer designer calls, reached
# with a real curator JWT; the brief, the row validator and the seam ladder are
# the app's own functions, bundled from app/src rather than restated. `sharp`
# stands in for <canvas> to decode and re-encode -- a transport swap, not a
# second decision. See scripts/wallpro-catalog-batch.mjs for the full argument.
#
# The service-role key is never a GitHub secret: it is read on the droplet out
# of /opt/designproai-os/shared/runtime.env, the same way migrate-genie-catalog
# and run-designpro-output already do, and handed to the container as an
# --env-file rather than an argument.
#
# START WITH run_mode: preflight. Two steps in this pipeline cannot be tested
# anywhere but here, because the service key lives only on the droplet: minting
# a real curator session, and copying storage bytes into catalog/. Finding
# either one broken AFTER a dozen paid generations is the expensive way to
# learn, so preflight proves both -- it mints the session, resolves the token
# back through auth/v1/user, copies an artwork that ALREADY EXISTS into the
# catalog, uploads its thumbnail, writes a row that every constraint must
# accept, and then DELETES all three. No model call, nothing kept. Then plan,
# then publish.
#
# A publish STAGES by default (owner, 2026-09-23: "I'd
# rather check the library first make sure it's good") -- rows land hidden, the
# public policy needs is_active AND approved, so nothing reaches a customer
# until a human presses Active in the admin gallery.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Protected action — generates wall designs and publishes them to the PUBLIC production catalog"
        required: true
        type: choice
        default: DO_NOT_PUBLISH
        options:
          - DO_NOT_PUBLISH
          - PUBLISH_WALL_CATALOG
      run_mode:
        description: "preflight = prove the credential AND the storage copy AND the row, then delete them · plan = print the selection · publish = generate and write"
        required: false
        type: choice
        default: preflight
        options: [preflight, plan, publish]
      count:
        description: "How many designs to publish (1-60)"
        required: false
        type: string
        default: "12"
      mode:
        description: "Which engine to publish"
        required: false
        type: choice
        default: mural
        options: [mural, repeat, both]
      domain:
        description: "Residential, commercial, or both"
        required: false
        type: choice
        default: all
        options: [all, residential, commercial]
      visibility:
        description: "staged = hidden until you press Active in the admin gallery. live = straight into the shop window."
        required: false
        type: choice
        default: staged
        options: [staged, live]
      curator_email:
        description: "The admin/tester account the designs are published as"
        required: false
        type: string
        default: trish@weprintwraps.com

permissions:
  contents: read

concurrency:
  group: designproai-wall-catalog
  cancel-in-progress: false

env:
  TARGET_HOST: 137.184.0.4
  TARGET_HOSTNAME: designproai-prod-sfo3
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'PUBLISH_WALL_CATALOG'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: "22"

      - name: Bundle the app's own catalog rules for Node
        shell: bash
        run: |
          set -Eeuo pipefail
          # The runner carries NO copy of designUpsertRow, briefForEntry or the
          # seam ladder: they are bundled straight out of app/src here, so the
          # row this writes is the row the admin page would have written.
          npx --yes esbuild@0.25.10 scripts/wallpro-catalog-lib.ts \
            --bundle --platform=node --format=esm --outfile=scripts/catalog-lib.mjs
          node -e "import('./scripts/catalog-lib.mjs').then(m=>{
            const n=m.WALL_PRESETS.map(m.presetAsEntry).length;
            if(!(n>=141)) throw new Error('preset library did not bundle: '+n);
            if(typeof m.designUpsertRow!=='function') throw new Error('designUpsertRow missing from the bundle');
            console.log('bundled '+n+' library entries');
          })"

      - name: Pin the exact droplet SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_ssh"
          pub_file="$RUNNER_TEMP/designproai_ssh.pub"
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          ssh-keygen -y -f "$key_file" > "$pub_file"
          test "$(ssh-keygen -lf "$pub_file" -E sha256 | awk 'NR==1 {print $2}')" = "$EXPECTED_AUTOMATION_KEY_FINGERPRINT"
          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts"
          test "$(ssh-keygen -lf "$known_hosts" -E sha256 | awk 'NR==1 {print $2}')" = "$EXPECTED_HOST_FINGERPRINT"
          echo "KEY_FILE=$key_file" >> "$GITHUB_ENV"
          echo "KNOWN_HOSTS=$known_hosts" >> "$GITHUB_ENV"

      - name: Generate and publish
        env:
          P_COUNT: ${{ inputs.count }}
          P_MODE: ${{ inputs.mode }}
          P_DOMAIN: ${{ inputs.domain }}
          P_EMAIL: ${{ inputs.curator_email }}
          # THE MODE TRAVELS AS A VALUE THE SCRIPT VALIDATES, NOT AS FLAGS.
          #
          # The first draft derived two `${VAR:+…}` flags from this input, one
          # per safe mode, so "publish" was the state where BOTH were empty --
          # which means an unrecognised value (a typo, or an option a later
          # edit adds to the list) would have fallen through to the one mode
          # that generates and writes. The comment beside it claimed the
          # opposite. A mode with three values is not two booleans, and
          # encoding it as absence puts the dangerous branch at the bottom.
          #
          # Passed whole, the script tests it against an exact allowlist and
          # refuses anything else before it reaches a credential.
          P_RUN_MODE: ${{ inputs.run_mode }}
          # `visibility` IS a two-state switch, so the equality form is right
          # here: anything that is not exactly "live" stages, and a typo hides
          # rather than ships. Never `cond && '' || value`.
          P_LIVE: ${{ inputs.visibility == 'live' && '1' || '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          ssh_args=(-i "$KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS" -o ServerAliveInterval=30 -o ServerAliveCountMax=20)

          tar -cz scripts/wallpro-catalog-batch.mjs scripts/wallpro-catalog-args.mjs scripts/catalog-lib.mjs > "$RUNNER_TEMP/catalog-payload.tgz"
          payload_file=$(ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            'f=$(mktemp /tmp/wallpro-catalog.XXXXXX) && cat > "$f" && echo "$f"' \
            < "$RUNNER_TEMP/catalog-payload.tgz")
          test -n "$payload_file"

          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "EXPECTED_HOSTNAME='$TARGET_HOSTNAME' P_PAYLOAD_FILE='$payload_file' P_COUNT='$P_COUNT' P_MODE='$P_MODE' P_DOMAIN='$P_DOMAIN' P_EMAIL='$P_EMAIL' P_RUN_MODE='$P_RUN_MODE' P_LIVE='$P_LIVE' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          test "$(hostname)" = "$EXPECTED_HOSTNAME"
          env_file=/opt/designproai-os/shared/runtime.env
          test -f "$env_file" || { echo "runtime.env missing"; exit 41; }

          image=$(docker ps \
            --filter label=com.docker.compose.project=designproai-os \
            --format '{{.Image}}' | grep '^designproai-runtime:' | head -n1)
          test -n "$image" || { echo "no running designproai-runtime container"; exit 42; }
          echo "runtime image: $image"

          work=$(mktemp -d /tmp/wallpro-catalog.XXXXXX)
          cleanup() { rm -rf "$work" "$P_PAYLOAD_FILE"; }
          trap cleanup EXIT
          tar -C "$work" -xzf "$P_PAYLOAD_FILE"
          # sharp and node come from the runtime image, exactly as every probe
          # in this repo does it; nothing is installed on the host.
          ln -sfn /app/node_modules "$work/node_modules"
          chmod -R 0777 "$work"

          docker run --rm \
            --env-file "$env_file" \
            -v "$work:/work" -w /work \
            --entrypoint node "$image" \
            scripts/wallpro-catalog-batch.mjs \
              --email "$P_EMAIL" --count "$P_COUNT" --mode "$P_MODE" --domain "$P_DOMAIN" \
              --run-mode "$P_RUN_MODE" ${P_LIVE:+--live}
          REMOTE

      - name: Report the catalog as it now stands
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          ssh_args=(-i "$KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS")
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" bash -s <<'REMOTE' || true
          set -Eeuo pipefail
          DB_URL=$(grep '^SUPABASE_URL=' /opt/designproai-os/shared/runtime.env | head -1 | cut -d= -f2-)
          DB_KEY=$(grep -E '^(SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SERVICE_KEY)=' /opt/designproai-os/shared/runtime.env | head -1 | cut -d= -f2-)
          echo "── live catalog ──"
          curl -sS -m 60 "$DB_URL/rest/v1/wallpro_designs?select=design_id,title,mode,is_active,approval_status&order=created_at.desc&limit=30" \
            -H "apikey: $DB_KEY" -H "Authorization: Bearer $DB_KEY"
          REMOTE
