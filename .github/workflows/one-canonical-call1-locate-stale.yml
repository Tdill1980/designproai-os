name: Locate canonical Call 1 stale locks

on:
  push:
    branches:
      - claude/atlas-generation-pipeline-awtekz

permissions:
  contents: read

jobs:
  locate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/atlas-generation-pipeline-awtekz
          fetch-depth: 0

      - name: Apply migration in working tree only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/one-canonical-call1-apply-v2.yml').read_text().splitlines()
          start = next(i for i,l in enumerate(src) if l.strip() == '- name: Pin authority and rewire Call 1')
          run_i = next(i for i in range(start, len(src)) if src[i].strip() == 'run: |')
          out=[]
          for line in src[run_i+1:]:
              if line.startswith('          '): out.append(line[10:])
              elif line.strip() == '': out.append('')
              else: break
          Path('/tmp/apply-call1.sh').write_text('\n'.join(out)+'\n')
          PY
          bash /tmp/apply-call1.sh
          python3 ops/apply-call1-v5.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci --prefix runtime

      - name: Locate old assertions after all generation/install steps
        shell: bash
        run: |
          set -euo pipefail
          patterns=(
            'flat-first runtime creates the A.T.L.A.S. authoring request'
            'A.T.L.A.S. authoring inherits the reference DesignIQ source identity and creative stack'
            'Call 1 prompt merges full DesignIQ creative direction with A.T.L.A.S. topology'
            'buildAtlasArtboardDesignIQDirection(input, options)'
            'pickFunction(runtimeSource, "buildAtlasArtboardDesignIQDirection")'
            'A premium commercial vehicle wrap must look'
          )
          for pat in "${patterns[@]}"; do
            echo "===== PATTERN: $pat ====="
            grep -RInF --exclude-dir=.git --exclude-dir=node_modules -- "$pat" . || true
            echo "--- tracked grep ---"
            git grep -nF -- "$pat" || true
          done
          echo '===== UNTRACKED TEST-LIKE FILES ====='
          git status --short
          find . -path '*/node_modules' -prune -o -type f \( -name '*.test.mjs' -o -name '*.test.cjs' -o -name '*.test.js' \) -print | sort | sed -n '1,1400p'
