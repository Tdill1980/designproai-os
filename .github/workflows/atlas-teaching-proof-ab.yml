name: A.T.L.A.S. teaching proof — black-field A/B (Test 1)

# Owner's Test 1. Changes ONE variable in the Call-1 request — the black
# separation/background field around the teaching proof's six panels becomes a
# neutral field — and measures the RAW PRE-REPAIR master.
#
# Three image calls: P (the deployed edge, production proof), A (the harness,
# production proof), B (the harness, neutral-field proof). P and A are the same
# condition drawn twice, which is the only way an n=1 arm can be read: Call 1
# sends no temperature, so B only means something if it moves further than P↔A.
#
# It changes nothing on the droplet or the project: no deploy, no env write, no
# service restart, no prompt change, no topology change. The production teaching
# proof and the edge function's hash pin on it are untouched — the variant is
# built in memory inside the run and never written anywhere production reads.
# `capture_only: true` proves both requests are identical except the one image
# and makes no provider call at all; run it first.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Protected live-provider action — spends 3 real Gemini image calls (0 with capture_only)"
        required: true
        type: choice
        default: DO_NOT_RUN
        options:
          - DO_NOT_RUN
          - RUN_TEACHING_PROOF_AB
      capture_only:
        description: "Capture both requests and prove they differ only in the teaching image — no provider call"
        required: true
        type: boolean
        default: true
      brief:
        required: false
        type: string
        default: >-
          Bold commercial HVAC wrap for Precision Climate Solutions: deep blue base with
          sunrise-orange airflow ribbons sweeping front to rear, clean modern sans-serif
          company name, high contrast and legible at highway distance.
      vehicle_year:
        required: true
        type: string
        default: "2022"
      vehicle_make:
        required: true
        type: string
        default: Ford
      vehicle_model:
        required: true
        type: string
        default: F250 Crew Cab
      vehicle_type:
        required: true
        type: string
        default: truck

permissions:
  contents: read

concurrency:
  group: designproai-teaching-proof-ab
  cancel-in-progress: false

env:
  TARGET_HOST: 137.184.0.4
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng

jobs:
  ab:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RUN_TEACHING_PROOF_AB'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Prove protected live-provider intent
        run: |
          set +x
          test "${{ inputs.confirmation }}" = "RUN_TEACHING_PROOF_AB"
          test -n "$SSH_PRIVATE_KEY"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Extract the deployed Call-1 assembly
        shell: bash
        run: |
          set -Eeuo pipefail
          npm i --no-audit --no-fund --no-save esbuild
          ESBUILD_BIN="$PWD/node_modules/.bin/esbuild" node scripts/build-atlas-call1-prompt.mjs atlas-call1-build
          test -s atlas-call1-build/atlas-call1-prompt.mjs

      - name: Pin the droplet SSH identity
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_ssh"
          public_key="$RUNNER_TEMP/designproai_ssh.pub"
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          fail() { printf '::error title=SSH identity pin::%s\n' "$*" >&2; exit "$1"; }

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          ssh-keygen -y -f "$key_file" > "$public_key" 2>/dev/null || fail 31 "automation private key could not be parsed"
          observed=$(ssh-keygen -lf "$public_key" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')
          [[ $observed == "$EXPECTED_AUTOMATION_KEY_FINGERPRINT" ]] || fail 38 "automation key fingerprint does not match the protected pin"

          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts" || fail 33 "host-key scan failed"
          [[ -s $known_hosts ]] || fail 34 "host-key scan returned nothing"
          mapfile -t host_fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 2>/dev/null | awk '{print $2}' | sort -u)
          [[ ${#host_fingerprints[@]} -eq 1 ]] || fail 35 "ambiguous host key"
          [[ ${host_fingerprints[0]} == "$EXPECTED_HOST_FINGERPRINT" ]] || fail 36 "host fingerprint does not match the protected pin"

          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Run the A/B on the droplet
        id: run
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          AB_BRIEF: ${{ inputs.brief }}
          AB_YEAR: ${{ inputs.vehicle_year }}
          AB_MAKE: ${{ inputs.vehicle_make }}
          AB_MODEL: ${{ inputs.vehicle_model }}
          AB_TYPE: ${{ inputs.vehicle_type }}
          AB_CAPTURE_ONLY: ${{ inputs.capture_only }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          ssh_args=(-i "$KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS" -o ServerAliveInterval=30 -o ServerAliveCountMax=20)
          brief_b64=$(printf '%s' "$AB_BRIEF" | base64 -w0)

          # The candidate ref's runtime modules run inside the DEPLOYED image's
          # dependencies. The teaching proof travels with them — it is a bundled
          # release asset, so the arm-A image is the exact one production sends.
          tar -cz \
            --exclude runtime/node_modules \
            scripts/atlas-teaching-proof-ab.mjs \
            scripts/atlas-teaching-proof-variant.mjs \
            atlas-call1-build \
            runtime > "$RUNNER_TEMP/ab-payload.tgz"
          payload_file=$(ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            'f=$(mktemp /tmp/designpro-tpab-payload.XXXXXX) && cat > "$f" && echo "$f"' \
            < "$RUNNER_TEMP/ab-payload.tgz")
          test -n "$payload_file"

          set +e
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "AB_BRIEF_B64='$brief_b64' AB_YEAR='$AB_YEAR' AB_MAKE='$AB_MAKE' AB_MODEL='$AB_MODEL' AB_TYPE='$AB_TYPE' AB_CAPTURE_ONLY='$AB_CAPTURE_ONLY' AB_PAYLOAD_FILE='$payload_file' bash -s" <<'REMOTE' > "$RUNNER_TEMP/ab.log" 2>&1
          set -Eeuo pipefail
          env_file=/opt/designproai-os/shared/runtime.env
          test -f "$env_file" || { echo "runtime.env missing — run configure-env.sh first"; exit 41; }

          # The runtime's dependencies live INSIDE the image, never on the host
          # (ops/Dockerfile.runtime does npm ci then COPY runtime/ ./). So the
          # harness runs in a throwaway container built from the EXACT image the
          # live service runs, and the live service is not touched.
          image=$(docker ps \
            --filter label=com.docker.compose.project=designproai-os \
            --format '{{.Image}}' | grep '^designproai-runtime:' | head -n1)
          if [ -z "$image" ]; then
            echo "no running designproai-runtime container to borrow the image from"
            docker ps --format '{{.Names}}  {{.Image}}  {{.Status}}' || true
            exit 42
          fi
          echo "runtime image: $image"

          test -f "$AB_PAYLOAD_FILE" || { echo "payload file missing on host"; exit 43; }
          work=$(mktemp -d /tmp/designpro-tpab.XXXXXX)
          out="$work/ab-evidence"
          mkdir -p "$out"
          cleanup() { rm -rf "$work" "$AB_PAYLOAD_FILE"; }
          trap cleanup EXIT

          tar -C "$work" -xzf "$AB_PAYLOAD_FILE"
          ln -sfn /app/node_modules "$work/runtime/node_modules"
          chmod -R 0777 "$work" "$out"

          brief=$(printf '%s' "$AB_BRIEF_B64" | base64 -d)

          set +e
          docker run --rm \
            --env-file "$env_file" \
            -v "$work:/work" -w /work \
            --entrypoint node "$image" \
            scripts/atlas-teaching-proof-ab.mjs \
              --out /work/ab-evidence \
              --call1 ./atlas-call1-build/atlas-call1-prompt.mjs \
              --capture-only "$AB_CAPTURE_ONLY" \
              --brief "$brief" \
              --vehicle-year "$AB_YEAR" --vehicle-make "$AB_MAKE" \
              --vehicle-model "$AB_MODEL" --vehicle-type "$AB_TYPE"
          status=$?
          set -e

          echo "---AB-EVIDENCE-TAR---"
          tar -C "$out" -cz . | base64 -w0
          exit $status
          REMOTE
          ssh_status=$?
          set -e

          mkdir -p ab-evidence
          if grep -q -- '---AB-EVIDENCE-TAR---' "$RUNNER_TEMP/ab.log"; then
            sed -n '1,/---AB-EVIDENCE-TAR---/p' "$RUNNER_TEMP/ab.log" | sed '$d' > ab-evidence/ab-run.log
            sed -n '/---AB-EVIDENCE-TAR---/,$p' "$RUNNER_TEMP/ab.log" | tail -n +2 | tr -d '\n' | base64 -d | tar -C ab-evidence -xz
          else
            cp "$RUNNER_TEMP/ab.log" ab-evidence/ab-run.log
          fi
          cat ab-evidence/ab-run.log
          exit "$ssh_status"

      - name: Summarise
        if: always()
        shell: bash
        run: |
          if [ -f ab-evidence/COMPARISON.md ]; then cat ab-evidence/COMPARISON.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f ab-evidence/parity.json ]; then
            { echo; echo '## harness ↔ deployed-edge request parity'; echo '```json'; cat ab-evidence/parity.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the A/B evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atlas-teaching-proof-ab-${{ github.run_id }}
          path: ab-evidence/**
          if-no-files-found: warn
          retention-days: 90

      - name: Restate what a human still has to judge
        if: always()
        run: |
          cat <<'NOTE'
          Green is not a pass. This run produces evidence, not a verdict.

            requests.json    both complete pre-Gemini requests; they differ in one part
            parity.json      the harness request against the deployed edge's own numbers
            COMPARISON.md    edgeHoleRatio and largest-dark-component, per surface, per arm
            P/A/B *.png      the three raw masters
            teaching-proof-A-production.png / -B-neutral-field.png

          P and A are the SAME condition drawn twice. B is a result only if it
          moves further than the P↔A gap. Design quality and Driver/Passenger
          cohesion are the owner's judgement, on the images — no number here
          decides either, and no production change follows from this run alone.
          NOTE
