name: A.T.L.A.S. Call-1 — isolated-variable A/B

# One dispatch surface, one isolated variable per test, measured on the RAW
# PRE-REPAIR master.
#
#   test 1 — the teaching proof's black separation/background field becomes a
#            neutral field. Three image calls: P (the deployed edge), A (the
#            harness, production proof), B (the harness, neutral field). P and A
#            are the same condition drawn twice.
#            RESULT: refuted. B produced the flank holes rather than removing
#            them, and P↔A variance spanned a whole output class.
#
#   test 2 — the neutral target guide PAIR (the instruction and the image) is
#            absent. Not replaced, not recoloured. `draws` image calls per arm,
#            interleaved A,B,A,B,…, because test 1 measured within-condition
#            variance larger than any single-pair effect could clear.
#            RESULT: the flank black holes went with the guide -- complete
#            separation, 3 draws to 3 -- but the panels stayed contoured
#            silhouettes in a field that merely changed colour, which `holeAt`
#            cannot see. Removing the guide fixed the black, not the shape.
#
#   test 3 — the compact normalized [0,1] topology text is ADDED to the
#            guide-absent request. Primary endpoint is full-bleed rectangular
#            compliance, measured COLOUR-BLIND: `holeAt` is
#            near-black-or-transparent, so an acceptance rate measured with it is
#            a number about the background's colour.
#            RESULT: inconclusive. Compliance was 0/6 in every draw of both arms,
#            and the output class collapsed to vehicle_depiction 3/3 -- because
#            arm B handed Gemini coordinates contradicting the teaching proof
#            sitting above them (HOOD and REAR are swapped between the two).
#
#   test 4 — the teaching proof itself, with ONLY its HOOD and REAR blocks
#            swapped so its centre column matches CENTER_ORDER. Guide absent, no
#            topology text. Primary endpoint is output-class stability. Resolves
#            the contradiction test 3 ran into.
#            RESULT: null. A is approximately B, compliance 0/6 in every draw of
#            both arms -- and the two runs' shared control arm exposed that
#            output class cannot be measured at n=3 (the same request returned
#            flat_atlas 3/3 and vehicle_depiction 3/3 an hour apart).
#
#   test 5 — the deployed output contract asks for two different objects at once:
#            "a roll of printed vinyl laid flat on a table" AND "the complete
#            flattened panel layout of the vehicle". ONE clause is reframed from
#            vehicle anatomy to print media; nothing else changes. SIX draws per
#            arm. Primary endpoint is RULE 0.32's contract: six continuous
#            rectangular artwork regions, edge to edge, no missing-artwork
#            fields, no anatomy contours -- measured colour-blind.
#            RESULT: null. 0 of 72 zones compliant; arm A at n=6 is exactly 3
#            flat_atlas to 3 vehicle_depiction, which fixes the baseline.
#
#   test 6 — the teaching proof's six TECHNICAL labels erased, artwork and
#            Flamingo branding untouched. They are burned into the output in
#            every measured draw despite the prompt forbidding it. Known
#            confound: erasing them also erases the proof's DRIVER-left /
#            PASSENGER-right disagreement with manifest.zones.
#            RESULT: null, and decisive anyway -- arm B still printed labels,
#            including "A.T.L.A.S. ARTBOARD", a string absent from the image. The
#            leak is textual, not image conditioning.
#
#   test 7 — the proof's six panels scaled to TILE the canvas edge to edge. Six
#            variables have changed everything about the example except its
#            morphology, and its morphology is the defect: panels floating in a
#            separation field, which is exactly what the outputs return.
#            CANCELLED before results by owner ruling: stop modifying the
#            teaching image, six image-side variables are enough.
#
#   7b     — the model-facing OUTPUT/OBJECT description. The deployed prompt is
#            [creative assembly] + [output contract]; arm B keeps the creative
#            assembly byte for byte and reframes only the tail from
#            "artboard / panel layout / panels placed on a sheet" to one positive
#            print-media contract. No negative added. Screening size: 2 draws per
#            arm. PASS = 6/6 panes filled edge to edge; flat_atlas is not a pass.
#
#            RESULT: null. 0/6 in all four draws, and B's worst pane was WORSE
#            than A's in draw 1 (69.5% vs 55.4% non-artwork).
#
#   test 8 — the teaching proof PRESENT vs ABSENT. Seven variables have changed
#            properties OF the example; this removes the example. Arm B drops
#            parts [1] and [2] and nothing else — not replaced, no topology
#            added, no new format clause, and the production neutral guide stays
#            in BOTH arms. The creative prompt cites no attachment, so nothing
#            is left dangling. 3 draws per arm, interleaved. PASS = 6/6 panes
#            filled edge to edge. If B is also 0/6, Call-1 prompt/reference
#            experimentation is finished and the question becomes architectural.
#
#            RESULT: null. 0/6 in all six draws; with no example image at all
#            the model still drew six objects on a sheet. Conditioning closed.
#
#   test 9 — FIELD RECOVERY (owner-approved Phase 1, ONE draw). Not an A/B.
#            Gemini authors ONE uninterrupted full-bleed composition from the
#            DesignPanelAI creative assembly (byte-identical except one scene
#            clause) + a field contract; it receives NO images. The OS owns six
#            canonical territories (`field-bands-v1`, flanks landscape, no
#            rotation) and the REAL `cutCallOnePanels` cuts the six files.
#            Every metric is telemetry; native effective PPI only; no gate.
#            RESULT: the anatomy left with the containers, and the composition
#            became three horizontal bands. Owner: closed; not the direction.
#
#   test 10 — ANCHOR RESTORATION (owner-approved, OPTION A, ONE draw). Not an
#            A/B. The deployed FIVE-part request — creative assembly byte for
#            byte, teaching text, Flamingo labeled proof, guide text, the
#            GENIE-proportioned neutral guide on production CENTER_ORDER
#            (REAR → ROOF → HOOD → FRONT) — with ONLY the output tail of part 0
#            replaced by the owner's object-first A.T.L.A.S. anchor
#            (`scripts/atlas-anchor-contract.mjs`). Raw master saved first;
#            the REAL `cutCallOnePanels` cuts the six files; three reports.
#            Every metric is telemetry; no gate; no repeatability; STOP after.
#            v1 RESULT (run 33642303437): vehicle-body-piece mockup; the
#            anchor at the END of Part 0 was overridden by "flat orthographic
#            panels" / "flowing across the panels" earlier in the creative
#            assembly. v2: the object definition moves to the front of Part 0
#            and six exact-match object-schema phrases are replaced, with a
#            reverse proof that the creative assembly changed by nothing else.
#            v2 RESULT (run 33647927930): the production topology was followed
#            for the first time — two flank columns, four centre regions, one
#            design — but each region still held a vehicle body piece (die-cut
#            arches, seams, handles) on a black surround. v3: the embodiment
#            sentence becomes the printed-sheet object, "flattened means zero
#            body lines"; parts 1 and 3 get the same object-schema cleanup.
#            v3 RESULT (run 33649706183): rectangles inside the topology, body
#            detail gone, three centre regions filled; the last body line is
#            two wheel-arch notches per flank. v4 (run 33650898106): v3 plus
#            exactly ONE three-word negative, "No tire cutouts." -- REGRESSED
#            to full body pieces with larger tire cutouts and burned-in labels.
#            Owner ruling 2026-09-02: no further negative wording; the harness
#            wording is returned to v3 and Call-1 six-pane conditioning work
#            stops here. The next move is architectural (test 11).
#
#   test 12 — SIX-REGION TOPOLOGY TEXT (owner-approved candidate, ONE draw).
#            Not an A/B. RULE 0.34 rejected the v24 one-field/thirds
#            composition and approved the direction: restore the single-master
#            six-surface A.T.L.A.S. flattened topology — PASSENGER | REAR /
#            ROOF / HOOD / FRONT | DRIVER — and require the ORIGINAL Call-1
#            draw to fill every production territory with intentional,
#            anatomy-free, full-bleed artwork.
#            The request is the v2 machinery with ONE change: the tail. Same
#            seven reversible creative swaps, same reverse proof, same guards,
#            same request builder that refuses a structural image. ONE text
#            part, ZERO images, `gemini-3-pro-image`, 1:1, 4K, no temperature.
#            The territories are the PRODUCTION six-region `buildAtlasManifest`
#            zones, not `field-thirds-v2`.
#            HONEST CLASSIFICATION: this is a topology-text experiment, the
#            same family as test 3, which was null. The untested cell is zero
#            images + zero surface names + the edge-to-edge extent sentence +
#            a positional description of the arrangement. It is a hypothesis,
#            not a prediction, and one draw is one draw.
#            The exact bytes are OWNER-APPROVED and PINNED. Before the call the
#            runner reproduces and asserts every locked value — prompt sha256
#            2c460057a646f12722bf0f50019987d1506b2215a72f1ae26a642901ca4ccc24,
#            3,983 chars, 4,210 request bytes, 1 text part, 0 image parts, the
#            exact model and generationConfig, no temperature — and REFUSES the
#            draw on any drift. A global fence around `globalThis.fetch` caps
#            the process at ONE image request; there is no retry and no reroll
#            on any outcome, including HTTP failure or a text-only return.
#            It stops after the raw master, the deterministic canonicalization
#            and the six crops: no repair, no cut-out fill, no gate retry, no
#            output-class inspection, no per-file inspection, no proofs, no
#            second draw. It mints no GenerationID/DesignID/RevisionID and
#            uploads nothing.
#            ⛔ NO runtime.env, NO DATABASE. Tests 9-11 read GENIE live, which
#            needs the SERVICE-ROLE key: designpro_vehicle_specs_universal and
#            designpro_vehicle_dimensions are both REVOKE ALL ... FROM PUBLIC,
#            anon, authenticated with GRANT ALL ... TO service_role, so no
#            lesser credential can read them. The owner forbids that key here,
#            so test 12 reads no database at all: the GENIE PHYSICAL DIMENSIONS
#            are pinned from run 33659500846 (territories.json
#            $.zones[*].trimWidthIn/.trimHeightIn, sha256 408250fc...) and the
#            six-surface topology is rebuilt by the production
#            buildAtlasManifest, cross-checked against $.legacyZones of that
#            same run.
#            ⚠️ PROVENANCE, STATED EXACTLY. Run 33659500846 RECORDED those
#            tall-column legacy zones and CUT NOTHING FROM THEM. Its panels were
#            cut by field-thirds-v2 ($.zones): driver (362,0,3371,1365),
#            passenger (362,1365,3371,1365) and four smaller areas from y=2730,
#            all at rotation 0 -- panels.json confirms driver at 3371x1365 px.
#            Test 12 uses the tall-column six-surface topology DELIBERATELY,
#            because RULE 0.34 makes it the target architecture. It is the
#            target, never that run's extraction receipt.
#            Environment allowlist: capture_only receives NO variables and runs
#            with --network none; the draw receives exactly one variable,
#            GEMINI_API_KEY, in a 0600 file that dies with the work directory.
#            The value never reaches a command line or the log. An allowlist
#            fence inside the script lets the process reach exactly ONE URL and
#            refuses every other request.
#            RESULT (run 33823909617, one draw): the first evidenced result
#            combining recognizable six-territory topology, anatomy-free
#            artwork and no instructional labels. FAILED registration to the
#            canonical GENIE territories, printable full bleed, passenger
#            orientation and all six production panels: the model composed the
#            arrangement at its own proportions (flanks 4.0:1, centre 2.0:1)
#            against GENIE's, with 6-8 px gutters, so every cut crossed a drawn
#            boundary. Offline registration was deterministic for that one
#            master but discards 33-38% of every territory; it is evidence
#            only and must never enter production.
#
#   test 13 — TEST 12 PLUS NORMALIZED GENIE-DERIVED PROPORTIONS (ONE draw).
#            Exactly one change from test 12: a single paragraph of normalized
#            territory extents, derived by code from the production
#            buildAtlasManifest zones (four decimals, no names, no coordinates
#            table, no image), inserted after the arrangement paragraph. The
#            brief, topology order, orientation wording, model, configuration,
#            zero-image input and every other byte are unchanged, and the
#            preflight proves it: removing the 317-char insertion at offset
#            3631 must reproduce test 12's sha 2c460057.... Locked at
#            4906f932e57d68cc125ab0c37bebac049885ad25f2093259d68b06a7a71df98a,
#            4,300 chars, 4,529 request bytes. Passenger orientation is NOT
#            addressed. Same runner, same credential isolation, same fence.
#            GENIE supplies the authoritative proportions; the model is
#            conditioned to compose within them.
#
# It changes nothing on the droplet or the project: no deploy, no env write, no
# service restart, no prompt change, no topology change. The production teaching
# proof and the edge function's hash pin on it are untouched — the variant is
# built in memory inside the run and never written anywhere production reads.
# `capture_only: true` proves both requests are identical except the one image
# and makes no provider call at all; run it first.

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Which isolated variable"
        required: true
        type: choice
        default: "10-anchor-restoration"
        options:
          - 1-teaching-proof-field
          - 2-guide-ablation
          - 3-topology-text
          - 4-teaching-proof-order
          - 5-object-clause
          - 6-label-erasure
          - 7-tiled-proof
          - 7b-object-model
          - 8-teaching-proof-absent
          - 9-field-recovery
          - 10-anchor-restoration
          - 11-field-recovery-v2
          - 12-six-region
          - 13-six-region-proportions
          - measure-accepted-master
      generation:
        description: "measure-accepted-master only — generation id or 8-char prefix"
        required: false
        type: string
        default: ""
      draws:
        description: "tests 2-8 — independent draws PER ARM (2 arms, so 2x this many image calls). Tests 9-13 (field recovery, anchor restoration, field recovery v2, six-region, six-region + proportions) accept ONLY 1 — owner ruling — and refuse anything else."
        required: true
        type: string
        default: "1"
      confirmation:
        description: "Protected live-provider action — real Gemini image calls (0 with capture_only)"
        required: true
        type: choice
        default: DO_NOT_RUN
        options:
          - DO_NOT_RUN
          - RUN_TEACHING_PROOF_AB
      capture_only:
        description: "Capture both requests and prove they differ only in the teaching image — no provider call"
        required: true
        type: boolean
        default: true
      brief:
        required: false
        type: string
        default: >-
          Bold commercial HVAC wrap for Precision Climate Solutions: deep blue base with
          sunrise-orange airflow ribbons sweeping front to rear, clean modern sans-serif
          company name, high contrast and legible at highway distance.
      vehicle_year:
        required: true
        type: string
        default: "2022"
      vehicle_make:
        required: true
        type: string
        default: Ford
      vehicle_model:
        required: true
        type: string
        default: F250 Crew Cab
      vehicle_type:
        required: true
        type: string
        default: truck

permissions:
  contents: read

concurrency:
  group: designproai-teaching-proof-ab
  cancel-in-progress: false

env:
  TARGET_HOST: 137.184.0.4
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng

jobs:
  ab:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RUN_TEACHING_PROOF_AB'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Prove protected live-provider intent
        run: |
          set +x
          test "${{ inputs.confirmation }}" = "RUN_TEACHING_PROOF_AB"
          test -n "$SSH_PRIVATE_KEY"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Extract the deployed Call-1 assembly
        shell: bash
        run: |
          set -Eeuo pipefail
          # Pinned to the version this repository already locks
          # (app/package-lock.json -> node_modules/esbuild 0.21.5). An unpinned
          # install would let a fresh esbuild bundle the Call-1 assembly the
          # locked toolchain has never produced.
          npm i --no-audit --no-fund --no-save esbuild@0.21.5
          "$PWD/node_modules/.bin/esbuild" --version | grep -qx '0.21.5'
          ESBUILD_BIN="$PWD/node_modules/.bin/esbuild" node scripts/build-atlas-call1-prompt.mjs atlas-call1-build
          test -s atlas-call1-build/atlas-call1-prompt.mjs

      - name: Pin the droplet SSH identity
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_ssh"
          public_key="$RUNNER_TEMP/designproai_ssh.pub"
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          fail() { printf '::error title=SSH identity pin::%s\n' "$*" >&2; exit "$1"; }

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          ssh-keygen -y -f "$key_file" > "$public_key" 2>/dev/null || fail 31 "automation private key could not be parsed"
          observed=$(ssh-keygen -lf "$public_key" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')
          [[ $observed == "$EXPECTED_AUTOMATION_KEY_FINGERPRINT" ]] || fail 38 "automation key fingerprint does not match the protected pin"

          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts" || fail 33 "host-key scan failed"
          [[ -s $known_hosts ]] || fail 34 "host-key scan returned nothing"
          mapfile -t host_fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 2>/dev/null | awk '{print $2}' | sort -u)
          [[ ${#host_fingerprints[@]} -eq 1 ]] || fail 35 "ambiguous host key"
          [[ ${host_fingerprints[0]} == "$EXPECTED_HOST_FINGERPRINT" ]] || fail 36 "host fingerprint does not match the protected pin"

          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Run the A/B on the droplet
        id: run
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          AB_BRIEF: ${{ inputs.brief }}
          AB_YEAR: ${{ inputs.vehicle_year }}
          AB_MAKE: ${{ inputs.vehicle_make }}
          AB_MODEL: ${{ inputs.vehicle_model }}
          AB_TYPE: ${{ inputs.vehicle_type }}
          AB_CAPTURE_ONLY: ${{ inputs.capture_only }}
          AB_TEST: ${{ inputs.test }}
          AB_DRAWS: ${{ inputs.draws }}
          AB_GENERATION: ${{ inputs.generation }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          ssh_args=(-i "$KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS" -o ServerAliveInterval=30 -o ServerAliveCountMax=20)
          brief_b64=$(printf '%s' "$AB_BRIEF" | base64 -w0)

          # The candidate ref's runtime modules run inside the DEPLOYED image's
          # dependencies. The teaching proof travels with them — it is a bundled
          # release asset, so the arm-A image is the exact one production sends.
          tar -cz \
            --exclude runtime/node_modules \
            scripts/atlas-teaching-proof-ab.mjs \
            scripts/atlas-guide-ablation-ab.mjs \
            scripts/atlas-topology-text-ab.mjs \
            scripts/atlas-teaching-proof-order-ab.mjs \
            scripts/atlas-teaching-proof-reorder.mjs \
            scripts/atlas-measure-master.mjs \
            scripts/atlas-object-clause-ab.mjs \
            scripts/atlas-teaching-proof-delabel-ab.mjs \
            scripts/atlas-teaching-proof-delabel.mjs \
            scripts/atlas-teaching-proof-tile-ab.mjs \
            scripts/atlas-teaching-proof-tile.mjs \
            scripts/atlas-object-model-ab.mjs \
            scripts/atlas-teaching-proof-ablation-ab.mjs \
            scripts/atlas-field-territories.mjs \
            scripts/atlas-field-contract.mjs \
            scripts/atlas-field-continuity.mjs \
            scripts/atlas-field-recovery.mjs \
            scripts/atlas-anchor-contract.mjs \
            scripts/atlas-anchor-recovery.mjs \
            scripts/atlas-field-territories-v2.mjs \
            scripts/atlas-field-contract-v2.mjs \
            scripts/atlas-field-inspection.mjs \
            scripts/atlas-field-recovery-v2.mjs \
            scripts/atlas-print-media-contract.mjs \
            scripts/atlas-fullbleed-metrics.mjs \
            scripts/atlas-teaching-proof-variant.mjs \
            atlas-call1-build \
            runtime > "$RUNNER_TEMP/ab-payload.tgz"
          payload_file=$(ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            'f=$(mktemp /tmp/designpro-tpab-payload.XXXXXX) && cat > "$f" && echo "$f"' \
            < "$RUNNER_TEMP/ab-payload.tgz")
          test -n "$payload_file"

          set +e
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "AB_BRIEF_B64='$brief_b64' AB_YEAR='$AB_YEAR' AB_MAKE='$AB_MAKE' AB_MODEL='$AB_MODEL' AB_TYPE='$AB_TYPE' AB_CAPTURE_ONLY='$AB_CAPTURE_ONLY' AB_TEST='$AB_TEST' AB_DRAWS='$AB_DRAWS' AB_GENERATION='$AB_GENERATION' AB_PAYLOAD_FILE='$payload_file' bash -s" <<'REMOTE' > "$RUNNER_TEMP/ab.log" 2>&1
          set -Eeuo pipefail
          env_file=/opt/designproai-os/shared/runtime.env
          test -f "$env_file" || { echo "runtime.env missing — run configure-env.sh first"; exit 41; }

          # The runtime's dependencies live INSIDE the image, never on the host
          # (ops/Dockerfile.runtime does npm ci then COPY runtime/ ./). So the
          # harness runs in a throwaway container built from the EXACT image the
          # live service runs, and the live service is not touched.
          image=$(docker ps \
            --filter label=com.docker.compose.project=designproai-os \
            --format '{{.Image}}' | grep '^designproai-runtime:' | head -n1)
          if [ -z "$image" ]; then
            echo "no running designproai-runtime container to borrow the image from"
            docker ps --format '{{.Names}}  {{.Image}}  {{.Status}}' || true
            exit 42
          fi
          echo "runtime image: $image"

          test -f "$AB_PAYLOAD_FILE" || { echo "payload file missing on host"; exit 43; }
          work=$(mktemp -d /tmp/designpro-tpab.XXXXXX)
          out="$work/ab-evidence"
          mkdir -p "$out"
          cleanup() { rm -rf "$work" "$AB_PAYLOAD_FILE"; }
          trap cleanup EXIT

          tar -C "$work" -xzf "$AB_PAYLOAD_FILE"
          ln -sfn /app/node_modules "$work/runtime/node_modules"
          chmod -R 0777 "$work" "$out"

          brief=$(printf '%s' "$AB_BRIEF_B64" | base64 -d)

          # Declared before the case: the remote script runs under `set -u`, so an
          # array first referenced inside a branch is an unbound-variable abort.
          extra_args=()
          case "$AB_TEST" in
            1-teaching-proof-field) runner=scripts/atlas-teaching-proof-ab.mjs ;;
            2-guide-ablation)       runner=scripts/atlas-guide-ablation-ab.mjs ;;
            3-topology-text)        runner=scripts/atlas-topology-text-ab.mjs ;;
            4-teaching-proof-order) runner=scripts/atlas-teaching-proof-order-ab.mjs ;;
            5-object-clause)        runner=scripts/atlas-object-clause-ab.mjs ;;
            6-label-erasure)        runner=scripts/atlas-teaching-proof-delabel-ab.mjs ;;
            7-tiled-proof)          runner=scripts/atlas-teaching-proof-tile-ab.mjs ;;
            7b-object-model)        runner=scripts/atlas-object-model-ab.mjs ;;
            8-teaching-proof-absent) runner=scripts/atlas-teaching-proof-ablation-ab.mjs ;;
            9-field-recovery)        runner=scripts/atlas-field-recovery.mjs ;;
            10-anchor-restoration)   runner=scripts/atlas-anchor-recovery.mjs ;;
            11-field-recovery-v2)    runner=scripts/atlas-field-recovery-v2.mjs ;;
            # The six-region candidate carries its own runner inside the pinned
            # contract module, so the approved bytes and the code that sends
            # them cannot drift apart. One image request, fenced; no retries.
            12-six-region)           runner=scripts/atlas-field-contract-v2.mjs ;;
            13-six-region-proportions)
              runner=scripts/atlas-field-contract-v2.mjs
              extra_args=(--variant proportions)
              ;;
            measure-accepted-master)
              # READ-ONLY. No provider call, no image generation, no write.
              runner=scripts/atlas-measure-master.mjs
              extra_args=(--generation "$AB_GENERATION")
              ;;
            *) echo "unknown test: $AB_TEST"; exit 44 ;;
          esac
          echo "test: $AB_TEST -> $runner"

          # ⛔ ENVIRONMENT ALLOWLIST FOR TEST 12 (owner ruling 2026-09-03).
          # runtime.env carries the service-role key, the database password, the
          # storage and deploy credentials and every provider secret. Test 12
          # never receives it: capture-only gets NO variables at all, and the
          # draw gets exactly ONE, GEMINI_API_KEY, in a 0600 file that dies with
          # $work. The value never appears on a command line, in an environment
          # listing, or in the log. Tests 1-11 are unchanged. Test 13 is the
          # same runner under the same policy.
          docker_args=(--env-file "$env_file")
          if [ "$AB_TEST" = "12-six-region" ] || [ "$AB_TEST" = "13-six-region-proportions" ]; then
            if [ "$AB_CAPTURE_ONLY" = "true" ]; then
              # No credential and nothing to fetch, so take the network away
              # entirely: the container cannot reach anything at all.
              docker_args=(--network none)
              echo "env policy: test $AB_TEST capture-only -> NO variables are passed, and --network none"
            else
              key_env="$work/gemini.env"
              : > "$key_env"
              chmod 600 "$key_env"
              raw=$(grep -m1 -E '^(GEMINI_API_KEY|GOOGLE_AI_API_KEY|GOOGLE_AI_API_KEY_POOL)=' "$env_file" \
                | cut -d= -f2- | cut -d, -f1 | tr -d '\r' \
                | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'\$//")
              if [ -z "$raw" ]; then echo "no Gemini key found in runtime.env"; exit 45; fi
              printf 'GEMINI_API_KEY=%s\n' "$raw" > "$key_env"
              unset raw
              docker_args=(--env-file "$key_env")
              echo "env policy: test $AB_TEST draw -> exactly one variable is passed: GEMINI_API_KEY"
            fi
          fi

          set +e
          docker run --rm \
            "${docker_args[@]+"${docker_args[@]}"}" \
            -v "$work:/work" -w /work \
            --entrypoint node "$image" \
            "$runner" \
              --out /work/ab-evidence \
              --call1 ./atlas-call1-build/atlas-call1-prompt.mjs \
              --capture-only "$AB_CAPTURE_ONLY" \
              --draws "$AB_DRAWS" \
              --brief "$brief" \
              --vehicle-year "$AB_YEAR" --vehicle-make "$AB_MAKE" \
              --vehicle-model "$AB_MODEL" --vehicle-type "$AB_TYPE" \
              "${extra_args[@]+"${extra_args[@]}"}"
          status=$?
          set -e

          echo "---AB-EVIDENCE-TAR---"
          tar -C "$out" -cz . | base64 -w0
          exit $status
          REMOTE
          ssh_status=$?
          set -e

          mkdir -p ab-evidence
          if grep -q -- '---AB-EVIDENCE-TAR---' "$RUNNER_TEMP/ab.log"; then
            sed -n '1,/---AB-EVIDENCE-TAR---/p' "$RUNNER_TEMP/ab.log" | sed '$d' > ab-evidence/ab-run.log
            sed -n '/---AB-EVIDENCE-TAR---/,$p' "$RUNNER_TEMP/ab.log" | tail -n +2 | tr -d '\n' | base64 -d | tar -C ab-evidence -xz
          else
            cp "$RUNNER_TEMP/ab.log" ab-evidence/ab-run.log
          fi
          cat ab-evidence/ab-run.log
          exit "$ssh_status"

      - name: Summarise
        if: always()
        shell: bash
        run: |
          if [ -f ab-evidence/COMPARISON.md ]; then cat ab-evidence/COMPARISON.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f ab-evidence/REPORT.md ]; then cat ab-evidence/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f ab-evidence/parity.json ]; then
            { echo; echo '## harness ↔ deployed-edge request parity'; echo '```json'; cat ab-evidence/parity.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the A/B evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atlas-teaching-proof-ab-${{ github.run_id }}
          path: ab-evidence/**
          if-no-files-found: warn
          retention-days: 90

      - name: Restate what a human still has to judge
        if: always()
        run: |
          cat <<'NOTE'
          Green is not a pass. This run produces evidence, not a verdict.

            requests.json    the complete pre-Gemini requests, per arm
            parity.json      arm A against the deployed edge's own measured numbers
            COMPARISON.md    output class, then edgeHole / largest-shape / flatBlack per surface
            *.png            every raw master, one per draw

          Two arms of one draw each cannot resolve an effect smaller than the
          within-condition variance, and on this fixture that variance spans a
          whole output class. Read arm-to-arm differences against the spread
          WITHIN each arm, never against zero.

          The production output-class gate's question is binary and cannot name a
          die-cut body template. Design quality, label/text contamination and
          Driver/Passenger cohesion are the owner's judgement, on the images — no
          number here decides them, and no production change follows from any run
          of this workflow.
          NOTE
