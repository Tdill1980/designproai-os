name: Migrate the GENIE vehicle-dimension catalog

# Copies the proven GENIE vehicle_dimensions catalog (the authority behind
# panelizer-step-validate / generate-2d-proof sizing) from the predecessor
# project into the standalone DesignProAI project, verbatim and idempotently:
# rows are read via the predecessor's public REST endpoint and upserted by id
# (merge-duplicates), so the run is safe to repeat and never invents a
# dimension. No customer or order data is touched — this one catalog table
# only.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Protected action — writes the GENIE catalog into the production DesignProAI database"
        required: true
        type: choice
        default: DO_NOT_MIGRATE
        options:
          - DO_NOT_MIGRATE
          - MIGRATE_GENIE_CATALOG

permissions:
  contents: read

concurrency:
  group: designproai-genie-catalog
  cancel-in-progress: false

env:
  TARGET_HOST: 137.184.0.4
  TARGET_HOSTNAME: designproai-prod-sfo3
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng
  SOURCE_URL: https://kfapjdyythzyvnpdeghu.supabase.co
  SOURCE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmYXBqZHl5dGh6eXZucGRlZ2h1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MzQzMDYsImV4cCI6MjA4NTIxMDMwNn0.OeFM3D0x-v8ie9KuVp1xfUKd2xv99ahtS4B6sC9SIyE

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'MIGRATE_GENIE_CATALOG'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
    steps:
      - name: Pin the exact droplet SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_ssh"
          pub_file="$RUNNER_TEMP/designproai_ssh.pub"
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          ssh-keygen -y -f "$key_file" > "$pub_file"
          test "$(ssh-keygen -lf "$pub_file" -E sha256 | awk 'NR==1 {print $2}')" = "$EXPECTED_AUTOMATION_KEY_FINGERPRINT"
          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts"
          test "$(ssh-keygen -lf "$known_hosts" -E sha256 | awk 'NR==1 {print $2}')" = "$EXPECTED_HOST_FINGERPRINT"
          echo "key_file=$key_file" >> "$GITHUB_ENV"
          echo "known_hosts=$known_hosts" >> "$GITHUB_ENV"

      - name: Copy the catalog verbatim and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts")
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "EXPECTED_HOSTNAME='$TARGET_HOSTNAME' SOURCE_URL='$SOURCE_URL' SOURCE_ANON_KEY='$SOURCE_ANON_KEY' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          test "$(hostname)" = "$EXPECTED_HOSTNAME"
          trap 'rm -f /tmp/genie-page.json' EXIT
          command -v jq >/dev/null || { apt-get update -qq && apt-get install -y -qq jq; }
          DB_URL=$(grep '^SUPABASE_URL=' /opt/designproai-os/shared/runtime.env | head -1 | cut -d= -f2-)
          DB_KEY=$(grep -E '^(SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SERVICE_KEY)=' /opt/designproai-os/shared/runtime.env | head -1 | cut -d= -f2-)
          test -n "$DB_URL" && test -n "$DB_KEY"
          echo "target: $(echo "$DB_URL" | sed 's|https://||;s|/.*||')"

          total=0
          offset=0
          page=1000
          while :; do
            code=$(curl -sS -m 120 -o /tmp/genie-page.json -w '%{http_code}' \
              "$SOURCE_URL/rest/v1/vehicle_dimensions?select=*&order=id.asc&offset=$offset&limit=$page" \
              -H "apikey: $SOURCE_ANON_KEY" -H "Authorization: Bearer $SOURCE_ANON_KEY")
            test "$code" = "200"
            n=$(jq 'length' /tmp/genie-page.json)
            [ "$n" -gt 0 ] || break
            up=$(curl -sS -m 300 -o /tmp/genie-up.json -w '%{http_code}' \
              -X POST "$DB_URL/rest/v1/vehicle_dimensions?on_conflict=id" \
              -H "apikey: $DB_KEY" -H "Authorization: Bearer $DB_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates,return=minimal" \
              --data-binary @/tmp/genie-page.json)
            if [ "$up" != "201" ] && [ "$up" != "200" ] && [ "$up" != "204" ]; then
              echo "upsert failed HTTP $up"; cat /tmp/genie-up.json; exit 1
            fi
            total=$((total + n))
            echo "upserted $n rows (running total $total)"
            offset=$((offset + page))
            [ "$n" -eq "$page" ] || break
          done

          src_count=$(curl -sS -m 60 "$SOURCE_URL/rest/v1/vehicle_dimensions?select=id" \
            -H "apikey: $SOURCE_ANON_KEY" -H "Authorization: Bearer $SOURCE_ANON_KEY" \
            -H "Prefer: count=exact" -H "Range: 0-0" -o /dev/null -D - | grep -i content-range | sed 's/.*\///' | tr -d '\r')
          dst_count=$(curl -sS -m 60 "$DB_URL/rest/v1/vehicle_dimensions?select=id" \
            -H "apikey: $DB_KEY" -H "Authorization: Bearer $DB_KEY" \
            -H "Prefer: count=exact" -H "Range: 0-0" -o /dev/null -D - | grep -i content-range | sed 's/.*\///' | tr -d '\r')
          echo "source rows: $src_count · target rows: $dst_count"
          test -n "$src_count" && test "$src_count" = "$dst_count"

          echo "── F-250 rows now resolvable from the migrated catalog ──"
          curl -sS -m 60 "$DB_URL/rest/v1/vehicle_dimensions?make=eq.Ford&model=ilike.*F*250*&select=make,model,year_range,side_width,side_height,hood_width,hood_length,roof_width,roof_length,back_width,back_height,total_sqft" \
            -H "apikey: $DB_KEY" -H "Authorization: Bearer $DB_KEY" | jq -c '.[]'
          REMOTE
