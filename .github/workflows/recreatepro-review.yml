name: RecreatePro scoped review

on:
  push:
    branches: [codex/recreatepro-standalone-20260924]

permissions:
  contents: read

concurrency:
  group: recreatepro-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Package exact tracked source for isolated review
        shell: bash
        run: |
          git rev-parse HEAD > recreatepro-review-sha.txt
          git ls-files -z | python3 -c 'import sys; paths=sys.stdin.buffer.read().split(b"\0"); extensions=(b".ts",b".tsx",b".js",b".jsx",b".mjs",b".cjs",b".json",b".sql",b".md",b".yml",b".yaml",b".toml",b".css",b".html",b".sh"); sys.stdout.buffer.write(b"\0".join(p for p in paths if p and p.endswith(extensions))+b"\0")' > /tmp/recreatepro-source-list
          tar --null -T /tmp/recreatepro-source-list -czf recreatepro-review-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: recreatepro-review-source-${{ github.sha }}
          path: |
            recreatepro-review-source.tar.gz
            recreatepro-review-sha.txt
          retention-days: 3
