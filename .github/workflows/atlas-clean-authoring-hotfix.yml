name: ATLAS clean authoring hotfix

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.atlas-hotfix-trigger'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/atlas-v8-clean-authoring-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply surgical ATLAS source patch
        shell: bash
        run: |
          if grep -q 'atlas-artboard-designiq.20260828.v8-clean' runtime/flat-first-atlas.cjs \
             && grep -q 'atlas-artboard-designiq.20260828.v8-clean' supabase/functions/design-panel-ai-generate/index.ts; then
            echo 'ATLAS v8 clean contract already applied; no patch needed.'
            exit 0
          fi
          python3 scripts/atlas-clean-authoring-hotfix.py
          git config user.name "DesignProAI Hotfix"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/atlas-clean-authoring-hotfix.yml scripts/atlas-clean-authoring-hotfix.py .atlas-hotfix-trigger
          git add runtime/flat-first-atlas.cjs supabase/functions/design-panel-ai-generate/index.ts tests/atlas-clean-authoring-contract.test.mjs
          git commit -m "fix: clean ATLAS Call-1 authoring contract"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Install dependencies
        run: npm ci

      - name: Run targeted ATLAS tests
        run: node --test tests/atlas-clean-authoring-contract.test.mjs tests/atlas-authoring-guide.test.mjs tests/atlas-artboard-edge-call1.test.mjs

      - name: Run full test suite
        run: npm test
