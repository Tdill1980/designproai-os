name: ATLAS clean authoring hotfix

on:
  push:
    paths:
      - '.github/workflows/atlas-clean-authoring-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch ATLAS Call-1 contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          runtime_path = Path('runtime/flat-first-atlas.cjs')
          edge_path = Path('supabase/functions/design-panel-ai-generate/index.ts')
          runtime = runtime_path.read_text()
          edge = edge_path.read_text()

          # 1) Version fence: runtime must expect the clean edge contract.
          runtime, n = re.subn(
              r'const ATLAS_ARTBOARD_EDGE_PROMPT_VERSION = "atlas-artboard-designiq\.[^"]+";',
              'const ATLAS_ARTBOARD_EDGE_PROMPT_VERSION = "atlas-artboard-designiq.20260828.v8-clean";',
              runtime,
              count=1,
          )
          assert n == 1, 'runtime edge prompt version not found exactly once'

          # 2) The model-facing guide is six plain outer rectangles only. Human/QC guide remains unchanged.
          clean_authoring_guide = r'''function authoringGuideSvg(manifest) {
  const rectangles = manifest.zones.map((zone) => (
    `<rect x="${zone.x}" y="${zone.y}" width="${zone.w}" height="${zone.h}" `
      + `fill="${zone.guideFill}"/>`
  )).join("");
  return Buffer.from(`<svg xmlns="http://www.w3.org/2000/svg" width="${CANVAS.widthPx}" height="${CANVAS.heightPx}" viewBox="0 0 ${CANVAS.widthPx} ${CANVAS.heightPx}">
    <rect width="100%" height="100%" fill="#111111"/>
    ${rectangles}
  </svg>`);
}'''
          runtime, n = re.subn(
              r'function authoringGuideSvg\(manifest\) \{.*?\n\}',
              clean_authoring_guide,
              runtime,
              count=1,
              flags=re.S,
          )
          assert n == 1, 'authoringGuideSvg block not found exactly once'

          # 3) Fail closed if technical furniture ever re-enters the authoring image.
          marker = '  const markup = svg.toString("utf8");\n'
          guard = '''  const markup = svg.toString("utf8");
  const forbiddenAuthoringMarkup = [
    [/<text\\b/i, "text"],
    [/stroke-dasharray/i, "dashed trim geometry"],
    [/<line\\b/i, "line geometry"],
    [/<path\\b/i, "path geometry"],
    [/<polygon\\b/i, "polygon geometry"],
  ];
  for (const [pattern, label] of forbiddenAuthoringMarkup) {
    if (pattern.test(markup)) {
      throw new FlatAtlasError(
        "flat_atlas_authoring_guide_contains_technical_furniture",
        `The model-facing A.T.L.A.S. guide contains ${label}; it must be six plain spatial regions only`,
      );
    }
  }
'''
          assert runtime.count(marker) == 1, 'renderAtlasAuthoringGuide markup marker drifted'
          runtime = runtime.replace(marker, guard, 1)

          # 4) Do not send GENIE dimensions, IDs, placement prose or named component topology to Gemini.
          clean_panels = '''    panels: manifest.zones.map((zone) => ({
      label: SURFACE_LABELS[zone.surfaceKey] || String(zone.surfaceKey).toUpperCase(),
    })),'''
          runtime, n = re.subn(
              r'    panels: manifest\.zones\.map\(\(zone\) => \(\{.*?\n    \}\)\),',
              clean_panels,
              runtime,
              count=1,
              flags=re.S,
          )
          assert n == 1, 'atlasEdgeRequestBody panels block not found exactly once'

          # 5) Edge version fence.
          edge, n = re.subn(
              r'const ATLAS_ARTBOARD_PROMPT_VERSION = "atlas-artboard-designiq\.[^"]+";',
              'const ATLAS_ARTBOARD_PROMPT_VERSION = "atlas-artboard-designiq.20260828.v8-clean";',
              edge,
              count=1,
          )
          assert n == 1, 'edge ATLAS_ARTBOARD_PROMPT_VERSION not found exactly once'

          # 6) Correct the textual center order anywhere the placement helper still describes it.
          edge = edge.replace(
              'in the CENTRE column, stacked ROOF then HOOD then FRONT then REAR from the top',
              'in the CENTRE column, stacked REAR then ROOF then HOOD then FRONT from the top',
          )

          # 7) Replace the contaminated technical inventory with a concise positive creative contract.
          clean_contract = r'''function atlasFlatMasterContract(
  panels: Array<{
    label: string;
    surfaceId?: string;
    placement?: string;
    widthInches?: number;
    heightInches?: number;
    topology?: AtlasPanelTopology;
  }>,
): string {
  const supplied = new Set((panels || []).map((panel) => String(panel.label || "").trim().toUpperCase()));
  const required = ["DRIVER SIDE", "PASSENGER SIDE", "HOOD", "ROOF", "FRONT", "REAR"];
  const missing = required.filter((label) => !supplied.has(label));
  if (missing.length) {
    throw new Error(`ATLAS panel identity incomplete: ${missing.join(", ")}`);
  }
  return `OUTPUT FORMAT — ONE FLAT A.T.L.A.S. MASTER on one square 4K canvas.
Use the attached clean six-region layout only as spatial placement.
Left tall region = Passenger Side artwork.
Centre top-to-bottom = Rear, Roof, Hood, Front.
Right tall region = Driver Side artwork.
Create one cohesive professional wrap composition filling every region completely edge-to-edge.
Treat a pickup flank as one coordinated composition across cab and bed; treat a van flank as one continuous commercial composition; treat a car or SUV flank as one continuous side composition; treat a box truck cab and box as one coordinated visual system.
The two flank regions share one coordinated side-design system, with every customer-facing word and logo readable in normal orientation on its installed side.
Return artwork only. Technical labels, measurements, trim/bleed metadata and production annotations exist outside the returned pixels and are not part of the design.
Any attached flattened-top-view reference teaches only the relationship of flattened vehicle surfaces. The customer's brief and verified customer assets control the creative design.`;
}'''
          edge, n = re.subn(
              r'function atlasFlatMasterContract\(.*?\n\}\n\nfunction buildDesignIQPrompt',
              clean_contract + '\n\nfunction buildDesignIQPrompt',
              edge,
              count=1,
              flags=re.S,
          )
          assert n == 1, 'atlasFlatMasterContract block not found exactly once'

          runtime_path.write_text(runtime)
          edge_path.write_text(edge)

          # 8) Regression lock focused on the actual Call-1 authority surfaces.
          test = r'''import test from "node:test";
import assert from "node:assert/strict";
import fs from "node:fs";

const runtime = fs.readFileSync(new URL("../runtime/flat-first-atlas.cjs", import.meta.url), "utf8");
const edge = fs.readFileSync(new URL("../supabase/functions/design-panel-ai-generate/index.ts", import.meta.url), "utf8");

function block(source, start, end) {
  const from = source.indexOf(start);
  assert.notEqual(from, -1, `missing ${start}`);
  const to = source.indexOf(end, from);
  assert.notEqual(to, -1, `missing ${end}`);
  return source.slice(from, to);
}

test("ATLAS model-facing guide is six plain spatial regions with no technical furniture", () => {
  const guide = block(runtime, "function authoringGuideSvg(manifest)", "/** The human-readable installer map");
  assert.match(guide, /manifest\.zones\.map/);
  assert.doesNotMatch(guide, /guideLabelsSvg|guideGeometrySvg|<text\\b|stroke-dasharray|<line\\b|<path\\b|<polygon\\b/i);
});

test("ATLAS authoring guide runtime fails closed on technical furniture", () => {
  const renderer = block(runtime, "async function renderAtlasAuthoringGuide", "function activeZoneMaskSvg");
  for (const token of ["<text\\b", "stroke-dasharray", "<line\\b", "<path\\b", "<polygon\\b"]) {
    assert.match(renderer, new RegExp(token.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&")));
  }
});

test("ATLAS center topology order is one authority: rear roof hood front", () => {
  assert.match(runtime, /const CENTER_ORDER = Object\.freeze\(\["rear", "roof", "hood", "front"\]\)/);
  const contract = block(edge, "function atlasFlatMasterContract(", "function buildDesignIQPrompt");
  assert.match(contract, /Centre top-to-bottom = Rear, Roof, Hood, Front\./);
  assert.doesNotMatch(contract, /ROOF then HOOD then FRONT then REAR/i);
});

test("ATLAS creative contract contains no production furniture vocabulary", () => {
  const contract = block(edge, "function atlasFlatMasterContract(", "function buildDesignIQPrompt");
  for (const forbidden of [
    "DASHED BLUE", "Surface ID", "pixel size", "title band", "vehicle silhouette",
    "ROCKER", "FENDER", "QUARTER",
  ]) assert.doesNotMatch(contract, new RegExp(forbidden, "i"));
});

test("ATLAS request stops exposing dimensions IDs placement and component topology to Gemini", () => {
  const request = block(runtime, "function atlasEdgeRequestBody", "async function callAtlasArtboardEdge");
  const panelBlock = block(request, "panels: manifest.zones.map", "guideStoragePath:");
  assert.match(panelBlock, /label:/);
  assert.doesNotMatch(panelBlock, /surfaceId:|placement:|widthInches:|heightInches:|topology:/);
});

test("ATLAS runtime and edge prompt versions are fenced together", () => {
  assert.match(runtime, /ATLAS_ARTBOARD_EDGE_PROMPT_VERSION = "atlas-artboard-designiq\.20260828\.v8-clean"/);
  assert.match(edge, /ATLAS_ARTBOARD_PROMPT_VERSION = "atlas-artboard-designiq\.20260828\.v8-clean"/);
});
'''
          Path('tests/atlas-clean-authoring-contract.test.mjs').write_text(test)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run targeted ATLAS regression tests
        run: node --test tests/atlas-clean-authoring-contract.test.mjs tests/atlas-authoring-guide.test.mjs tests/atlas-artboard-edge-call1.test.mjs

      - name: Run full test suite
        run: npm test

      - name: Push fix branch
        shell: bash
        env:
          FIX_BRANCH: fix/atlas-v8-clean-authoring-20260828
        run: |
          git config user.name "DesignProAI Hotfix"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "$FIX_BRANCH"
          git add runtime/flat-first-atlas.cjs supabase/functions/design-panel-ai-generate/index.ts tests/atlas-clean-authoring-contract.test.mjs
          git commit -m "fix: clean ATLAS Call-1 authoring contract"
          git push origin "$FIX_BRANCH"
