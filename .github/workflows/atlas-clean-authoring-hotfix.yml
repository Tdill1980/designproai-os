name: ATLAS clean authoring hotfix

on:
  push:
    paths:
      - '.github/workflows/atlas-clean-authoring-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply surgical ATLAS patch
        run: python3 scripts/atlas-clean-authoring-hotfix.py

      - name: Push fix branch
        env:
          FIX_BRANCH: fix/atlas-v8-clean-authoring-20260828
        run: |
          git config user.name "DesignProAI Hotfix"
          git config user.email "actions@users.noreply.github.com"
          git switch -C "$FIX_BRANCH"
          git add runtime/flat-first-atlas.cjs supabase/functions/design-panel-ai-generate/index.ts tests/atlas-clean-authoring-contract.test.mjs
          git commit -m "fix: clean ATLAS Call-1 authoring contract"
          git push --force-with-lease origin "$FIX_BRANCH"

      - name: Install dependencies
        run: npm ci

      - name: Run targeted ATLAS tests
        run: node --test tests/atlas-clean-authoring-contract.test.mjs tests/atlas-authoring-guide.test.mjs tests/atlas-artboard-edge-call1.test.mjs

      - name: Run full test suite
        run: npm test
