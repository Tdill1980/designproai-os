name: Apply canonical Call 1 migration v5

on:
  push:
    branches:
      - claude/atlas-generation-pipeline-awtekz

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/atlas-generation-pipeline-awtekz
          fetch-depth: 0

      - name: Apply base migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/one-canonical-call1-apply-v2.yml').read_text().splitlines()
          start = next(i for i,l in enumerate(src) if l.strip() == '- name: Pin authority and rewire Call 1')
          run_i = next(i for i in range(start, len(src)) if src[i].strip() == 'run: |')
          out=[]
          for line in src[run_i+1:]:
              if line.startswith('          '): out.append(line[10:])
              elif line.strip() == '': out.append('')
              else: break
          Path('/tmp/apply-call1.sh').write_text('\n'.join(out)+'\n')
          PY
          bash /tmp/apply-call1.sh

      - name: Add canonical reference clauses contact integrity and arm filter
        shell: bash
        run: |
          echo 'CmZyb20gcGF0aGxpYiBpbXBvcnQgUGF0aAoKcCA9IFBhdGgoInJ1bnRpbWUvZmxhdC1maXJzdC1hdGxhcy5janMiKQpzID0gcC5yZWFkX3RleHQoKQpzdGFydCA9IHMu<BASE64_TRUNCATED_PLACEHOLDER>' >/tmp/patch.b64
          base64 -d /tmp/patch.b64 >/tmp/patch.py
          python3 /tmp/patch.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - run: npm ci --prefix runtime
      - name: Focused Call 1 locks
        run: node --test tests/designpanel-vendor-pin.test.mjs tests/atlas-designiq-artboard.test.mjs tests/designpro-reference-authority.test.mjs tests/designiq-ab-arms.test.mjs tests/atlas-fail-fast.test.mjs tests/server-revision-studio.test.mjs
      - name: Full repo node suite
        run: node --test

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-canonical-call1-apply-v2.yml .github/workflows/one-canonical-call1-apply-v3.yml .github/workflows/one-canonical-call1-apply-v4.yml .github/workflows/one-canonical-call1-apply-v5.yml ops/.call1-v3-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use one canonical DPAG authoring call for A.T.L.A.S."
          git push origin HEAD:claude/atlas-generation-pipeline-awtekz
