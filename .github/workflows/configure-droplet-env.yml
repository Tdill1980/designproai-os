name: Configure the droplet environment from GitHub Secrets

# Writes /opt/designproai/shared/runtime.env and gateway.env on the droplet
# from the secrets stored in the designproai-production environment, over the
# same pinned SSH channel the dark deploy uses. No secret is ever typed into a
# terminal, echoed into a shell history, or printed by this workflow.
#
# It configures and nothing else. It does not deploy, does not build, does not
# touch the current release symlink, does not start or stop a container, and
# does not change Caddy, DNS, or any public port. The one canonical writer is
# ops/configure-env.sh — the same script the dark deploy calls — so there is no
# second, divergent notion of what a valid environment looks like, and
# ops/validate-env.py judges the result either way.
#
# Values reach a running release only when it is next deployed. The run says so
# explicitly if it finds containers already up.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Protected action — rewrites the droplet's production secrets"
        required: true
        type: choice
        default: DO_NOT_CONFIGURE
        options:
          - DO_NOT_CONFIGURE
          - INSPECT_DROPLET_ENV_ONLY
          - WRITE_DESIGNPROAI_DROPLET_ENV

permissions:
  contents: read

concurrency:
  group: designproai-droplet-env
  cancel-in-progress: false

env:
  TARGET_HOST: 137.184.0.4
  TARGET_HOSTNAME: designproai-prod-sfo3
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng
  EXPECTED_PROJECT_REF: wozyamlnygaddievzuwn
  CONFIGURE_MODE: ${{ inputs.confirmation }}

jobs:
  configure:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.confirmation == 'INSPECT_DROPLET_ENV_ONLY' ||
       inputs.confirmation == 'WRITE_DESIGNPROAI_DROPLET_ENV')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DESIGNPRO_SUPABASE_ACCESS_TOKEN }}
      GOOGLE_AI_API_KEY: ${{ secrets.DESIGNPRO_GOOGLE_AI_API_KEY }}
      TOPAZ_API_KEY: ${{ secrets.DESIGNPRO_TOPAZ_API_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Prove protected intent against the pinned host
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$GITHUB_REF" = refs/heads/main
          test "$TARGET_HOST" = "137.184.0.4"
          test "$TARGET_HOSTNAME" = "designproai-prod-sfo3"
          test "$EXPECTED_PROJECT_REF" = wozyamlnygaddievzuwn
          test -n "$SSH_PRIVATE_KEY"
          grep -q -- 'BEGIN OPENSSH PRIVATE KEY' <<<"$SSH_PRIVATE_KEY"

      - name: Resolve the provider secrets without ever printing one
        id: secrets
        if: env.CONFIGURE_MODE == 'WRITE_DESIGNPROAI_DROPLET_ENV'
        shell: bash
        env:
          # Consulted only for its keys, and only on the failure path below.
          VISIBLE_SECRET_NAMES: ${{ toJSON(secrets) }}
        run: |
          set -Eeuo pipefail
          set +x
          test "${#SUPABASE_ACCESS_TOKEN}" -ge 20
          test "${#GOOGLE_AI_API_KEY}" -ge 20
          for value in "$SUPABASE_ACCESS_TOKEN" "$GOOGLE_AI_API_KEY" "$TOPAZ_API_KEY"; do
            [[ $value != *$'\n'* && $value != *$'\r'* ]]
          done
          # An absent Topaz key here is almost always a misplaced secret rather
          # than a decision to run without Call 12 — the value resolves to an
          # empty string with no error, and the run would go on to write a
          # perfectly valid environment whose production packs fail closed
          # weeks later. Somebody deliberately configuring the droplet is
          # configuring it completely, so this fails now and says where to look.
          if [[ -z $TOPAZ_API_KEY ]]; then
            printf '::error title=Call 12::DESIGNPRO_TOPAZ_API_KEY resolved to an empty value.\n' >&2
            # Names only. A secret's value is masked in logs regardless, and
            # none is read here — but the name is the whole diagnosis, and
            # without it the next step is guessing at spelling from a list
            # GitHub truncates in the UI. Print exactly what this job can see.
            printf '\nSecret names visible to this job:\n' >&2
            jq -r 'keys[] | "  " + .' <<<"$VISIBLE_SECRET_NAMES" >&2 || true
            printf '\n' >&2
            cat >&2 <<'MISSING'
          The other three secrets resolved, so the job reached the right
          environment; this one is not in it. An environment secret is only
          visible to a job whose `environment:` matches the environment holding
          it — a secret of the right name in the wrong environment reads as
          absent, with no error.

          Add it as an Environment secret named DESIGNPRO_TOPAZ_API_KEY under
          Settings -> Environments -> designproai-production, beside
          DESIGNPROAI_SSH_PRIVATE_KEY, DESIGNPRO_SUPABASE_ACCESS_TOKEN and
          DESIGNPRO_GOOGLE_AI_API_KEY.
          MISSING
            exit 1
          fi
          # A present-but-malformed key is a misconfiguration too.
          [[ ${#TOPAZ_API_KEY} -ge 20 ]]

          # The service_role key is not stored as a secret. It is fetched from
          # the Supabase Management API for exactly this project, so there is
          # one fewer long-lived copy of it to leak or to drift.
          keys_json="$RUNNER_TEMP/supabase-api-keys.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_PROJECT_REF/api-keys" > "$keys_json"
          service_key=$(jq -er '
            [.[] | select(.name == "service_role" and (.api_key | type == "string"))]
            | if length == 1 then .[0].api_key else error("expected exactly one service_role key") end
          ' "$keys_json")
          test "${#service_key}" -ge 32
          echo "::add-mask::$service_key"
          umask 077
          runtime_key_file="$RUNNER_TEMP/designproai-supabase-service-role"
          printf '%s' "$service_key" > "$runtime_key_file"
          unset service_key SUPABASE_ACCESS_TOKEN
          rm -f -- "$keys_json"
          echo "runtime_key_file=$runtime_key_file" >> "$GITHUB_OUTPUT"

      - name: Pin the droplet SSH identity
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_ssh"
          public_key="$RUNNER_TEMP/designproai_ssh.pub"
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          fail() { printf '::error title=SSH identity pin::%s\n' "$*" >&2; exit "$1"; }

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          ssh-keygen -y -f "$key_file" > "$public_key" 2>/dev/null || fail 31 "automation private key could not be parsed"
          observed=$(ssh-keygen -lf "$public_key" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')
          printf 'Observed automation public-key fingerprint: %s\n' "$observed"
          printf 'Expected automation public-key fingerprint: %s\n' "$EXPECTED_AUTOMATION_KEY_FINGERPRINT"
          [[ $observed == "$EXPECTED_AUTOMATION_KEY_FINGERPRINT" ]] || fail 38 "automation public-key fingerprint does not match the protected client pin"

          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts" || fail 33 "unauthenticated ed25519 host-key scan failed"
          [[ -s $known_hosts ]] || fail 34 "unauthenticated ed25519 host-key scan returned no keys"
          mapfile -t host_fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 2>/dev/null | awk '{print $2}' | sort -u)
          printf 'Observed public SSH host fingerprint(s):\n'
          printf '  %s\n' "${host_fingerprints[@]}"
          printf 'Expected public SSH host fingerprint: %s\n' "$EXPECTED_HOST_FINGERPRINT"
          [[ ${#host_fingerprints[@]} -eq 1 ]] || fail 36 "expected exactly one unique ed25519 host fingerprint"
          [[ ${host_fingerprints[0]} == "$EXPECTED_HOST_FINGERPRINT" ]] || fail 37 "observed ed25519 host fingerprint does not match the protected pin"

          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Report the droplet's current environment state without reading a value
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS")
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" "EXPECTED_HOSTNAME='$TARGET_HOSTNAME' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          test "$(hostname)" = "$EXPECTED_HOSTNAME"
          test ! -e /opt/restylepro
          # Key names and file facts only. No value is read, printed, or hashed.
          for role in runtime gateway; do
            file=/opt/designproai/shared/$role.env
            if [[ -s $file ]]; then
              printf '%s.env  %s bytes  mode %s  keys: %s\n' \
                "$role" "$(stat -c %s "$file")" "$(stat -c %a "$file")" \
                "$(sed -n 's/^\([A-Z][A-Z0-9_]*\)=.*/\1/p' "$file" | paste -sd, -)"
            else
              printf '%s.env  absent or empty\n' "$role"
            fi
          done
          printf 'current release: %s\n' "$(readlink -f /opt/designproai/current 2>/dev/null || echo none)"
          printf 'running containers: %s\n' \
            "$(docker ps --filter label=com.docker.compose.project=designproai --format '{{.Label "com.docker.compose.service"}}' | sort | paste -sd, - || true)"
          REMOTE

      - name: Stage the configuration controls
        if: env.CONFIGURE_MODE == 'WRITE_DESIGNPROAI_DROPLET_ENV'
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS")
          remote_stage="/tmp/designproai-env-$GITHUB_RUN_ID"
          control="$RUNNER_TEMP/designproai-control.tgz"
          tar -czf "$control" ops
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" "test ! -e '$remote_stage' && install -d -m 0700 '$remote_stage'"
          scp "${ssh_args[@]}" "$control" "root@$TARGET_HOST:$remote_stage/"
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "tar -xzf '$remote_stage/designproai-control.tgz' -C '$remote_stage' --no-same-owner --no-same-permissions && chmod 0700 '$remote_stage/ops/'*.sh"

      - name: Write and validate the droplet environment
        if: env.CONFIGURE_MODE == 'WRITE_DESIGNPROAI_DROPLET_ENV'
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          RUNTIME_KEY_FILE: ${{ steps.secrets.outputs.runtime_key_file }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          ssh_args=(-i "$KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS")
          remote_stage="/tmp/designproai-env-$GITHUB_RUN_ID"
          test -f "$RUNTIME_KEY_FILE" && test ! -L "$RUNTIME_KEY_FILE"

          # Three lines, in the order configure-env.sh consumes them. The third
          # is always sent — empty when no Topaz key is configured — because a
          # short pipe is a truncated channel, not a decision about Call 12.
          #
          # The remote half is a staged script invoked by path, NOT a heredoc.
          # A heredoc would claim this ssh's stdin and silently discard the
          # pipe, leaving the reader on the far side to consume the tail of the
          # script where it expected a key.
          printf '%s\n%s\n%s\n' \
            "$(<"$RUNTIME_KEY_FILE")" \
            "$GOOGLE_AI_API_KEY" \
            "$TOPAZ_API_KEY" | \
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "REMOTE_STAGE='$remote_stage' '$remote_stage/ops/ci-configure-env.sh'"

      - name: Remove only this run's staging directory
        if: always() && env.CONFIGURE_MODE == 'WRITE_DESIGNPROAI_DROPLET_ENV' && steps.ssh.outputs.key_file != ''
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS")
          remote_stage="/tmp/designproai-env-$GITHUB_RUN_ID"
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "if test -d '$remote_stage' && test ! -L '$remote_stage'; then find '$remote_stage' -depth -mindepth 1 -delete && rmdir '$remote_stage'; fi"

      - name: State what this did and did not do
        if: always()
        run: |
          cat <<'NOTE'
          This run configured secrets. It did not deploy.

          Nothing about the current release changed: no artifact was built or
          transferred, the current symlink was not moved, and no container was
          started, stopped, or restarted. Caddy, DNS, and every public port are
          exactly as they were.

          A release that is already running still holds the environment it was
          started with. These values take effect on the next dark deploy.
          NOTE
