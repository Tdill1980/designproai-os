name: Validate TriZone underlay repair
on:
  push:
    branches: [ops/trizone-underlay-repair-20260923]
    paths: [.github/workflows/repair-trizone-underlay.yml]
permissions:
  contents: write
concurrency:
  group: trizone-underlay-repair-20260923
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: designproai-production
    env:
      BASE: c582a80b81de411db071dca2847b067c51e898e1
      PATCH_BRANCH: fix/trizone-underlay-preserve-artwork-20260923
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Require the inspected source baseline
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/ops/trizone-underlay-repair-20260923
          git merge-base --is-ancestor "$BASE" origin/main
          git diff --exit-code "$BASE" origin/main -- runtime supabase tests
          test "$(git rev-parse HEAD:supabase/functions/production-panel-proof/index.ts)" = e5fd2bd195da18823a191c51f290215673f6b754
          git diff --exit-code "$BASE" HEAD -- runtime supabase tests
      - name: Install pinned test dependencies
        run: |
          set -euo pipefail
          npm ci --prefix runtime --no-audit --no-fund > "$RUNNER_TEMP/runtime-install.log" 2>&1 &
          a=$!
          npm ci --prefix app --no-audit --no-fund > "$RUNNER_TEMP/app-install.log" 2>&1 &
          b=$!
          wait "$a" || { tail -50 "$RUNNER_TEMP/runtime-install.log"; exit 1; }
          wait "$b" || { tail -50 "$RUNNER_TEMP/app-install.log"; exit 1; }
      - name: Apply repair and reproduce baseline regressions
        run: |
          set -euo pipefail
          mkdir -p evidence "$RUNNER_TEMP/fixed-code"
          python3 .ops-trizone-repair.py
          python3 .ops-trizone-test-harness.py
          files=(supabase/functions/production-panel-proof/index.ts runtime/atlas-cutout-fill.cjs runtime/flat-first-atlas.cjs)
          for path in "${files[@]}"; do
            mkdir -p "$RUNNER_TEMP/fixed-code/$(dirname "$path")"
            cp "$path" "$RUNNER_TEMP/fixed-code/$path"
            git show "$BASE:$path" > "$path"
          done
          set +e
          node --test tests/production-panel-proof-clean-prompt.test.mjs tests/trizone-authored-artwork-preservation.test.mjs > evidence/before-tests.log 2>&1
          before=$?
          set -e
          for path in "${files[@]}"; do cp "$RUNNER_TEMP/fixed-code/$path" "$path"; done
          test "$before" -ne 0 || { echo 'Regression cases did not fail before the fix'; exit 1; }
          grep -E '^# (tests|pass|fail)|^not ok' evidence/before-tests.log
      - name: Run repaired request, pixel, recovery and contract tests
        run: |
          set -euo pipefail
          tests=(tests/production-panel-proof-clean-prompt.test.mjs tests/trizone-authored-artwork-preservation.test.mjs tests/designiq-shared-assembly.test.mjs)
          for p in tests/atlas-panel-proof-contract.test.mjs tests/atlas-panel-proof-topology.test.mjs tests/atlas-proof-panels.test.mjs tests/atlas-cutout-fill.test.mjs tests/flat-first-atlas.test.mjs; do
            if [ -f "$p" ]; then tests+=("$p"); fi
          done
          NODE_PATH="$GITHUB_WORKSPACE/runtime/node_modules" node --test --test-concurrency=2 "${tests[@]}" > evidence/after-tests.log 2>&1 || { tail -100 evidence/after-tests.log; exit 1; }
          grep -E '^# (tests|pass|fail|duration)' evidence/after-tests.log
          node --check runtime/atlas-cutout-fill.cjs
          node --check runtime/flat-first-atlas.cjs
          git diff --check
      - name: Read saved BigFoot source and background pixels without generating or modifying records
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DESIGNPRO_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const require = createRequire(process.cwd() + '/runtime/package.json');
          const sharp = require('sharp');
          const project = 'wozyamlnygaddievzuwn';
          async function read(url, options = {}) {
            const response = await fetch(url, {...options, signal: AbortSignal.timeout(30000)});
            if (!response.ok) throw new Error(`Read failed: HTTP ${response.status}`);
            return response;
          }
          if (!process.env.SUPABASE_ACCESS_TOKEN) throw new Error('Protected project access unavailable');
          const keys = await (await read(`https://api.supabase.com/v1/projects/${project}/api-keys`, {
            headers: { Authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}` },
          })).json();
          const service = keys.find(k => k.name === 'service_role')?.api_key;
          if (!service) throw new Error('Project service credential unavailable');
          console.log(`::add-mask::${service}`);
          const objects = [
            ['provider-sheet', 'atlas-panel-proof/a897fd4f7d58ce16fbd7778825d4fd61b6e5fe4fa9b4324c7867bbe21ec706ca.jpg', 'a897fd4f7d58ce16fbd7778825d4fd61b6e5fe4fa9b4324c7867bbe21ec706ca'],
            ['trizone-sheet', 'atlas-panel-proof/071dc4d436d1b5f5affb0a7bfc70cf62141dd6d3f37b23726506f51fbf20c704.png', '071dc4d436d1b5f5affb0a7bfc70cf62141dd6d3f37b23726506f51fbf20c704'],
            ['zone2-driver', 'atlas-panel-proof/quadrants/634042ffaa531edf36fd76ef609303b283a28d66efb41f379460e2fd955d3b93.png', '634042ffaa531edf36fd76ef609303b283a28d66efb41f379460e2fd955d3b93'],
            ['zone2-passenger', 'atlas-panel-proof/quadrants/c64d37289fb6146540af8a9f107dcfac0c42cd86c53e3ba5c5be0a15941c557f.png', 'c64d37289fb6146540af8a9f107dcfac0c42cd86c53e3ba5c5be0a15941c557f'],
          ];
          const report = [];
          for (const [name, path, expected] of objects) {
            const response = await read(`https://${project}.supabase.co/storage/v1/object/authenticated/wrap-files/${path}`, {
              headers: { apikey: service, Authorization: `Bearer ${service}` },
            });
            const bytes = Buffer.from(await response.arrayBuffer());
            const hash = createHash('sha256').update(bytes).digest('hex');
            if (hash !== expected) throw new Error(`${name}: stored-byte hash mismatch`);
            const metadata = await sharp(bytes).metadata();
            const {data, info} = await sharp(bytes).ensureAlpha().raw().toBuffer({resolveWithObject:true});
            let nonOpaquePixels = 0;
            for (let at = 3; at < data.length; at += 4) if (data[at] !== 255) nonOpaquePixels++;
            report.push({name, hash, width:metadata.width, height:metadata.height, format:metadata.format,
              hasAlpha:metadata.hasAlpha, nonOpaquePixels, pixelCount:info.width*info.height});
            await sharp(bytes).resize({width:1600, withoutEnlargement:true}).png().toFile(`evidence/${name}.png`);
          }
          writeFileSync('evidence/pixel-readback.json', JSON.stringify(report,null,2));
          console.log(JSON.stringify(report));
          NODE
      - name: Publish only tested product changes to a new patch branch
        run: |
          set -euo pipefail
          git reset --soft "$BASE"
          git reset
          rm .ops-trizone-repair.py .ops-trizone-test-harness.py .github/workflows/repair-trizone-underlay.yml
          git add supabase/functions/production-panel-proof/index.ts runtime/atlas-cutout-fill.cjs runtime/flat-first-atlas.cjs tests/production-panel-proof-clean-prompt.test.mjs tests/trizone-authored-artwork-preservation.test.mjs tests/atlas-panel-proof-contract.test.mjs tests/atlas-panel-proof-topology.test.mjs
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          test -z "$(git diff --cached --name-only -- app supabase/functions/_shared/designiq-assembly.ts supabase/functions/design-panel-ai-generate/index.ts supabase/functions/persona-photographer-render/index.ts)"
          git diff --cached --stat
          git -c user.name='Tdill1980' -c user.email='210197216+Tdill1980@users.noreply.github.com' commit -m 'fix: restore live TriZone instructions and preserve authored panel pixels'
          git push origin "HEAD:refs/heads/$PATCH_BRANCH"
          git rev-parse HEAD | tee evidence/patch-sha.txt
          git diff "$BASE" HEAD > evidence/repair.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: trizone-underlay-repair-evidence
          path: evidence/
          retention-days: 2
