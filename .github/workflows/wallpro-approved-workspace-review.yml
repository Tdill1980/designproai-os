name: WallPro approved workspace review
on:
  push:
    branches: [wallpro-approved-workspace-20260923]
permissions:
  contents: read
concurrency:
  group: wallpro-approved-workspace-review
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/wallpro-approved-workspace-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      - name: Package exact source and build dependencies for isolated UI review
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/wallpro-source-sha.txt"
          tar --exclude=.git --exclude=wallpro-review-source.tgz -czf "$RUNNER_TEMP/wallpro-review-source.tgz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wallpro-review-source
          path: |
            ${{ runner.temp }}/wallpro-review-source.tgz
            ${{ runner.temp }}/wallpro-source-sha.txt
          retention-days: 3
