name: Dispatch protected final QC production migration

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-final-qc-production-migration
  cancel-in-progress: false

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[dispatch-final-qc-production-migration]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Prove the one-time dispatch target
        env:
          EXPECTED_PARENT_SHA: e9e46ac4583ccf264a771c7aa4d43475f600048e
          EXPECTED_MIGRATION_SHA256: 13abcc08c9409f56954361dd57e19085a9c94312a7a1a82a74f5950277296376
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(sha256sum supabase/migrations/20260906132000_designpro_final_qc_resolves_late_fulfillment.sql | awk '{print $1}')" = "$EXPECTED_MIGRATION_SHA256"
      - name: Invoke the existing protected release gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          jq -n '{
            ref: "main",
            inputs: {
              production_migration: "APPLY_DESIGNPRO_PRODUCTION"
            }
          }' > "$RUNNER_TEMP/dispatch.json"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
            --input "$RUNNER_TEMP/dispatch.json"
