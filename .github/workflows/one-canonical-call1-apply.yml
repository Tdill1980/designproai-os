name: Apply canonical Call 1 migration

on:
  push:
    branches:
      - claude/atlas-generation-pipeline-awtekz

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/atlas-generation-pipeline-awtekz
          fetch-depth: 0

      - name: Pin behavioral authority and patch Call 1
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Tdill1980/restylepro-os.git /tmp/restylepro-os
          git -C /tmp/restylepro-os checkout --quiet 113d137dbe8813ca3bf70c8d7265ad081ebd4524

          cp /tmp/restylepro-os/supabase/functions/design-panel-ai-generate/index.ts supabase/functions/design-panel-ai-generate/index.ts
          cp /tmp/restylepro-os/supabase/functions/_shared/persona-designer-prompt.ts supabase/functions/_shared/persona-designer-prompt.ts
          cp /tmp/restylepro-os/supabase/functions/_shared/studio-os.ts supabase/functions/_shared/studio-os.ts
          cp /tmp/restylepro-os/supabase/functions/_shared/view-angles-os.ts supabase/functions/_shared/view-angles-os.ts

          cat > scripts/build-designpanel-authoring.mjs <<'EOF'
          #!/usr/bin/env node
          import { cpSync, mkdirSync, rmSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          import { dirname, join, resolve } from "node:path";
          import { fileURLToPath } from "node:url";
          import { buildControlPrompt } from "./build-control-prompt.mjs";

          export const DESIGNPANEL_AUTHORITY_COMMIT = "113d137dbe8813ca3bf70c8d7265ad081ebd4524";
          const HERE = dirname(fileURLToPath(import.meta.url));
          const REPO = resolve(HERE, "..");
          const outDir = join(REPO, "runtime", "vendor");
          const scratch = join(REPO, ".designpanel-authoring-build");
          rmSync(scratch, { recursive: true, force: true });
          mkdirSync(outDir, { recursive: true });
          const built = buildControlPrompt({ outDir: scratch, esbuild: process.env.ESBUILD_BIN || "npx" });
          cpSync(built, join(outDir, "designpanel-authoring.mjs"));
          execFileSync("npx", ["--yes", "esbuild", built, "--bundle", "--format=cjs", "--platform=node", `--outfile=${join(outDir, "designpanel-authoring.cjs")}`, "--log-level=warning"], { stdio: "inherit" });
          rmSync(scratch, { recursive: true, force: true });
          console.log(join(outDir, "designpanel-authoring.mjs"));
          EOF
          chmod +x scripts/build-designpanel-authoring.mjs

          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib, json

          p = Path('runtime/flat-first-atlas.cjs')
          s = p.read_text()
          old = '''const {
            DESIGNPANEL_ARTBOARD_PORT_VERSION,
            buildAtlasArtboardDesignIQDirection,
            DESIGNPANEL_AUTHORING_MODEL,
          } = require("./designiq-prompt.cjs");'''
          new = '''const { buildDesignIQPrompt } = require("./vendor/designpanel-authoring.cjs");
          const DESIGNPANEL_ARTBOARD_PORT_VERSION = "design-panel-ai-generate@113d137:artboard";
          const DESIGNPANEL_AUTHORING_MODEL = "gemini-3-pro-image";'''
          if old not in s:
              raise SystemExit('flat-first import seam drifted')
          s = s.replace(old, new, 1)
          s = s.replace('const PROMPT_VERSION = "designpro-flat-first-atlas-20260826.v8";', 'const PROMPT_VERSION = "designpro-flat-first-atlas-20260827.v9-dpag";', 1)

          start = s.index('function atlasCreativeRules(input, options = {}) {')
          end = s.index('\n}\n\nfunction atlasPrompt(', start) + 2
          replacement = r'''function atlasCreativeRules(input, manifest, options = {}) {
            const vehicle = input?.vehicle || {};
            const panelLabels = Object.freeze({
              driver: "DRIVER SIDE",
              passenger: "PASSENGER SIDE",
              hood: "HOOD",
              roof: "ROOF",
              front: "FRONT",
              rear: "REAR",
            });
            const panels = manifest.zones.map((zone) => ({
              label: panelLabels[zone.surfaceKey],
              widthInches: Number(zone.trimWidthIn),
              heightInches: Number(zone.trimHeightIn),
            }));
            const colors = Array.isArray(input?.colors) ? input.colors.map(String).join(", ") : "";
            return buildDesignIQPrompt({
              mode: "artboard",
              prompt: String(input?.brief || ""),
              finish: String(input?.finish || "Gloss"),
              substrate: input?.substrate || "standard",
              companyName: input?.companyName || input?.businessName || undefined,
              mascot: input?.mascot || undefined,
              bulletPoints: Array.isArray(input?.bulletPoints) ? input.bulletPoints : undefined,
              industryType: input?.industry || undefined,
              phone: input?.phone || undefined,
              brandColors: input?.brandColors || colors || undefined,
              fontStyle: input?.fontStyle || undefined,
              qrEnabled: input?.qrEnabled === true,
              vehicleYear: vehicle.year || input?.vehicleYear,
              vehicleMake: vehicle.make || input?.vehicleMake,
              vehicleModel: vehicle.model || input?.vehicleModel,
              visionBoardImages: Array.isArray(input?.visionBoardImages) ? input.visionBoardImages : [],
              visionboard_intent: input?.visionboardIntent || input?.visionboard_intent || "style_inspiration",
              styleDescriptors: input?.styleDescriptors || undefined,
              panels,
            });
          }'''
          s = s[:start] + replacement + s[end:]
          s = s.replace('return `${atlasCreativeRules(input, options)}', 'return `${atlasCreativeRules(input, manifest, options)}', 1)
          s = s.replace('same motif, scene, hierarchy, scale, landmarks and flow, reversed for the opposite flank', 'same motif, hierarchy, scale and flow, reversed for the opposite flank')
          s = s.replace('same motif, scene, palette, hierarchy, scale, landmarks and flow, reversed for the opposite flank', 'same motif, palette, hierarchy, scale and flow, reversed for the opposite flank')
          p.write_text(s)

          # Retire the reconstructed A.T.L.A.S. creative producer. The proof builders stay.
          p = Path('runtime/designiq-prompt.cjs')
          s = p.read_text()
          start_marker = 'function buildAtlasArtboardDesignIQDirection(input = {}, options = {}) {'
          next_marker = '// ═══════════════════════════════════════════════════════════════════════════\n// THE ARTWORK CALL'
          if start_marker not in s or next_marker not in s:
              raise SystemExit('designiq reconstructed branch boundary drifted')
          start = s.index(start_marker)
          end = s.index(next_marker, start)
          s = s[:start] + '// A.T.L.A.S. Call 1 creative authoring is vendored from design-panel-ai-generate@113d137.\n// This runtime file now serves proof/view prompt paths only.\n\n' + s[end:]
          # Remove compatibility wrapper that called the retired function.
          s = re.sub(r'\n// Compatibility export for the already-shipped caller\.[\s\S]*?function buildFlatDesignIQDirection\(input = \{\}, options = \{\}\) \{\n  return buildAtlasArtboardDesignIQDirection\(input, options\);\n\}\n', '\n', s, count=1)
          for token in ['  buildAtlasArtboardDesignIQDirection,\n', '  buildFlatDesignIQDirection,\n']:
              s = s.replace(token, '')
          p.write_text(s)

          # Minimal --arms filter: default stays all; B spends exactly one image call.
          p = Path('scripts/designiq-ab-precision.mjs')
          s = p.read_text()
          anchor = 'const OUT = args.out || "./ab-evidence";\n'
          if anchor not in s:
              raise SystemExit('A/B args seam drifted')
          s = s.replace(anchor, anchor + 'const ARMS = new Set(String(args.arms || "A,A2,B,C").split(",").map((v) => v.trim().toUpperCase()).filter(Boolean));\nconst runArm = (name) => ARMS.has(name);\n', 1)
          # Guard the four actual image calls, leaving request assembly/evidence intact.
          s = s.replace('const a = await callGemini({', 'const a = runArm("A") ? await callGemini({', 1).replace('\n  });\n\n  const a2 = await callGemini({', '\n  }) : null;\n\n  const a2 = runArm("A2") ? await callGemini({', 1)
          s = s.replace('\n  });\n\n  const b = await callGemini({', '\n  }) : null;\n\n  const b = runArm("B") ? await callGemini({', 1)
          s = s.replace('\n  });\n\n  const c = await callGemini({', '\n  }) : null;\n\n  const c = runArm("C") ? await callGemini({', 1)
          # Last call close before result assembly. Use the unique C output filename tail.
          s = s.replace('file: join(OUT, "C-artwork.png"),\n    systemInstruction: ace.ATLAS_ARTWORK_SYSTEM_INSTRUCTION,\n  });', 'file: join(OUT, "C-artwork.png"),\n    systemInstruction: ace.ATLAS_ARTWORK_SYSTEM_INSTRUCTION,\n  }) : null;', 1)
          p.write_text(s)

          # Pin exact owner-named authority bytes.
          files = [
              'supabase/functions/design-panel-ai-generate/index.ts',
              'supabase/functions/_shared/persona-designer-prompt.ts',
              'supabase/functions/_shared/studio-os.ts',
              'supabase/functions/_shared/view-angles-os.ts',
          ]
          pins = {f: hashlib.sha256(Path(f).read_bytes()).hexdigest() for f in files}
          test = '''import test from "node:test";\nimport assert from "node:assert/strict";\nimport { createHash } from "node:crypto";\nimport { readFileSync } from "node:fs";\n\nconst AUTHORITY_COMMIT = "113d137dbe8813ca3bf70c8d7265ad081ebd4524";\nconst PINS = ''' + json.dumps(pins, indent=2) + ''';\n\nconst sha256 = (path) => createHash("sha256").update(readFileSync(path)).digest("hex");\n\ntest("DesignPanel authoring source stays pinned to RestylePro 113d137", () => {\n  assert.equal(AUTHORITY_COMMIT, "113d137dbe8813ca3bf70c8d7265ad081ebd4524");\n  for (const [path, expected] of Object.entries(PINS)) assert.equal(sha256(path), expected, path);\n});\n\ntest("A.T.L.A.S. no longer owns a reconstructed creative branch", () => {\n  const prompt = readFileSync("runtime/designiq-prompt.cjs", "utf8");\n  const atlas = readFileSync("runtime/flat-first-atlas.cjs", "utf8");\n  assert.doesNotMatch(prompt, /function buildAtlasArtboardDesignIQDirection/);\n  assert.match(atlas, /vendor\\/designpanel-authoring\\.cjs/);\n  assert.doesNotMatch(atlas, /same motif, scene, hierarchy, scale, landmarks/);\n});\n'''
          Path('tests/designpanel-vendor-pin.test.mjs').write_text(test)

          # Lock the new source-of-truth contract in the existing atlas test without recreating prompt prose.
          p = Path('tests/atlas-designiq-artboard.test.mjs')
          t = p.read_text()
          t = re.sub(r'import \{[\s\S]*?\} from "\.\./runtime/designiq-prompt\.cjs";\n', 'import { readFileSync } from "node:fs";\n', t, count=1)
          # If the old test is too coupled to the removed function, replace it with focused source locks.
          if 'buildAtlasArtboardDesignIQDirection' in t:
              t = '''import test from "node:test";\nimport assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\n\ntest("Call 1 uses the pinned DesignPanel authoring artifact plus A.T.L.A.S. topology", () => {\n  const atlas = readFileSync("runtime/flat-first-atlas.cjs", "utf8");\n  assert.match(atlas, /buildDesignIQPrompt/);\n  assert.match(atlas, /mode: "artboard"/);\n  assert.match(atlas, /SOLID PANELS -- THIS IS THE MOST IMPORTANT RULE OF THIS CALL/);\n  assert.match(atlas, /REFERENCE FIREWALL/);\n  assert.match(atlas, /ONE COHESIVE WRAP, FLATTENED FROM DIRECTLY ABOVE/);\n  assert.doesNotMatch(atlas, /same motif, scene, hierarchy, scale, landmarks/);\n  assert.doesNotMatch(atlas, /punch out/i);\n});\n\ntest("the reconstructed A.T.L.A.S. creative producer is gone", () => {\n  const source = readFileSync("runtime/designiq-prompt.cjs", "utf8");\n  assert.doesNotMatch(source, /buildAtlasArtboardDesignIQDirection/);\n});\n'''
          p.write_text(t)

          # Owner directive note, with the explicit persona conflict disclosed rather than silently merged.
          p = Path('CLAUDE.md')
          c = p.read_text()
          note = '''\n## OWNER RULE — ONE CANONICAL CALL 1 (2026-08-26)\nA.T.L.A.S. Call 1 MUST use the exact vendored `design-panel-ai-generate/index.ts` creative builder pinned to RestylePro commit `113d137dbe8813ca3bf70c8d7265ad081ebd4524`, in DPAG `mode: "artboard"`, then append only the locked A.T.L.A.S. topology/output contract. No reconstructed A.T.L.A.S. creative prompt is allowed. `PROMPT_VERSION=designpro-flat-first-atlas-20260827.v9-dpag`. After master acceptance, only deterministic extraction and 3D proof presentation may follow; no second design-generation stage. VisionBoardIQ remains the one allowed pre-pass.\n\nAuthority conflict recorded exactly as directed: `_shared/persona-designer-prompt.ts` at 113d137 uses an older “elite / $5K-$10K / SEMA featured” identity and 3D-studio framing, while the primary DPAG `index.ts` uses the newer senior sign-and-wrap-company designer identity. DPAG `index.ts` wins for Call-1 creative authoring; the persona file is vendored and pinned but is not silently merged into Call 1.\n'''
          if '## OWNER RULE — ONE CANONICAL CALL 1 (2026-08-26)' not in c:
              c += note
          else:
              c = re.sub(r'\n## OWNER RULE — ONE CANONICAL CALL 1 \(2026-08-26\)[\s\S]*?(?=\n## |\Z)', note.rstrip()+'\n', c)
          p.write_text(c)
          PY

          # Build the committed runtime artifact from the pinned vendor source.
          node scripts/build-designpanel-authoring.mjs

          # Remove the one-off workflow from the resulting implementation commit.
          rm -f .github/workflows/one-canonical-call1-apply.yml

      - name: Verify focused contract
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/designpanel-vendor-pin.test.mjs tests/atlas-designiq-artboard.test.mjs tests/designpro-reference-authority.test.mjs tests/atlas-fail-fast.test.mjs tests/server-revision-studio.test.mjs

      - name: Verify full node suite
        shell: bash
        run: |
          set -euo pipefail
          node --test

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Use one canonical DPAG authoring call for A.T.L.A.S."
          git push origin HEAD:claude/atlas-generation-pipeline-awtekz
