name: RecreatePro reproduction persona acceptance
on:
  push:
    branches: [codex/recreatepro-proof-persona-20260924]
    paths: [.github/workflows/recreatepro-persona-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm ci --prefix app --no-audit --no-fund
      - name: Reproduce the actual phase1 rejection before repair
        run: |
          set -euo pipefail
          mkdir -p persona-evidence
          test "$(git hash-object supabase/functions/design-panel-ai-generate/index.ts)" = 17790de114b23113248eb8cc8a0f00412011cadf
          cat .github/recreatepro-phase1-cases.txt >> tests/production-panel-proof-clean-prompt.test.mjs
          if node --test tests/production-panel-proof-clean-prompt.test.mjs > persona-evidence/before.txt 2>&1; then echo 'Regression failed to reproduce'; exit 1; fi
          grep -F 'panel_proof_phase1_contract_missing:graphicDesignerPersonaInjected,nativeGeminiImageKnowledgeInjected' persona-evidence/before.txt
          # Preserve untagged prompt outputs for a byte-for-byte compatibility check.
          cat > /tmp/recreate-dump.mjs <<'JS'
          import{loadDesignIQ,ATLAS_PANELS}from'file://PLACEHOLDER/tests/helpers/load-designiq.mjs';
          const{buildDesignIQPrompt}=await loadDesignIQ();const results=[];
          for(const mode of ['commercial','restyle'])for(const intent of ['exact_reference','style_inspiration'])for(const withImages of [true,false]){
            results.push(buildDesignIQPrompt({mode,prompt:'A bold full wrap for Cedar Trail Cycles.',companyName:'Cedar Trail Cycles',finish:'Gloss',vehicleYear:'2024',vehicleMake:'Ford',vehicleModel:'Transit',vehicleType:'van',viewType:'side',atlasFlatMaster:true,atlasProofSheet:true,atlasPanels:ATLAS_PANELS,visionboard_intent:intent,visionBoardImages:withImages?[{storageUrl:'https://example.invalid/reference.png',slotLabel:'Reference'}]:[]}));
          }
          console.log(JSON.stringify(results));
          JS
          sed -i "s|PLACEHOLDER|$GITHUB_WORKSPACE|" /tmp/recreate-dump.mjs
          node /tmp/recreate-dump.mjs > persona-evidence/unchanged-before.json
      - name: Repair only tagged RecreatePro prompt and regenerate shared assembly
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/design-panel-ai-generate/index.ts')
          s=p.read_text()
          needle="${styleDescriptors}\\nThe customer's explicit requested edits supersede exact-copy instructions"
          replacement="${styleDescriptors}\\nUse your native image-generation and graphic-design knowledge to reconstruct the supplied artwork faithfully, complete only the requested missing surfaces, and adapt placement only for the selected vehicle or explicitly requested edits.\\nThe customer's explicit requested edits supersede exact-copy instructions"
          assert s.count(needle)==1
          s=s.replace(needle,replacement)
          needle="  const isExactRecreate = visionboard_intent === 'exact_reference';"
          replacement=needle+'''
            // A real RecreatePro request carries the proof endpoint's designer and
            // native-knowledge contract, bounded by source fidelity and edits.
            // Untagged legacy exact-reference and ordinary VehiclePro stay unchanged.
            const recreateDesignerRole = isExactRecreate && Array.isArray(visionBoardImages)
              && visionBoardImages.length > 0 && recreateReferenceTask(styleDescriptors)
              ? " As the reproduction graphic designer, preserve the supplied artwork as the design authority; reconstruct its production layout, complete only requested missing surfaces, and honor the customer's named edits."
              : "";
          '''
          assert s.count(needle)==1
          s=s.replace(needle,replacement)
          needle='You are a vehicle wrap REPRODUCTION specialist at WePrintWraps.com.'
          assert s.count(needle)==2
          s=s.replace(needle,needle+'${recreateDesignerRole}')
          p.write_text(s)
          PY
          node scripts/build-designiq-shared.mjs
          # This repair changes no runtime, gate, storage policy, API or UI.
          git rm .github/recreatepro-phase1-cases.txt .github/workflows/recreatepro-persona-verify.yml
          git add supabase/functions/design-panel-ai-generate/index.ts supabase/functions/_shared/designiq-assembly.ts tests/production-panel-proof-clean-prompt.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(recreatepro): complete reproduction designer persona at real proof boundary'
          git push origin HEAD:refs/heads/codex/recreatepro-proof-persona-20260924
          git rev-parse HEAD | tee persona-evidence/source-sha.txt
      - name: Require actual provider-bound tests and untouched VehiclePro prompt bytes
        run: |
          set -o pipefail
          node /tmp/recreate-dump.mjs > persona-evidence/unchanged-after.json
          cmp persona-evidence/unchanged-before.json persona-evidence/unchanged-after.json
          node --test tests/production-panel-proof-clean-prompt.test.mjs tests/recreatepro-reference-guidance.test.mjs tests/designiq-shared-assembly.test.mjs | tee persona-evidence/after.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recreatepro-persona-real-endpoint-acceptance
          path: persona-evidence/
          retention-days: 14
