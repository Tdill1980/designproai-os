name: Run exact WrapBox reconcile once

on:
  push:
    branches:
      - codex/run-wrapbox-reconcile-d289

permissions:
  contents: read

jobs:
  reconcile:
    if: github.repository == 'Tdill1980/designproai-os'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
      TARGET_HOST: 137.184.0.4
      EXPECTED_PARENT: d289eeb92bf9ca2fbd08db466d474af5d3a6947e
      EXPECTED_LIVE_RELEASE: d289eeb92bf9ca2fbd08db466d474af5d3a6947e
      EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
      EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Prove one-time reconciler identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-list --count HEAD^..HEAD)" = "1"
      - name: Run exact completed-pack reconciler
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_ssh"
          public_key="$RUNNER_TEMP/designproai_ssh.pub"
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          ssh-keygen -y -f "$key_file" > "$public_key"
          observed=$(ssh-keygen -lf "$public_key" -E sha256 | awk 'NR == 1 {print $2}')
          test "$observed" = "$EXPECTED_AUTOMATION_KEY_FINGERPRINT"
          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts"
          mapfile -t host_fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          test "${#host_fingerprints[@]}" -eq 1
          test "${host_fingerprints[0]}" = "$EXPECTED_HOST_FINGERPRINT"
          ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$known_hosts" "root@$TARGET_HOST" \
            "EXPECTED_LIVE_RELEASE='$EXPECTED_LIVE_RELEASE' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          test "$(basename "$(readlink -f /opt/designproai-os/current)")" = "$EXPECTED_LIVE_RELEASE"
          docker exec -i designproai-os-runtime-1-1 node <<'NODE'
          const { createClient } = require("@supabase/supabase-js");
          const { reconcileCompletedWrapboxDeliveries } = require("./wrapbox-delivery.cjs");
          const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, {
            auth: { persistSession: false, autoRefreshToken: false },
          });
          (async () => {
            const result = await reconcileCompletedWrapboxDeliveries({ supabase, limit: 25 });
            console.log(JSON.stringify(result));
            if (result.blocked.length) process.exitCode = 2;
          })().catch((error) => {
            console.error(JSON.stringify({ code: error.code || "unexpected", message: error.message }));
            process.exitCode = 3;
          });
          NODE
          REMOTE
