name: Probe the A.T.L.A.S. panel production proof
# A CONTROLLED RUN, NOT A PRODUCT RUN — owner ruling, Trish 2026-09-18:
# "Gemini image pro 3's newest model has no issues generating text we need to
#  rely on our custom design persona edge functions and Gemini's own brain and
#  test a flat panel production proof ... it must be fed a real flat panel
#  production proof and given the base prompt system engineering so it knows its
#  job on call 1 and has a clear example and done with thought multi modal best
#  practices."
#
# It calls the DEDICATED `production-panel-proof` edge function, which cannot
# reach `design-panel-ai-generate` at all — so production keeps calling the one
# Call-1 endpoint it always called, byte for byte (RULE 0.26), whatever this
# probe returns.
#
# WHAT IT WRITES: the two pinned multimodal inputs into wrap-files under
# content-addressed example paths (idempotent, hash-verified BOTH ways, skipped
# when already correct), and the returned sheet under its own sha256. NO
# generation request, revision, view or artifact row — and unlike the
# hero-driver probe it needs no harness lease either, because this endpoint is
# not the provider-cache path. Nothing routes to it and no flag changes.
#
# WHAT IT COSTS: exactly ONE gemini-3-pro-image request.
#
# WHY IT RUNS ON THE DROPLET: the probe needs the project's service key and
# @supabase/supabase-js, and both live in the deployed runtime image. Running it
# there means the request that goes out is assembled by the same dependencies
# production runs.
#
# THE OWNER JUDGES THE SHEET, NOT THIS LOG. The PNG, the COMPLETE assembled
# prompt and the evidence JSON come back as a run artifact. CLAUDE.md's standing
# rule, learned on cc382c3c: "Do not report A.T.L.A.S. status from receipts.
# Open the export before calling a run good."
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Protected action — makes ONE live image request against the production project"
        required: true
        type: choice
        default: DO_NOT_RUN
        options:
          - DO_NOT_RUN
          - RUN_PANEL_PROOF_PROBE
      owner_id:
        description: "Owner UUID (an operator account; the edge resolves it through auth admin)"
        required: true
        type: string
      promote:
        description: "Adopt an already generated sheet as the pinned CONTAINER TEMPLATE (storage path). Copies it inside the bucket; spends no image request."
        required: false
        type: string
        default: ""
      reuse:
        description: "Collect an ALREADY generated sheet by its storage path instead of spending a new image request (e.g. atlas-panel-proof/<sha>.png). Leave empty to generate."
        required: false
        type: string
        default: ""
      company:
        required: true
        type: string
        default: "Bright Smiles Dental"
      tagline:
        required: false
        type: string
        default: "HEALTHY SMILES BRIGHTER LIVES"
      phone:
        required: false
        type: string
        default: "(520) 555-0192"
      website:
        required: false
        type: string
        default: "brightsmiles.com"
      services:
        description: "Pipe-separated service lines"
        required: false
        type: string
        default: "General Dentistry|Cosmetic|Implants|Emergency Care"
      promo:
        required: false
        type: string
        default: "NEW PATIENTS WELCOME"
      brief:
        description: "The customer brief (the contract carries this verbatim)"
        required: true
        type: string
        default: "Bright Smiles Dental — clean flowing blue and teal wave design, a custom tooth logo, and a professional photograph of a smiling dental patient in a clinical chair inlaid into the rear three-quarter of each side panel."
      vehicle_year:
        required: true
        type: string
        default: "2012"
      vehicle_make:
        required: true
        type: string
        default: Toyota
      vehicle_model:
        required: true
        type: string
        default: Prius
      panels:
        description: "Pipe-separated GENIE trim rows, in INCHES (never normalized fractions — RULE 0.33)"
        required: true
        type: string
        default: "DRIVER: 165.7\" wide x 49.6\" high|PASSENGER: 165.7\" wide x 49.6\" high|HOOD: 50\" wide x 41\" high|ROOF: 43\" wide x 56\" high|FRONT: 50\" wide x 22\" high|REAR: 58\" wide x 40\" high"

permissions:
  contents: read

concurrency:
  group: designproai-panel-proof-probe
  cancel-in-progress: false

env:
  TARGET_HOST: 137.184.0.4
  EXPECTED_AUTOMATION_KEY_FINGERPRINT: SHA256:Kum4lu4ntmC5+Q1WIwbPZUCDhEfa0GyeVbdCn4Nsiic
  EXPECTED_HOST_FINGERPRINT: SHA256:2MADGyqFCuZYrIRL+/qm1EcxQOuFdQXFSN4/JWBjWng

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RUN_PANEL_PROOF_PROBE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: designproai-production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DESIGNPROAI_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Prove protected live-provider intent
        run: |
          set +x
          test "${{ inputs.confirmation }}" = "RUN_PANEL_PROOF_PROBE"
          test -n "$SSH_PRIVATE_KEY"

      - name: Pin the droplet SSH identity
        id: ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/designproai_ssh"
          public_key="$RUNNER_TEMP/designproai_ssh.pub"
          known_hosts="$RUNNER_TEMP/designproai_known_hosts"
          fail() { printf '::error title=SSH identity pin::%s\n' "$*" >&2; exit "$1"; }

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          ssh-keygen -y -f "$key_file" > "$public_key" 2>/dev/null || fail 31 "automation private key could not be parsed"
          observed=$(ssh-keygen -lf "$public_key" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')
          [[ $observed == "$EXPECTED_AUTOMATION_KEY_FINGERPRINT" ]] || fail 38 "automation key fingerprint does not match the protected pin"

          ssh-keyscan -T 10 -t ed25519 "$TARGET_HOST" 2>/dev/null > "$known_hosts" || fail 33 "host-key scan failed"
          [[ -s $known_hosts ]] || fail 34 "host-key scan returned nothing"
          mapfile -t host_fingerprints < <(ssh-keygen -lf "$known_hosts" -E sha256 2>/dev/null | awk '{print $2}' | sort -u)
          [[ ${#host_fingerprints[@]} -eq 1 ]] || fail 35 "ambiguous host key"
          [[ ${host_fingerprints[0]} == "$EXPECTED_HOST_FINGERPRINT" ]] || fail 36 "host fingerprint does not match the protected pin"

          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Run the probe inside the live runtime image
        id: run
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          P_OWNER: ${{ inputs.owner_id }}
          P_COMPANY: ${{ inputs.company }}
          P_TAGLINE: ${{ inputs.tagline }}
          P_PHONE: ${{ inputs.phone }}
          P_WEBSITE: ${{ inputs.website }}
          P_SERVICES: ${{ inputs.services }}
          P_PROMO: ${{ inputs.promo }}
          P_BRIEF: ${{ inputs.brief }}
          P_YEAR: ${{ inputs.vehicle_year }}
          P_MAKE: ${{ inputs.vehicle_make }}
          P_MODEL: ${{ inputs.vehicle_model }}
          P_PANELS: ${{ inputs.panels }}
          P_REUSE: ${{ inputs.reuse }}
          P_PROMOTE: ${{ inputs.promote }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          ssh_args=(-i "$KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS" -o ServerAliveInterval=30 -o ServerAliveCountMax=20)

          # The pinned example PNGs ride along: they are the multimodal inputs
          # the probe stages, and a probe that cannot show the model the format
          # is not this probe at all.
          tar -cz --exclude runtime/node_modules \
            scripts/atlas-panel-proof-probe.mjs \
            runtime/atlas-examples/panel-proof-container-template.png \
            runtime/atlas-examples/panel-production-proof-three-version.png \
            runtime/atlas-examples/installer-one-panel-per-side.png > "$RUNNER_TEMP/probe-payload.tgz"
          payload_file=$(ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            'f=$(mktemp /tmp/designpro-panel-proof.XXXXXX) && cat > "$f" && echo "$f"' \
            < "$RUNNER_TEMP/probe-payload.tgz")
          test -n "$payload_file"

          # Every free-text field travels base64-encoded, one per line, so an
          # apostrophe or a quote in a brief cannot break the remote shell.
          text_b64=$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s' \
            "$P_COMPANY" "$P_TAGLINE" "$P_PHONE" "$P_WEBSITE" "$P_SERVICES" "$P_PROMO" "$P_BRIEF" | base64 -w0)
          panels_b64=$(printf '%s' "$P_PANELS" | base64 -w0)

          set +e
          ssh "${ssh_args[@]}" "root@$TARGET_HOST" \
            "P_OWNER='$P_OWNER' P_TEXT_B64='$text_b64' P_PANELS_B64='$panels_b64' P_YEAR='$P_YEAR' P_MAKE='$P_MAKE' P_MODEL='$P_MODEL' P_REUSE='$P_REUSE' P_PROMOTE='$P_PROMOTE' P_PAYLOAD_FILE='$payload_file' bash -s" <<'REMOTE' > "$RUNNER_TEMP/probe.log" 2>&1
          set -Eeuo pipefail
          env_file=/opt/designproai-os/shared/runtime.env
          test -f "$env_file" || { echo "runtime.env missing"; exit 41; }

          image=$(docker ps \
            --filter label=com.docker.compose.project=designproai-os \
            --format '{{.Image}}' | grep '^designproai-runtime:' | head -n1)
          if [ -z "$image" ]; then echo "no running designproai-runtime container"; exit 42; fi
          echo "runtime image: $image"

          test -f "$P_PAYLOAD_FILE" || { echo "payload missing on host"; exit 43; }
          work=$(mktemp -d /tmp/designpro-panel-proof.XXXXXX)
          out="$work/probe-evidence"
          mkdir -p "$out"
          cleanup() { rm -rf "$work" "$P_PAYLOAD_FILE"; }
          trap cleanup EXIT

          tar -C "$work" -xzf "$P_PAYLOAD_FILE"
          mkdir -p "$work/runtime"
          ln -sfn /app/node_modules "$work/runtime/node_modules"
          chmod -R 0777 "$work" "$out"

          mapfile -t p_text < <(printf '%s' "$P_TEXT_B64" | base64 -d)
          p_panels=$(printf '%s' "$P_PANELS_B64" | base64 -d)

          set +e
          docker run --rm \
            --env-file "$env_file" \
            -e "PANEL_PROOF_OWNER_ID=$P_OWNER" \
            -v "$work:/work" -w /work \
            --entrypoint node "$image" \
            scripts/atlas-panel-proof-probe.mjs \
              --out /work/probe-evidence \
              --company "${p_text[0]}" --tagline "${p_text[1]}" --phone "${p_text[2]}" \
              --website "${p_text[3]}" --services "${p_text[4]}" --promo "${p_text[5]}" \
              --brief "${p_text[6]}" \
              --year "$P_YEAR" --make "$P_MAKE" --model "$P_MODEL" \
              --panels "$p_panels" ${P_REUSE:+--reuse "$P_REUSE"} ${P_PROMOTE:+--promote "$P_PROMOTE"}
          status=$?
          set -e

          echo "---PROBE-EVIDENCE-TAR---"
          tar -C "$out" -cz . | base64 -w0
          exit $status
          REMOTE
          ssh_status=$?
          set -e

          mkdir -p probe-evidence
          if grep -q -- '---PROBE-EVIDENCE-TAR---' "$RUNNER_TEMP/probe.log"; then
            sed -n '1,/---PROBE-EVIDENCE-TAR---/p' "$RUNNER_TEMP/probe.log" | sed '$d' > probe-evidence/probe-run.log
            sed -n '/---PROBE-EVIDENCE-TAR---/,$p' "$RUNNER_TEMP/probe.log" | tail -n +2 | tr -d '\n' | base64 -d | tar -C probe-evidence -xz
          else
            cp "$RUNNER_TEMP/probe.log" probe-evidence/probe-run.log
          fi
          cat probe-evidence/probe-run.log
          exit "$ssh_status"

      - name: Summarise the request that was actually sent
        if: always()
        shell: bash
        run: |
          {
            echo '## A.T.L.A.S. panel production proof probe'
            echo
            echo 'JUDGE THE SHEET, NOT THIS SUMMARY — download the artifact and open the PNG.'
            if [ -f probe-evidence/evidence.json ]; then
              echo; echo '### Evidence'; echo '```json'; cat probe-evidence/evidence.json; echo '```'
            fi
            if [ -f probe-evidence/prompt.txt ]; then
              echo; echo '### The COMPLETE assembled request'; echo '```'; cat probe-evidence/prompt.txt; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atlas-panel-proof-probe-${{ github.run_id }}
          path: probe-evidence
          if-no-files-found: warn
          retention-days: 30
