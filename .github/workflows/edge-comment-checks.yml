name: Fast Edge command security checks
on:
  pull_request:
    paths:
      - '.github/workflows/dispatch-edge-comment.yml'
      - '.github/workflows/edge-comment-checks.yml'
      - 'scripts/dispatch-edge-comment.mjs'
      - 'scripts/edge-hotfix-policy.mjs'
      - 'tests/edge-comment-dispatch.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-edge-comment.yml'
      - '.github/workflows/edge-comment-checks.yml'
      - 'scripts/dispatch-edge-comment.mjs'
      - 'scripts/edge-hotfix-policy.mjs'
      - 'tests/edge-comment-dispatch.test.mjs'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: node --test tests/edge-comment-dispatch.test.mjs
