name: Dispatch protected Call 12 production migration

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-call12-production-migration
  cancel-in-progress: false

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[dispatch-call12-production-migration]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Prove the one-time dispatch target
        env:
          EXPECTED_PARENT_SHA: 20386d2ecd9a04a45482bd8f16bdb14e2df5b20b
          EXPECTED_MIGRATION_SHA256: 32675b8ab0016b3013b127e8f8056d75fd39739ab22ebcf3e8db8693e496ea9c
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(sha256sum supabase/migrations/20260906121000_designpro_persist_call12_receipt.sql | awk '{print $1}')" = "$EXPECTED_MIGRATION_SHA256"
      - name: Invoke the existing protected release gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          jq -n '{
            ref: "main",
            inputs: {
              production_migration: "APPLY_DESIGNPRO_PRODUCTION"
            }
          }' > "$RUNNER_TEMP/dispatch.json"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
            --input "$RUNNER_TEMP/dispatch.json"
