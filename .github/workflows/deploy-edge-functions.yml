name: Deploy DesignPro Edge Functions

# Deploys the migrated, sanctioned DesignPro edge functions to the standalone
# DesignProAI Supabase project. Dispatch-only: function rollout is an explicit
# operator action, and config.toml is the single JWT-policy authority
# (verify_jwt = false per function; auth happens inside each handler).

on:
  workflow_dispatch:
    inputs:
      exact_sha:
        description: "Full successful main release SHA; must match the app, gateway and runtime"
        required: true
        type: string
      confirmation:
        description: "Protected action — deploys edge functions to the production DesignProAI Supabase project"
        required: true
        type: choice
        default: DO_NOT_DEPLOY
        options:
          - DO_NOT_DEPLOY
          - DEPLOY_DESIGNPRO_FUNCTIONS
      functions:
        description: "Comma-separated function names (empty = every function directory)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: designproai-edge-function-deploy
  cancel-in-progress: false

env:
  PROJECT_REF: wozyamlnygaddievzuwn
  EXACT_SHA: ${{ inputs.exact_sha }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DEPLOY_DESIGNPRO_FUNCTIONS'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: designproai-production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.exact_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact successful main release and embed source identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXACT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          git merge-base --is-ancestor "$EXACT_SHA" origin/main
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs" \
            -f head_sha="$EXACT_SHA" -f event=push -f status=success \
            | jq -e --arg sha "$EXACT_SHA" 'any(.workflow_runs[]; .head_sha == $sha and .head_branch == "main" and .conclusion == "success")'
          python3 - <<'PY'
          import json, os, pathlib
          pathlib.Path('supabase/functions/_shared/release-source.ts').write_text(
              'export const RELEASE_SOURCE_SHA = ' + json.dumps(os.environ['EXACT_SHA']) + ';\n')
          PY

      - name: Resolve function list
        id: fns
        env:
          INPUT_FUNCTIONS: ${{ inputs.functions }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_FUNCTIONS// /}" ]]; then
            list=$(printf '%s' "$INPUT_FUNCTIONS" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$')
          else
            list=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_shared' -printf '%f\n' | sort)
          fi
          while IFS= read -r fn; do
            [[ "$fn" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::invalid function name: $fn"; exit 1; }
            test -f "supabase/functions/$fn/index.ts" || { echo "::error::missing entrypoint for $fn"; exit 1; }
            grep -Fq "[functions.$fn]" supabase/config.toml || { echo "::error::$fn is not registered in supabase/config.toml"; exit 1; }
          done <<< "$list"
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$list" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Deploying:"; echo "$list"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Set function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DESIGNPRO_SUPABASE_ACCESS_TOKEN }}
          GOOGLE_AI_API_KEY: ${{ secrets.DESIGNPRO_GOOGLE_AI_API_KEY }}
          # GraphicsPro production stages (optional; each stage degrades to a
          # recorded no-op when its secret is absent, see docs/GRAPHICSPRO-END-TO-END.md):
          #   TOPAZ_API_KEY         run_production stage 1 (print-file upscale)
          #   VECTORIZE_DROPLET_URL vectorize-it → the DesignProAI runtime vectorize endpoint
          # The cut line, bleed, nesting and CutContour PDF need no secret:
          # supabase/functions/_shared/cut-contour is deterministic.
          TOPAZ_API_KEY: ${{ secrets.DESIGNPRO_TOPAZ_API_KEY }}
          VECTORIZE_DROPLET_URL: ${{ secrets.DESIGNPRO_VECTORIZE_DROPLET_URL }}
          # PatternPro paid path (create-wbty-checkout / wbty-stripe-webhook /
          # send-wbty-order-email). The webhook secret is the signing secret of
          # the Stripe endpoint that points at .../functions/v1/wbty-stripe-webhook;
          # without it every Stripe event is refused as unsigned and no order
          # ever leaves 'pending'.
          STRIPE_SECRET_KEY: ${{ secrets.DESIGNPRO_STRIPE_SECRET_KEY }}
          STRIPE_WBTY_WEBHOOK_SECRET: ${{ secrets.DESIGNPRO_STRIPE_WBTY_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.DESIGNPRO_RESEND_API_KEY }}
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is required}"
          if [[ -n "${GOOGLE_AI_API_KEY:-}" ]]; then
            supabase secrets set --project-ref "$PROJECT_REF" \
              "GOOGLE_AI_API_KEY=$GOOGLE_AI_API_KEY" \
              "GEMINI_API_KEY=$GOOGLE_AI_API_KEY"
          else
            echo "::warning::GOOGLE_AI_API_KEY secret not available; Gemini-backed functions will fail until it is set"
          fi
          for pair in "TOPAZ_API_KEY=${TOPAZ_API_KEY:-}" "VECTORIZE_DROPLET_URL=${VECTORIZE_DROPLET_URL:-}" \
                      "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}" "STRIPE_WBTY_WEBHOOK_SECRET=${STRIPE_WBTY_WEBHOOK_SECRET:-}" \
                      "RESEND_API_KEY=${RESEND_API_KEY:-}"; do
            name="${pair%%=*}"; value="${pair#*=}"
            if [[ -n "$value" ]]; then
              supabase secrets set --project-ref "$PROJECT_REF" "$pair"
            else
              echo "::warning::$name secret not available; the function that needs it fails closed until it is set"
            fi
          done

      - name: Deploy functions
        env:
          FUNCTIONS: ${{ steps.fns.outputs.list }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DESIGNPRO_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is required}"
          failed=()
          while IFS= read -r fn; do
            [[ -n "$fn" ]] || continue
            echo "::group::Deploying $fn"
            if supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api; then
              echo "Deployed $fn"
            else
              echo "::error::Deploy failed for $fn"
              failed+=("$fn")
            fi
            echo "::endgroup::"
          done <<< "$FUNCTIONS"
          if (( ${#failed[@]} )); then
            printf 'FAILED: %s\n' "${failed[@]}"
            exit 1
          fi

      - name: Remove prohibited second DesignPanel producer
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DESIGNPRO_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is required}"
          if supabase functions delete design-panel-color-render \
            --project-ref "$PROJECT_REF" --yes; then
            echo "Removed unsanctioned design-panel-color-render"
          else
            deployed=$(supabase functions list --project-ref "$PROJECT_REF")
            if grep -q 'design-panel-color-render' <<< "$deployed"; then
              echo "::error::design-panel-color-render still exists after delete"
              exit 1
            fi
            echo "design-panel-color-render was already absent"
          fi

      - name: Verify deployed functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DESIGNPRO_SUPABASE_ACCESS_TOKEN }}
          FUNCTIONS: ${{ steps.fns.outputs.list }}
        run: |
          set -euo pipefail
          deployed=$(supabase functions list --project-ref "$PROJECT_REF")
          echo "$deployed"
          while IFS= read -r fn; do
            [[ -n "$fn" ]] || continue
            grep -q "$fn" <<< "$deployed" || { echo "::error::$fn not present after deploy"; exit 1; }
            case "$fn" in
              design-panel-ai-generate|production-panel-proof|persona-photographer-render)
                actual=$(curl --fail --silent --show-error -X OPTIONS -D - -o /dev/null \
                  "https://$PROJECT_REF.supabase.co/functions/v1/$fn" \
                  | tr -d '\r' | awk 'tolower($1)=="x-designpro-source-sha:" {print $2}')
                test "$actual" = "$EXACT_SHA" || { echo "::error::$fn source SHA mismatch"; exit 1; }
                echo "$fn source SHA verified: $actual"
                ;;
            esac
          done <<< "$FUNCTIONS"
