name: Apply canonical Call 1 migration v4

on:
  push:
    branches:
      - claude/atlas-generation-pipeline-awtekz

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/atlas-generation-pipeline-awtekz
          fetch-depth: 0

      - name: Apply reviewed canonical migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/one-canonical-call1-apply-v2.yml').read_text().splitlines()
          start = next(i for i,l in enumerate(src) if l.strip() == '- name: Pin authority and rewire Call 1')
          run_i = next(i for i in range(start, len(src)) if src[i].strip() == 'run: |')
          out = []
          for line in src[run_i+1:]:
              if line.startswith('          '): out.append(line[10:])
              elif line.strip() == '': out.append('')
              else: break
          Path('/tmp/apply-call1.sh').write_text('\n'.join(out) + '\n')
          PY
          bash /tmp/apply-call1.sh

      - name: Preserve canonical reference behavior and exact customer text integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Replace the just-migrated wrapper with a source-derived reference path.
          # Both strings come from the SAME vendored buildDesignIQPrompt implementation;
          # only the artboard string is sent to Gemini. The second invocation merely
          # extracts DPAG's own reference wording so there is no second creative copy.
          p = Path('runtime/flat-first-atlas.cjs')
          s = p.read_text()
          start = s.index('function atlasCreativeRules(input, manifest, options = {}) {')
          end = s.index('\n}\n\nfunction atlasPrompt(', start) + 2
          replacement = r'''function atlasCreativeRules(input, manifest, options = {}) {
            const vehicle = input?.vehicle || {};
            const panelLabels = Object.freeze({
              driver: "DRIVER SIDE",
              passenger: "PASSENGER SIDE",
              hood: "HOOD",
              roof: "ROOF",
              front: "FRONT",
              rear: "REAR",
            });
            const panels = manifest.zones.map((zone) => ({
              label: panelLabels[zone.surfaceKey],
              widthInches: Number(zone.trimWidthIn),
              heightInches: Number(zone.trimHeightIn),
            }));
            const colors = Array.isArray(input?.colors) ? input.colors.map(String).join(", ") : "";
            const dpagParams = {
              mode: "artboard",
              prompt: String(input?.brief || ""),
              finish: String(input?.finish || "Gloss"),
              substrate: input?.substrate || "standard",
              companyName: input?.companyName || input?.businessName || undefined,
              mascot: input?.mascot || undefined,
              bulletPoints: Array.isArray(input?.bulletPoints) ? input.bulletPoints : undefined,
              industryType: input?.industry || undefined,
              phone: input?.phone || undefined,
              brandColors: input?.brandColors || colors || undefined,
              fontStyle: input?.fontStyle || undefined,
              qrEnabled: input?.qrEnabled === true,
              vehicleYear: vehicle.year || input?.vehicleYear,
              vehicleMake: vehicle.make || input?.vehicleMake,
              vehicleModel: vehicle.model || input?.vehicleModel,
              visionBoardImages: Array.isArray(input?.visionBoardImages) ? input.visionBoardImages : [],
              visionboard_intent: input?.visionboardIntent || input?.visionboard_intent || "style_inspiration",
              styleDescriptors: input?.styleDescriptors || undefined,
              panels,
            };

            const creative = buildDesignIQPrompt(dpagParams);
            const addenda = [];

            // DPAG's artboard branch predates VisionBoard intent handling. Do not
            // re-write its creative language here: ask the SAME canonical builder
            // for its reference clause and append that exact source-authored clause
            // to the artboard prompt. This is string assembly only, not an AI call.
            if (dpagParams.visionBoardImages.length > 0) {
              const sourceReferencePrompt = buildDesignIQPrompt({
                ...dpagParams,
                mode: "restyle",
                viewType: "side",
              });
              const marker = dpagParams.visionboard_intent === "exact_reference"
                ? "EXACT REFERENCE (REPRODUCE, DO NOT REDESIGN):"
                : "STYLE INSPIRATION:";
              const markerAt = sourceReferencePrompt.indexOf(marker);
              if (markerAt >= 0) {
                const tail = sourceReferencePrompt.slice(markerAt);
                const stops = ["\nHOOD/ROOF CONTINUITY", "\nPHOTOGRAPHIC REALISM LOCK", "\nFinish:", "\nThe wrap covers"]
                  .map((token) => tail.indexOf(token))
                  .filter((index) => index > 0);
                addenda.push(stops.length ? tail.slice(0, Math.min(...stops)).trim() : tail.trim());
              }
            }

            // Customer identity is data, not creative direction. These field-level
            // guards preserve exactly what was supplied and explicitly prohibit
            // Gemini from fabricating missing contact information.
            if (input?.phone) {
              addenda.push(`CUSTOMER PHONE (EXACT): ${String(input.phone)} — preserve every digit exactly.`);
            } else {
              addenda.push("CUSTOMER PHONE: NOT SUPPLIED — invent no phone number; display none anywhere.");
            }
            if (input?.website) {
              addenda.push(`CUSTOMER WEBSITE (EXACT): ${String(input.website)} — display this EXACT URL, character for character.`);
            } else {
              addenda.push("CUSTOMER WEBSITE: NOT SUPPLIED — invent no website; display none anywhere.");
            }

            return [creative, ...addenda].filter(Boolean).join("\n");
          }'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          # Minimal execution filter. Default reproduces the existing set. `--arms B`
          # executes exactly the production Call-1 comparison arm and nothing else.
          p = Path('scripts/designiq-ab-precision.mjs')
          s = p.read_text()
          if 'const ARMS = new Set(' not in s:
              anchor = 'const OUT = args.out || "./ab-evidence";\n'
              if anchor not in s: raise SystemExit('arms insertion seam drifted')
              s = s.replace(anchor, anchor + 'const ARMS = new Set(String(args.arms || "A,A2,B,C,B-configured").split(",").map((v) => v.trim()).filter(Boolean));\n', 1)
          loop = '''  for (const [name, spec] of [
    ["A", { parts: [{ text: controlCommercialPrompt }], model: CONTROL_MODEL, cfg: requests.A.generationConfig, file: "A-control-commercial.png" }],'''
          if loop not in s: raise SystemExit('arms loop seam drifted')
          endneedle = '''    }]]),
  ]) {'''
          if endneedle not in s: raise SystemExit('arms loop tail drifted')
          s = s.replace(endneedle, '''    }]]),
  ].filter(([name]) => ARMS.has(name))) {''', 1)
          p.write_text(s)

          # Existing authority test should now assert the exact RestylePro DPAG
          # wording rather than the retired reconstructed branch wording.
          p = Path('tests/designpro-reference-authority.test.mjs')
          t = p.read_text()
          t = t.replace('assert.match(exact, /EXACT CUSTOMER REFERENCE/);\n  assert.match(exact, /Installer-map examples remain topology-only and must never influence style/);',
                        'assert.match(exact, /EXACT REFERENCE \\(REPRODUCE, DO NOT REDESIGN\\):/);\n  assert.match(exact, /REFERENCE FIREWALL/);\n  assert.match(exact, /TOPOLOGY\\/LAYOUT references only/);')
          p.write_text(t)

          # Lock the arm selector to one execution filter rather than separate call paths.
          Path('tests/designiq-ab-arms.test.mjs').write_text('''import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          test("the A/B harness can execute exactly arm B", () => {
            const source = readFileSync("scripts/designiq-ab-precision.mjs", "utf8");
            assert.match(source, /args\.arms/);
            assert.match(source, /\.filter\(\(\[name\]\) => ARMS\.has\(name\)\)/);
            assert.match(source, /"B"/);
          });
          ''')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Install runtime dependencies
        run: npm ci --prefix runtime

      - name: Focused Call 1 locks
        run: node --test tests/designpanel-vendor-pin.test.mjs tests/atlas-designiq-artboard.test.mjs tests/designpro-reference-authority.test.mjs tests/designiq-ab-arms.test.mjs tests/atlas-fail-fast.test.mjs tests/server-revision-studio.test.mjs

      - name: Full repo node suite
        run: node --test

      - name: Commit only the implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-canonical-call1-apply-v2.yml \
                .github/workflows/one-canonical-call1-apply-v3.yml \
                .github/workflows/one-canonical-call1-apply-v4.yml \
                ops/.call1-v3-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use one canonical DPAG authoring call for A.T.L.A.S."
          git push origin HEAD:claude/atlas-generation-pipeline-awtekz
