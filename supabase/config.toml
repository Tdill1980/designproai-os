project_id = "designproai-os-prod"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = 50000000000

[storage.buckets."wrap-files"]
public = false
file_size_limit = 50000000000
allowed_mime_types = [
  "image/png",
  "image/jpeg",
  "image/webp",
  "image/tiff",
  "image/svg+xml",
  "application/pdf",
  "application/postscript",
  "application/zip",
  "application/json",
]

[auth]
enabled = true
# WHERE AUTH EMAILS SEND THE CUSTOMER.
#
# This was the local dev default, and the live project was on
# http://localhost:3000 -- so every confirmation, magic link and recovery email
# this project sent pointed the customer at an address that does not exist.
#
# Confirmation still succeeded and hid the problem: GoTrue verifies the token at
# the Supabase URL and only THEN redirects, so the account really was confirmed
# while the customer watched ERR_CONNECTION_REFUSED and concluded signup failed.
# Magic links have no such luck -- the session tokens ride in the redirect
# fragment, so a dead redirect means the sign-in is recorded server-side and the
# browser never receives a session.
#
# The allow list is the production origin only. A wildcard back to localhost is
# how a stolen link turns into a stolen session, and nothing that ships needs it;
# add it locally if you are working on auth against this project.
site_url = "https://os.designproai.com"
additional_redirect_urls = [
  "https://os.designproai.com/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[analytics]
enabled = false

# ── DesignPro Edge Functions (migrated from restylepro-os) ──────────────────
# Every function must be listed with verify_jwt = false: unlisted functions
# deploy with verify_jwt = true and the API gateway then rejects slightly
# stale JWTs before function code runs (the recurring-401 root cause in the
# predecessor). Auth happens inside each handler.

[functions.design-panel-ai-generate]
verify_jwt = false

[functions.generate-color-render]
verify_jwt = false

[functions.generate-2d-proof]
