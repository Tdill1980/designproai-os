name: designproai-os

x-runtime: &runtime
  image: "designproai-runtime:${DESIGNPRO_SHA:?missing DESIGNPRO_SHA}"
  pull_policy: never
  restart: unless-stopped
  init: true
  user: "10001:10001"
  env_file:
    - /opt/designproai-os/shared/runtime.env
  environment:
    PORT: "3001"
    GIT_SHA: "${DESIGNPRO_SHA}"
    DESIGNPRO_SPOOL_DIR: "/var/lib/designproai/spool"
  networks:
    - designpro_internal
  healthcheck:
    test: ["CMD", "node", "healthcheck.js"]
    interval: 15s
    timeout: 5s
    retries: 4
    start_period: 45s
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700
  volumes:
    - type: bind
      source: /opt/designproai-os/shared/spool
      target: /var/lib/designproai/spool
      read_only: false
      bind:
        create_host_path: false
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  mem_limit: 6g
  mem_reservation: 1g
  cpus: "3.0"
  pids_limit: 256
  stop_grace_period: 45s
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  runtime-1:
    <<: *runtime
    environment:
      PORT: "3001"
      GIT_SHA: "${DESIGNPRO_SHA}"
      DESIGNPRO_WORKER_ID: "designpro-worker-1"
      DESIGNPRO_SPOOL_DIR: "/var/lib/designproai/spool"
    ports:
      - "127.0.0.1:3001:3001"

  runtime-2:
    <<: *runtime
    environment:
      PORT: "3001"
      GIT_SHA: "${DESIGNPRO_SHA}"
      DESIGNPRO_WORKER_ID: "designpro-worker-2"
      DESIGNPRO_SPOOL_DIR: "/var/lib/designproai/spool"
    ports:
      - "127.0.0.1:3002:3001"

  # The DesignPro edge functions, on this host instead of Supabase. Same files,
  # same /functions/v1/<name> paths, so the migrated frontend and the runtime
  # call exactly what they always did. This is what stops the standalone system
  # needing a second, hand-written implementation of the product.
  functions:
    image: "designproai-functions:${DESIGNPRO_SHA:?missing DESIGNPRO_SHA}"
    pull_policy: never
    restart: unless-stopped
    init: true
    env_file:
      - /opt/designproai-os/shared/runtime.env
    environment:
      PORT: "3003"
      DESIGNPRO_RELEASE_SHA: "${DESIGNPRO_SHA}"
    networks:
      - designpro_internal
    healthcheck:
      test: ["CMD", "deno", "eval", "const r = await fetch('http://127.0.0.1:3003/health'); if (!r.ok) Deno.exit(1);"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    mem_reservation: 512m
    cpus: "2.0"

  gateway:
    image: "designproai-gateway:${DESIGNPRO_SHA:?missing DESIGNPRO_SHA}"
    pull_policy: never
    restart: unless-stopped
    init: true
    user: "10001:10001"
    env_file:
      - /opt/designproai-os/shared/gateway.env
    environment:
      NODE_ENV: "production"
      PORT: "8787"
      DESIGNPRO_RELEASE_SHA: "${DESIGNPRO_SHA}"
    ports:
      - "127.0.0.1:8787:8787"
    networks:
      - designpro_internal
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    mem_reservation: 128m
    cpus: "0.5"
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

networks:
  designpro_internal:
    name: designproai_internal
    driver: bridge
